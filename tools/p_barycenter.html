<!doctype html><meta charset=utf8><body style="margin:0;background:#000">
<canvas id=g width=1080 height=1920 style="display:none"></canvas><canvas id=c width=1080 height=1920></canvas>
<!-- barycenter: two bodies orbiting their common centre of mass, orthographic view of the orbit plane tilted by INC.
     Sizes and distances to scale per act (Pluto-Charon, Earth-Moon, Sun-Jupiter). Surfaces of Pluto/Charon/Sun are illustrative. -->
<script id=fs type=x-shader>
precision highp float;
uniform vec2 R;uniform float T;uniform vec3 SUN;uniform vec3 NRM;
uniform vec4 SP[2];uniform float TY[2];uniform float SPIN[2];uniform float AL[2];
uniform vec2 CEN;uniform float CI,SI;uniform vec4 ORB;uniform sampler2D TEX,CLD,MTX;
float h1(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n3(p);p*=2.02;a*=.5;}return s;}
vec3 sky(vec2 q){vec3 d=normalize(vec3((q-.5*R)/R.x,1.2));vec3 c=vec3(0.);
 for(int l=0;l<2;l++){float sc=l==0?160.:320.;vec3 p=d*sc;vec3 id=floor(p);float hs=h1(id+float(l)*7.);
  if(hs>.88){vec3 sp=id+.5+.35*(vec3(h1(id+1.),h1(id+2.),h1(id+3.))-.5);float dd=length(p-sp);
   c+=pow(hs-.88,1.5)*30.*exp(-dd*dd*30.)*mix(vec3(1.,.85,.7),vec3(.75,.85,1.),h1(id+9.));}}
 c+=vec3(.035,.03,.06)*pow(fbm(d*2.5+3.),2.5)*2.;c+=vec3(.010,.016,.035)*(1.-q.y/R.y);return c;}
vec3 crat(vec3 p,float sc,float dens){vec3 g=p*sc;vec3 i=floor(g),f=fract(g);vec3 o=step(.5,f)-1.;vec3 r=vec3(0.);
 for(int a=0;a<2;a++)for(int b=0;b<2;b++)for(int c=0;c<2;c++){vec3 id=i+o+vec3(float(a),float(b),float(c));float hs=h1(id*1.37+4.1);if(hs>dens)continue;
  vec3 cp=id+.25+.5*vec3(h1(id+1.7),h1(id+2.9),h1(id+5.3));float rad=.18+.22*h1(id+8.8);float d=length(g-cp)/rad;
  r.x=max(r.x,smoothstep(1.,.75,d));r.y=max(r.y,smoothstep(.75,.95,d)*smoothstep(1.2,1.,d));}
 return r;}
// body frame: y = spin axis (orbit normal), +x = toward the partner (tidally locked bodies keep it fixed)
// 0 pluto 1 charon 2 earth 3 moon 4 sun
vec3 alb(float ty,vec3 p){float lat=p.y;
 if(ty<.5){vec3 c=mix(vec3(.74,.62,.48),vec3(.86,.77,.63),fbm(p*3.+2.));c*=.9+.2*fbm(p*12.);
  // dark reddish equatorial belt, strongest on the leading/trailing sides
  float belt=smoothstep(.34,.14,abs(lat+.04+.10*(fbm(p*4.)-.5)))*smoothstep(.35,.62,fbm(p*2.2+vec3(3.,1.,7.))+.25*abs(p.z));
  c=mix(c,vec3(.30,.17,.11)*(.85+.3*fbm(p*9.)),belt*.9);vec3 kk=crat(p,7.,.35);c*=1.-.10*kk.x;c+=vec3(.06)*kk.y;c*=.92+.16*smoothstep(.3,.7,fbm(p*26.+4.));
  // bright 'heart' on the anti-partner side (Tombaugh Regio, illustrative)
  vec3 h1v=normalize(vec3(-.88,.36,.30)),h2v=normalize(vec3(-.84,.26,-.30));float e=.07*(fbm(p*6.)-.5);
  float ht=max(smoothstep(.885,.915,dot(p,h1v)+e),smoothstep(.90,.93,dot(p,h2v)+e));
  c=mix(c,vec3(.95,.92,.86)*(.95+.08*fbm(p*20.)),ht);
  return mix(c,vec3(.80,.74,.63),smoothstep(.78,.92,lat)*.5);}
 if(ty<1.5){vec3 c=vec3(.57,.56,.55)*(.78+.34*fbm(p*3.5+9.));vec3 k=crat(p,8.,.45);c*=1.-.15*k.x;c+=vec3(.08)*k.y;
  float cap=smoothstep(.70,.86,lat+.08*(fbm(p*5.)-.5));return mix(c,vec3(.45,.27,.18)*(.85+.3*fbm(p*7.)),cap*.85);}
 if(ty<2.5){vec2 uv=vec2(atan(p.z,-p.x)/6.28318+.5,acos(clamp(p.y,-1.,1.))/3.14159);
  vec3 c=pow(texture2D(TEX,uv).rgb,vec3(1.9))*1.45;float cl=texture2D(CLD,uv).a;return mix(c,vec3(.86,.88,.90),smoothstep(.08,.85,cl)*.72);}
 vec2 uv=vec2(atan(-p.z,p.x)/6.28318+.5,acos(clamp(p.y,-1.,1.))/3.14159);return pow(texture2D(MTX,uv).rgb,vec3(2.3))*1.35;}
vec3 atm(float ty){return ty<.5?vec3(.35,.55,.95)*.6:ty<1.5?vec3(0.):ty<2.5?vec3(.3,.55,1.):ty<3.5?vec3(0.):vec3(1.,.55,.22);}
vec3 rot(vec3 p,float s){float ca=cos(s),sa=sin(s);return vec3(ca*p.x+sa*p.z,p.y,-sa*p.x+ca*p.z);}
vec3 surf(float ty,vec3 n,float spn){
 if(ty>3.5){float mu=max(n.z,0.);float I=1.-.70*(1.-mu)-.12*(1.-mu*mu);   // limb darkening
  vec3 ex=vec3(1.,0.,0.),ez=cross(ex,NRM);vec3 p=vec3(dot(n,ex),dot(n,NRM),dot(n,ez));
  float gr=fbm(p*38.+vec3(T*.15,0.,0.))-.5,gr2=fbm(p*9.+3.)-.5;
  return vec3(1.,.70,.34)*1.38*I*(1.+.22*gr+.08*gr2);}
 vec3 ex=vec3(1.,0.,0.),ez=cross(ex,NRM);vec3 p=rot(vec3(dot(n,ex),dot(n,NRM),dot(n,ez)),spn);
 vec3 a=alb(ty,p);float ndl=dot(n,SUN);float dif=smoothstep(-.08,.35,ndl)*max(ndl+.08,0.)/1.08;
 float mu=max(n.z,0.);dif*=.55+.45*pow(mu,.4);
 vec3 c=a*dif*1.25;float rim=pow(1.-mu,3.)*smoothstep(-.2,.5,ndl);c+=atm(ty)*rim*.55;c+=a*.03;return c;}
// orbit circle in the tilted plane: screen distance (px) and depth of the plane point under pixel q
float orbitLine(vec2 q,float r,out float zl){vec2 d=q-CEN;float X=d.x,Y=-d.y/CI;float rho=max(length(vec2(X,Y)),1e-3);
 zl=-Y*SI;float g=length(vec2(X/rho,(Y/rho)/CI));float dist=abs(rho-r)/g;
 float dash=step(.42,fract(atan(Y,X)*r/(6.28318*14.)));return smoothstep(1.9,.6,dist)*dash;}
void main(){
 vec2 q=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);
 vec3 col=sky(q);
 // glows
 for(int k=0;k<2;k++){vec4 S=SP[k];if(S.w<=0.||AL[k]<=0.)continue;float dd=length(q-S.xy)/S.w;
  if(TY[k]>3.5)col+=vec3(1.,.55,.22)*(exp(-max(dd-1.,0.)*9.)*.12+exp(-max(dd-1.,0.)*1.6)*.05)*AL[k]*step(1.,dd);
  else col+=atm(TY[k])*exp(-max(dd-1.,0.)*7.)*.10*AL[k]*step(1.,dd);}
 // front-most sphere
 float best=-1e9;int bi=-1;vec3 bn=vec3(0.);
 for(int k=0;k<2;k++){vec4 S=SP[k];if(S.w<=0.||AL[k]<=0.)continue;vec2 d=q-S.xy;float r2=dot(d,d);float rr=S.w+.75;if(r2>rr*rr)continue;
  float zz=sqrt(max(S.w*S.w-r2,0.));if(S.z+zz>best){best=S.z+zz;bi=k;bn=vec3(d.x,-d.y,zz)/S.w;}}
 // orbit lines (hidden where a body is in front of them)
 for(int k=0;k<2;k++){float r=k==0?ORB.x:ORB.y,a=k==0?ORB.z:ORB.w;if(a<=0.||r<=0.)continue;float zl;float l=orbitLine(q,r,zl);
  if(l>0.&&!(bi>=0&&best>zl))col+=vec3(1.,.85,.45)*l*a*.75;}
 if(bi>=0){vec4 S;float ty,spn,al;
  for(int k=0;k<2;k++){if(k==bi){S=SP[k];ty=TY[k];spn=SPIN[k];al=AL[k];}}
  float dpx=length(q-S.xy);float cov=clamp(S.w-dpx+.5,0.,1.);
  vec3 c=surf(ty,normalize(bn),spn);
  col=mix(col,c,cov*al);}
 col=1.-exp(-col*1.1);col=pow(col,vec3(.95));gl_FragColor=vec4(col,1.);}
</script>
<script src="tex.js"></script><script src="texm.js"></script><script>
const W=1080,H=1920;const g=document.getElementById('g'),gl=g.getContext('webgl',{preserveDrawingBuffer:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw gl.getProgramInfoLog(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function mkTex(src,unit,cb){const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);cb()};im.src=src;}
let _tl=0;const _ok=()=>{_tl++;if(_tl==3){window.TEXREADY=true}};
mkTex(TEXA,0,_ok);mkTex(TEXC,1,_ok);mkTex(TEXM,2,_ok);
gl.uniform1i(U('TEX'),0);gl.uniform1i(U('CLD'),1);gl.uniform1i(U('MTX'),2);
const c=document.getElementById('c'),x=c.getContext('2d');
</script>
