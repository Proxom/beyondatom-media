<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- boil-four-worlds (series "Who Lands / Wins First?"): the same pot of water on the same stove on Mars, Earth, Titan and Venus. Which boils last?
     Thought experiment: only the air pressure changes (no heat from Venus's air, no cold from Mars or Titan). Water starts at 20 C; all four pots warm along the same curve.
     Boiling points from IAPWS-IF97 (the standard water/steam tables, as in NIST Chemistry WebBook) at each surface pressure:
       Mars 6.36 mbar (NASA NSSDC Mars fact sheet, mean; varies 4.0-8.7 mbar) -> 0.55 C, so water at 20 C boils at once;
       Earth 1.013 bar -> 100 C; Titan 1.467 bar (Huygens HASI, Fulchignoni et al. 2005) -> 110.7 C; Venus 92 bar (NSSDC) -> 304.9 C.
     The temperature curve is not real time (sped up and uneven); the order is what matters. -->
<script>
const W=1080,H=1920,FPS=30,D=23.6,LOOP=23.3;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const KN=[[0,20],[10.5,100],[14.5,110.7],[20.2,304.9],[30,400]];
function Tof(t){for(let i=0;i<KN.length-1;i++){const [a,va]=KN[i],[b,vb]=KN[i+1];if(t<=b)return lerp(va,vb,cl((t-a)/(b-a)))}return 400}
const ROWS=[540,764,988,1212],RH=226;
const WD=[
 {n:'MARS',p:'AIR: 0.006 BAR',bp:0.55,bpS:'0.5 °C',sky:['#5c3420','#a8704a','#d2a27a'],gr:['#8a3e1e','#3e180a'],tb:-1,rank:1},
 {n:'EARTH',p:'AIR: 1 BAR',bp:100,bpS:'100 °C',sky:['#123c70','#3f7fc0','#8cc0ea'],gr:['#3c7a2c','#1b3d14'],tb:10.5,rank:2},
 {n:'TITAN',p:'AIR: 1.5 BAR',bp:110.7,bpS:'111 °C',sky:['#3a2a10','#7a5a20','#b89048'],gr:['#5a4526','#241a0c'],tb:14.5,rank:3},
 {n:'VENUS',p:'AIR: 92 BAR',bp:304.9,bpS:'305 °C',sky:['#5a300c','#a8641c','#d9a04a'],gr:['#5b3a1f','#2c1a0c'],tb:20.2,rank:4}];
const REVEAL=[4.2,10.5,14.5,20.2]; // when the voice names each world
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(23);const STARS=[];for(let i=0;i<220;i++)STARS.push([R()*W,R()*540,R()*1.6+.3,R()]);const BUB=[];for(let i=0;i<40;i++)BUB.push([R(),R(),R()]);const STM=[];for(let i=0;i<14;i++)STM.push([R(),R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=18;x.fillText(s,px,py);x.shadowBlur=5;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const PX=470; // pot centre x
function heatbar(t){// shared stove temperature bar (graphics only, no text): 0-320 C across, a marker per boiling point
 const x0=90,x1=990,y=1540,h=46,T=Tof(t),fx=v=>x0+(x1-x0)*cl(v/320);
 x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.roundRect(x0-6,y-6,x1-x0+12,h+12,28);x.fill();
 const g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,'#4aa3ff');g.addColorStop(.35,'#ffb347');g.addColorStop(1,'#ff4a2a');x.fillStyle=g;x.beginPath();x.roundRect(x0,y,Math.max(h,fx(Math.min(T,304.9))-x0),h,23);x.fill();
 for(const w of WD){const mx=fx(w.bp),on=w.tb<0||t>=w.tb;x.fillStyle=on?'#ffd166':'rgba(255,255,255,.55)';x.beginPath();x.moveTo(mx,y-12);x.lineTo(mx-12,y-30);x.lineTo(mx+12,y-30);x.closePath();x.fill()}}
function row(i,t){const w=WD[i],y0=ROWS[i],gy=y0+RH-46;
 let g=x.createLinearGradient(0,y0,0,gy);g.addColorStop(0,w.sky[0]);g.addColorStop(.6,w.sky[1]);g.addColorStop(1,w.sky[2]);x.fillStyle=g;x.fillRect(0,y0,W,gy-y0);
 g=x.createLinearGradient(0,gy,0,y0+RH);g.addColorStop(0,w.gr[0]);g.addColorStop(1,w.gr[1]);x.fillStyle=g;x.fillRect(0,gy,W,y0+RH-gy);
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,y0+RH-3,W,3);
 const T=Tof(t),boil=w.tb<0?true:t>=w.tb,heatK=cl((Math.min(T,w.bp)-20)/285);
 // stove + flame
 x.fillStyle='#2a2d33';x.beginPath();x.roundRect(PX-120,gy-30,240,30,6);x.fill();x.fillStyle='#16181c';x.fillRect(PX-100,gy,16,40);x.fillRect(PX+84,gy,16,40);
 for(let k=-4;k<=4;k++){const fh=18+8*Math.sin(t*20+k*1.7);x.fillStyle='rgba(90,160,255,.85)';x.beginPath();x.ellipse(PX+k*20,gy-34-fh/2,6,fh/2,0,0,7);x.fill()}
 // pot
 const pb=gy-38,ph=122,pw=250;g=x.createLinearGradient(PX-pw/2,0,PX+pw/2,0);g.addColorStop(0,'#6f747c');g.addColorStop(.35,'#dfe3e8');g.addColorStop(.6,'#aab0b8');g.addColorStop(1,'#565a61');
 x.fillStyle=g;x.beginPath();x.moveTo(PX-pw/2,pb-ph);x.lineTo(PX+pw/2,pb-ph);x.lineTo(PX+pw/2-8,pb);x.lineTo(PX-pw/2+8,pb);x.closePath();x.fill();
 x.fillStyle='#3a3d42';x.fillRect(PX-pw/2-34,pb-ph+16,34,10);x.fillRect(PX+pw/2,pb-ph+16,34,10);
 // water surface (glow warmer with temperature)
 const wy=pb-ph+16;const wc=`rgb(${Math.round(lerp(70,150,heatK))},${Math.round(lerp(150,170,heatK))},${Math.round(lerp(230,200,heatK))})`;
 x.fillStyle='#2a2d33';x.beginPath();x.ellipse(PX,pb-ph,pw/2,16,0,0,7);x.fill();x.fillStyle=wc;x.beginPath();x.ellipse(PX,wy,pw/2-10,11,0,0,7);x.fill();
 // bubbles + steam when boiling
 if(boil){const st=w.tb<0?1:cl((t-w.tb)/0.6),vig=w.n==='MARS'?1.4:1;
  for(const b of BUB){const ph2=(b[1]+t*(1.2+b[2])*vig)%1;const bx=PX+(b[0]-.5)*(pw-40),by=wy-ph2*26*vig;x.strokeStyle='rgba(255,255,255,'+(0.8*st*(1-ph2))+')';x.lineWidth=2;x.beginPath();x.arc(bx,by,3+b[2]*5,0,7);x.stroke()}
  for(const s of STM){const ph2=(s[1]+t*0.5*(0.6+s[2]))%1;const sx=PX+(s[0]-.5)*(pw-60)+Math.sin(ph2*6+s[2]*5)*18,sy=wy-20-ph2*120;if(sy<y0+30)continue;x.fillStyle='rgba(240,245,255,'+(0.28*st*Math.sin(ph2*Math.PI))+')';x.beginPath();x.arc(sx,sy,14+ph2*26,0,7);x.fill()}}
 // labels
 const rv=t>=REVEAL[i];
 txt(w.n,70,y0+70,64,'#fff',1,'Anton','left');txt(w.p,70,y0+118,34,'#f3e6c8',1,'Anton','left');
 // readout
 let s,col='#fff';if(w.tb<0){s=t>=REVEAL[0]?'BOILS AT '+w.bpS:'BOILING!';col='#ffd166'}else if(boil){s=w.bpS;col='#ffd166'}else s=Math.round(T)+' °C';
 const pop=(w.tb>0&&boil)?1+.15*Math.exp(-(t-w.tb)/.15):1;
 txt(s,795,y0+96,(w.tb<0&&t>=REVEAL[0]?42:74)*pop,col,1,'Anton','center');
 if(boil&&w.tb>0)txt('BOILING!',795,y0+150,40,'#ffe9b0',ease((t-w.tb)/.25),'Anton');
 if(w.tb<0&&t<REVEAL[0])txt('ALREADY?!',795,y0+150,44,'#ffffff',0.5+0.5*Math.sin(t*6),'Anton');
 // rank badge after the voice names it
 if(rv){const a=ease((t-REVEAL[i])/.25);x.save();x.globalAlpha=a;x.fillStyle=w.rank==4?'#ff6b4a':'rgba(0,0,0,.55)';x.beginPath();x.arc(PX+182,y0+52,30,0,7);x.fill();x.restore();
  txt(['1ST','2ND','3RD','LAST'][w.rank-1],PX+182,y0+64,w.rank==4?26:30,'#fff',a,'Anton')}}
const CARDS=[[-1,4.2,'SAME POT, 4 WORLDS:','WHICH BOILS LAST?'],[4.2,9.8,'THIN AIR = WATER BOILS','BARELY ABOVE FREEZING'],[9.8,12.0,'EARTH: 100 °C','AT SEA LEVEL'],[12.0,15.6,'THICKER AIR ON TITAN:','ABOUT 111 °C'],
 [15.6,20.2,'VENUS: AIR PRESSURE','ABOUT 90 TIMES EARTH\'S'],[20.2,21.3,'WATER BOILS AT','ABOUT 305 °C!'],[21.3,22.6,'DID YOU','GUESS RIGHT?'],[22.6,23.3,'FOLLOW →','MORE EVERY DAY'],[23.3,D+1,'SAME POT, 4 WORLDS:','WHICH BOILS LAST?']];
function cards(t){if(t<4.2||t>=23.3)txt('ONLY THE AIR PRESSURE CHANGES',540,530,30,'#e8eefc',1,'Anton');for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,76,840),fit(l2,76,840));txt(l1,495,400,sz,'#fff',al);txt(l2,495,400+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;
 const u=t>=LOOP?t-D:t;
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05070d');g.addColorStop(1,'#0b0f1a');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const st of STARS){x.globalAlpha=.3+.5*st[3];x.fillStyle='#fff';x.beginPath();x.arc(st[0],st[1],st[2],0,7);x.fill()}x.globalAlpha=1;
 g=x.createLinearGradient(0,1436,0,H);g.addColorStop(0,'#2c1a0c');g.addColorStop(1,'#120a04');x.fillStyle=g;x.fillRect(0,1436,W,H-1436);heatbar(u);
 for(let i=0;i<4;i++)row(i,u);
 x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,ROWS[0],W,3);
  cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
