<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- venus-stand (series "What If…?" / Your Body): what standing on Venus would do to you.
     NASA Science, Venus Facts: surface about 467 C, hot enough to melt lead; pressure about 93 times Earth's sea level,
       "the same force as being more than 3,000 feet underwater on Earth (930 meters)"; longest Venera survivor lasted two hours.
     NASA NSSDC Venus fact sheet: mean surface temperature 737 K (464 C), surface pressure 92 bar.
     NASA NSSDC Venera 13 image page: survived on the surface for 2 hours, 7 minutes (1 March 1982).
     Lead melts at 327.5 C (Royal Society of Chemistry periodic table).
     Drawing: landscape, diver and lander are illustrations; the depth counter uses about 10 m of seawater per extra bar. -->
<script>
const W=1080,H=1920,FPS=30,D=25.5;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(77);
const ROCKS=[];for(let i=0;i<46;i++){const z=R();ROCKS.push([R()*1.6-0.3,z,R(),R(),R()])}ROCKS.sort((a,b)=>a[1]-b[1]);
const HILLS=[];for(let i=0;i<=24;i++)HILLS.push(R());
const SNOW=[];for(let i=0;i<180;i++)SNOW.push([R()*W,R(),R()*2.5+0.8,R()]);
const BUB=[];for(let i=0;i<26;i++)BUB.push([R(),R(),R()]);
const DUST=[];for(let i=0;i<90;i++)DUST.push([R()*W,R()*H,R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
// ---------- Venus surface ----------
const HZ=1060; // horizon y
function venus(t,heat,push){x.save();const s=1+push;x.translate(W/2,HZ+200);x.scale(s,s);x.translate(-W/2,-(HZ+200));
 let g=x.createLinearGradient(0,-200,0,HZ);g.addColorStop(0,'#5a2a08');g.addColorStop(.45,'#a65a14');g.addColorStop(.85,'#e0a040');g.addColorStop(1,'#f2c870');x.fillStyle=g;x.fillRect(-200,-300,W+400,HZ+300);
 // cloud deck bands drifting
 for(let i=0;i<7;i++){const yy=120+i*120,off=(t*(14+i*5)+i*170)%900;x.fillStyle='rgba(255,210,140,'+(0.06+0.03*(i%2))+')';
  for(let k=-1;k<3;k++){x.beginPath();x.ellipse(off+k*900-300,yy,520,34+i*6,0,0,7);x.fill()}}
 // distant hills
 x.fillStyle='#8a4a18';x.beginPath();x.moveTo(-200,HZ);for(let i=0;i<=24;i++){x.lineTo(-200+i*(W+400)/24,HZ-30-HILLS[i]*90-(i==9||i==10?120:0))}x.lineTo(W+200,HZ);x.fill();
 x.fillStyle='rgba(240,190,110,.35)';x.fillRect(-200,HZ-140,W+400,140);
 // ground
 g=x.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#b0662a');g.addColorStop(.3,'#7a3e16');g.addColorStop(1,'#2c1406');x.fillStyle=g;x.fillRect(-200,HZ,W+400,H-HZ+200);
 // flat rock slabs in perspective
 for(const r of ROCKS){const z=r[1],yy=HZ+20+Math.pow(z,1.6)*(H-HZ+80),sc=0.15+z*1.4,xx=W/2+(r[0]-0.65)*W*(0.6+z*1.6);
  const w=(90+r[2]*160)*sc,h=(12+r[3]*16)*sc;x.fillStyle='rgba(60,26,8,'+(0.5+0.4*z)+')';x.beginPath();x.moveTo(xx-w,yy);x.lineTo(xx-w*0.7,yy-h);x.lineTo(xx+w*0.8,yy-h*1.1);x.lineTo(xx+w,yy+h*0.2);x.closePath();x.fill();
  x.fillStyle='rgba(230,150,80,'+(0.25+0.2*z)+')';x.beginPath();x.moveTo(xx-w*0.7,yy-h);x.lineTo(xx+w*0.8,yy-h*1.1);x.lineTo(xx+w*0.6,yy-h*0.7);x.lineTo(xx-w*0.6,yy-h*0.6);x.closePath();x.fill()}
 // heat glow
 if(heat>0){g=x.createLinearGradient(0,HZ-300,0,H);g.addColorStop(0,'rgba(255,90,20,0)');g.addColorStop(1,'rgba(255,70,10,'+(0.45*heat)+')');x.fillStyle=g;x.fillRect(-200,HZ-300,W+400,H);}
 // shimmer bands
 for(let i=0;i<5;i++){const yy=HZ-40+i*26+Math.sin(t*3+i)*6;x.fillStyle='rgba(255,220,160,'+(0.05+0.04*heat)+')';x.fillRect(-200,yy,W+400,6)}
 x.restore();
 // floating haze dust
 for(const d of DUST){const xx=(d[0]+t*(20+d[2]*30))%W,yy=(d[1]+Math.sin(t+d[3]*6)*20);x.fillStyle='rgba(255,215,150,'+(0.10+0.12*d[3])+')';x.beginPath();x.arc(xx,yy,1.5+d[2]*2.5,0,7);x.fill()}}
function person(cx,by,hh,col,al){x.save();x.globalAlpha=al;x.fillStyle=col;const u=hh/8;
 x.beginPath();x.arc(cx,by-hh+u*0.7,u*0.75,0,7);x.fill();
 x.beginPath();x.roundRect(cx-u*1.0,by-hh+u*1.6,u*2.0,u*3.2,u*0.5);x.fill();
 x.beginPath();x.roundRect(cx-u*0.95,by-u*3.4,u*0.85,u*3.4,u*0.3);x.fill();x.beginPath();x.roundRect(cx+u*0.1,by-u*3.4,u*0.85,u*3.4,u*0.3);x.fill();
 x.beginPath();x.roundRect(cx-u*1.55,by-hh+u*1.8,u*0.55,u*2.9,u*0.25);x.fill();x.beginPath();x.roundRect(cx+u*1.0,by-hh+u*1.8,u*0.55,u*2.9,u*0.25);x.fill();x.restore()}
// ---------- Ocean ----------
const OD0=4.3,OD1=9.6,ODMAX=930;
function depthAt(t){return ODMAX*ease((t-OD0)/(OD1-OD0))}
function ocean(t){const d=depthAt(t),k=d/ODMAX;
 const top=[lerp(40,0,Math.pow(k,.5)),lerp(130,8,Math.pow(k,.5)),lerp(200,30,Math.pow(k,.6))],bot=[lerp(10,0,k),lerp(60,4,k),lerp(120,16,k)];
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${top.map(Math.round)})`);g.addColorStop(1,`rgb(${bot.map(Math.round)})`);x.fillStyle=g;x.fillRect(0,0,W,H);
 // light rays fade with depth
 const ra=0.18*(1-cl(k*3));if(ra>0.01){for(let i=0;i<6;i++){const xx=120+i*170+Math.sin(t*.7+i)*40;g=x.createLinearGradient(0,0,0,1400);g.addColorStop(0,'rgba(200,240,255,'+ra+')');g.addColorStop(1,'rgba(200,240,255,0)');x.fillStyle=g;
  x.beginPath();x.moveTo(xx-30,0);x.lineTo(xx+30,0);x.lineTo(xx+160,1400);x.lineTo(xx+40,1400);x.closePath();x.fill()}}
 // marine snow rising past (we sink)
 const sp=d*2.2+t*40;for(const s of SNOW){const yy=((s[1]*H*1.3-sp*(0.4+s[3]))%(H*1.3)+H*1.3)%(H*1.3)-100;x.fillStyle='rgba(220,235,255,'+(0.25+0.4*s[3])+')';x.beginPath();x.arc(s[0],yy,s[2],0,7);x.fill()}
 // depth ruler on the left
 x.save();x.strokeStyle='rgba(200,230,255,.55)';x.fillStyle='rgba(200,230,255,.8)';x.lineWidth=3;x.font='34px Anton';x.textAlign='left';
 const ppm=6;for(let m=Math.floor((d-180)/50)*50;m<d+200;m+=50){if(m<0)continue;const yy=1100+(m-d)*ppm;if(yy<365||yy>1430)continue;x.beginPath();x.moveTo(70,yy);x.lineTo(m%100==0?140:110,yy);x.stroke();if(m%100==0)x.fillText(m+' m',150,yy+12)}x.restore();
 // diver (sinking, centred), with bubbles
 const dy=1100+Math.sin(t*1.3)*10;
 for(const b of BUB){const ph=(b[1]+t*0.6*(0.6+b[2]))%1;const xx=600+Math.sin(ph*8+b[0]*6)*20+b[0]*30,yy=dy-260-ph*700;x.strokeStyle='rgba(220,240,255,'+(0.6*(1-ph))+')';x.lineWidth=2;x.beginPath();x.arc(xx,yy,4+b[2]*6,0,7);x.stroke()}
 {const lg=x.createRadialGradient(560,dy,20,560,dy,420);lg.addColorStop(0,'rgba(120,190,255,'+(0.10+0.30*k)+')');lg.addColorStop(1,'rgba(120,190,255,0)');x.fillStyle=lg;x.beginPath();x.arc(560,dy,420,0,7);x.fill();}
 x.save();x.translate(560,dy);x.rotate(0.12);x.shadowColor='rgba(150,210,255,.9)';x.shadowBlur=18;person(0,170,340,'rgba(18,40,62,1)',1);
 x.fillStyle='rgba(5,15,25,.95)';x.beginPath();x.roundRect(-58,-130,34,110,12);x.fill();// tank
 x.beginPath();x.moveTo(-40,170);x.lineTo(-90,240);x.lineTo(-20,232);x.fill();x.beginPath();x.moveTo(30,170);x.lineTo(70,250);x.lineTo(10,236);x.fill();x.restore();
 // squeeze arrows growing with pressure
 const sq=k;if(sq>0.05){x.save();x.globalAlpha=0.35+0.5*sq;x.strokeStyle='#9fd4ff';x.lineWidth=8;x.lineCap='round';
  for(const [ax,ay,dx,dy2] of [[560,820,0,1],[560,1360,0,-1],[330,1090,1,0],[790,1090,-1,0]]){const L=40+60*sq,o=40*sq;x.beginPath();x.moveTo(ax-dx*(L+o),ay-dy2*(L+o));x.lineTo(ax-dx*o,ay-dy2*o);x.stroke();
   x.beginPath();x.moveTo(ax-dx*o-dy2*16-dx*22,ay-dy2*o-dx*16-dy2*22);x.lineTo(ax-dx*o,ay-dy2*o);x.lineTo(ax-dx*o+dy2*16-dx*22,ay-dy2*o+dx*16-dy2*22);x.stroke()}x.restore()}
 // counters
 const done=t>=OD1;const pop=done?1+.12*Math.exp(-(t-OD1)/.15):1;
 txt(Math.round(d).toLocaleString('en-US')+' m',540,700,150*pop,done?'#ffd166':'#fff',1);
 txt('PRESSURE: '+Math.max(1,Math.round(1+d/10.06))+' TIMES',540,790,62,'#bfe3ff',1)}
// ---------- Heat ----------
const HT0=11.6,HT1=15.6;
function tempAt(t){return lerp(15,464,ease((t-HT0)/(HT1-HT0)))}
function heat(t){const T=tempAt(t),k=(T-15)/449;venus(t,0.3+0.7*k,0.05+0.01*(t-11));
 // thermometer
 const tx=800,ty0=1300,ty1=620,bulb=1360;x.save();x.fillStyle='rgba(20,10,5,.7)';x.beginPath();x.roundRect(tx-34,ty1-40,68,ty0-ty1+60,34);x.fill();x.beginPath();x.arc(tx,bulb,62,0,7);x.fill();
 const ly=lerp(ty0,ty1,(T-0)/500);x.fillStyle='#ff3b1f';x.beginPath();x.roundRect(tx-18,ly,36,ty0-ly+40,18);x.fill();x.beginPath();x.arc(tx,bulb,46,0,7);x.fill();
 // lead marker
 const my=lerp(ty0,ty1,327/500);x.strokeStyle='#cfd6e0';x.lineWidth=5;x.beginPath();x.moveTo(tx-70,my);x.lineTo(tx-34,my);x.stroke();x.restore();
 const la=t>=12.6?ease((t-12.6)/.3):0;txt('LEAD MELTS',tx-90,my-8,56,'#e6ecf5',la,'Anton','right');txt('327 °C',tx-90,my+52,56,'#e6ecf5',la,'Anton','right');
 // lead ingot -> puddle
 const melt=cl((T-327)/60);const lx=330,lyb=1330;x.save();x.translate(lx,lyb);x.scale(1.5,1.5);x.translate(-lx,-lyb);x.save();x.fillStyle='#8d96a3';
 const hgt=lerp(120,18,ease(melt)),wid=lerp(190,330,ease(melt));x.beginPath();x.roundRect(lx-wid/2,lyb-hgt,wid,hgt,lerp(10,40,melt));x.fill();
 x.fillStyle='rgba(255,255,255,'+(0.35-0.2*melt)+')';x.beginPath();x.roundRect(lx-wid/2+10,lyb-hgt+8,wid-20,Math.max(4,hgt*0.18),6);x.fill();
 if(melt>0){x.fillStyle='rgba(255,140,60,'+(0.25*melt)+')';x.beginPath();x.ellipse(lx,lyb,wid*0.62,26,0,0,7);x.fill()}x.restore();x.restore();
 txt('LEAD',lx,lyb-hgt*1.5-24,56,'#e6ecf5',1,'Anton');
 const done=t>=HT1;const pop=done?1+.12*Math.exp(-(t-HT1)/.15):1;txt(Math.round(T)+' °C',540,720,150*pop,done?'#ffd166':'#fff',1)}
// ---------- Lander ----------
const LT0=17.6,LT1=21.6;
function lander(t){venus(t,0.6,0.08+0.006*(t-17));const cx=540,by=1290,s=1.25;
 x.save();x.translate(cx,by);x.scale(s,s);
 // landing ring
 let g=x.createLinearGradient(-170,0,170,0);g.addColorStop(0,'#5d5a55');g.addColorStop(.5,'#c8c2b6');g.addColorStop(1,'#4a4743');x.fillStyle=g;
 x.beginPath();x.ellipse(0,0,175,40,0,0,7);x.fill();x.fillStyle='rgba(30,20,10,.6)';x.beginPath();x.ellipse(0,-6,120,24,0,0,7);x.fill();
 // struts
 x.strokeStyle='#7d776e';x.lineWidth=10;for(const sx of [-110,-40,40,110]){x.beginPath();x.moveTo(sx,-8);x.lineTo(sx*0.45,-110);x.stroke()}
 // pressure sphere
 g=x.createRadialGradient(-40,-230,20,0,-180,140);g.addColorStop(0,'#f2ece0');g.addColorStop(.6,'#a8a196');g.addColorStop(1,'#4c4842');x.fillStyle=g;x.beginPath();x.arc(0,-185,115,0,7);x.fill();
 x.fillStyle='#3b3833';x.fillRect(-30,-330,60,60);// neck
 // drag disk
 g=x.createLinearGradient(-200,0,200,0);g.addColorStop(0,'#55524c');g.addColorStop(.5,'#d8d2c6');g.addColorStop(1,'#4a4743');x.fillStyle=g;x.beginPath();x.ellipse(0,-335,200,30,0,0,7);x.fill();
 x.fillStyle='#2e2b27';x.beginPath();x.roundRect(-14,-420,28,90,8);x.fill();// antenna
 x.fillStyle='#1d1a17';x.beginPath();x.arc(60,-200,14,0,7);x.fill();// camera window
 x.restore();
 // heat haze over lander + dimming after the record
 const end=t>=LT1?ease((t-LT1)/.8):0;if(end>0){x.fillStyle='rgba(40,10,0,'+(0.35*end)+')';x.fillRect(0,0,W,H)}
 const sec=Math.round(127*60*ease((t-LT0)/(LT1-LT0)));const hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;
 const done=t>=LT1;const pop=done?1+.12*Math.exp(-(t-LT1)/.15):1;
 txt(hh+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'),540,720,140*pop,done?'#ffd166':'#fff',1);
 if(done)txt('2 HOURS 7 MINUTES',540,800,58,'#ffe2b0',ease((t-LT1)/.3))}
// ---------- cards ----------
const CARDS=[[-1,2.2,'WHAT IF YOU STOOD','ON VENUS?'],[2.2,4.3,'GUESS: HOW DEEP','UNDERWATER?'],[4.3,9.6,'THE AIR PRESSES','LIKE THE DEEP SEA'],[9.6,11.3,'MORE THAN','930 m UNDERWATER'],
 [11.3,17.3,'OVER 460 °C:','HOT ENOUGH TO MELT LEAD'],[17.3,22.7,'TOUGHEST LANDER EVER:','VENERA 13 (1982)'],[22.7,24.4,'HOW LONG','WOULD YOU LAST?'],[24.4,25.1,'FOLLOW →','MORE EVERY DAY'],[25.1,D+1,'WHAT IF YOU STOOD','ON VENUS?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,840),fit(l2,80,840));const y0=402;const g=x.createLinearGradient(0,300,0,560);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.45*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,300,W,260);
 txt(l1,495,y0,sz,'#fff',al);txt(l2,495,y0+sz*1.08,sz,'#ffd166',al)}}
function hook(t){venus(t,0.15,0.03*Math.min(t,4.3)/4.3+0.0);person(540,1420,620,'rgba(25,12,4,.94)',1);
 // pressure ripples around the person
 for(let i=0;i<3;i++){const ph=((t*0.6)+i/3)%1;x.strokeStyle='rgba(255,230,180,'+(0.35*(1-ph))+')';x.lineWidth=4;x.beginPath();x.ellipse(540,1110,150+ph*300,340+ph*320,0,0,7);x.stroke()}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
 if(t<OD0||t>=25.1){hook(t>=25.1?t-D:t)}
 else if(t<11.3){ocean(t);if(t<OD0+0.4){x.fillStyle='rgba(255,220,170,'+(1-(t-OD0)/0.4)*0.8+')';x.fillRect(0,0,W,H)}}
 else if(t<17.3){heat(t);if(t<11.6){x.fillStyle='rgba(0,0,0,'+(1-(t-11.3)/0.3)*0.7+')';x.fillRect(0,0,W,H)}}
 else{lander(t)}
 cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
