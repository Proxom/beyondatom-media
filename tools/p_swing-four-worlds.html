<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- swing-four-worlds (series "Who Lands / Wins First?"): the same swing (2.5 m rope, let go from 35 degrees) on Earth, Mars, the Moon and Pluto,
     in real time. Exact pendulum motion (numerical, not the small-angle formula): periods Earth 3.25 s, Mars 5.27 s, Moon 7.99 s, Pluto 12.92 s.
     Surface gravity from the NASA NSSDC fact sheets: Earth 9.82, Mars 3.73, Moon 1.62, Pluto 0.62 m/s^2. No air drag, no friction.
     Landscapes are illustrative; the swing set, rope and astronaut are drawn to one scale in every lane. -->
<script>
const W=1080,H=1920,FPS=30,D=30.0,LR=2.5,A0=35*Math.PI/180,T0=-0.6;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)};
const LT=[520,750,980,1210],LH=230,GOFF=36,PX=64;  // lane tops, lane height, ground strip, px per metre
const WD=[
 {n:'EARTH',g:9.82,sky:['#1d5eb0','#5d9be0','#b6dcf6'],hill:['#6e9a5c','#557f46'],gr:['#5e8f3a','#3b2a1a'],stars:0},
 {n:'MARS',g:3.73,sky:['#9c6a45','#c99368','#e9c49a'],hill:['#b06a42','#93512f'],gr:['#b4552d','#5a2412'],stars:0},
 {n:'MOON',g:1.62,sky:['#000','#030305','#0b0b10'],hill:['#7e7d7a','#666562'],gr:['#a3a19c','#3a3937'],stars:1,disc:{x:1000,y:40,r:20,c:['#d6ecff','#3f7fcf','#11366a']}},
 {n:'PLUTO',g:0.62,sky:['#000','#02030a','#0d1020'],hill:['#c9ab8f','#a88466'],gr:['#dcc6aa','#5b4434'],stars:1,disc:{x:995,y:48,r:26,c:['#d9d6d2','#8f8b86','#3c3a37']},tholin:1}];
// exact pendulum: integrate theta(t) once per world (RK4, 1 ms), store at 1/600 s
for(const w of WD){const dt=1/600;let th=A0,om=0;w.th=[th];const f=(a)=>-w.g/LR*Math.sin(a);
 for(let i=0;i<600*(D+2);i++){const k1=om,l1=f(th),k2=om+l1*dt/2,l2=f(th+k1*dt/2),k3=om+l2*dt/2,l3=f(th+k2*dt/2),k4=om+l3*dt,l4=f(th+k3*dt);
  th+=dt/6*(k1+2*k2+2*k3+k4);om+=dt/6*(l1+2*l2+2*l3+l4);w.th.push(th)}
 // period: time between successive maxima (theta near A0 with omega changing sign)
 let last=0;w.peaks=[0];for(let i=2;i<w.th.length-1;i++){if(w.th[i]>w.th[i-1]&&w.th[i]>=w.th[i+1]&&w.th[i]>A0*0.9){w.peaks.push(i/600)}}
 w.T=w.peaks[1]}
const thAt=(w,s)=>{if(s<=0)return A0;const f=s*600,i=Math.floor(f),k=f-i;return w.th[Math.min(i,w.th.length-2)]*(1-k)+w.th[Math.min(i+1,w.th.length-1)]*k};
window.MODEL=WD.map(w=>[w.n,w.T.toFixed(3),(30/w.T).toFixed(2)]);
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
for(const [i,w] of WD.entries()){const r=rnd(31+i*57);w.st=[];for(let k=0;k<80;k++)w.st.push([r()*W,r()*(LH-GOFF),r()*1.4+.3,r()]);w.hp=[r()*9,r()*9,r()*9];w.pt=[];for(let k=0;k<30;k++)w.pt.push([r()*W,r(),r()*50+20])}
const TOP=[];{const r=rnd(4);for(let k=0;k<170;k++)TOP.push([r()*W,r()*520,r()*1.5+.3,r()])}
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=18;x.fillText(s,px,py);x.shadowBlur=5;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const SX=400; // swing pivot x
function rider(th){// seated astronaut, drawn in the rope frame: origin at the pivot, +y down the rope
 const k=PX,L=LR*k,suit='#f2f3f5';x.save();x.rotate(-th);
 // ropes
 x.strokeStyle='#d8d2c4';x.lineWidth=3;x.beginPath();x.moveTo(-0.22*k,0);x.lineTo(-0.22*k,L);x.moveTo(0.22*k,0);x.lineTo(0.22*k,L);x.stroke();
 // seat
 x.fillStyle='#3a2a1e';x.fillRect(-0.3*k,L-2,0.6*k,0.07*k);
 x.translate(0,L);
 // legs forward and down
 x.fillStyle='#b9bec7';x.save();x.rotate(-0.1);x.fillRect(-0.05*k,-0.12*k,0.45*k,0.15*k);x.translate(0.4*k,0);x.rotate(1.25);x.fillRect(-0.05*k,-0.12*k,0.42*k,0.15*k);x.restore();
 // torso + backpack
 x.fillStyle='#c8ccd3';x.fillRect(-0.3*k,-0.78*k,0.13*k,0.5*k);const tg=x.createLinearGradient(-0.2*k,0,0.2*k,0);tg.addColorStop(0,'#cfd3da');tg.addColorStop(.5,suit);tg.addColorStop(1,'#dfe2e7');
 x.fillStyle=tg;x.beginPath();x.roundRect(-0.2*k,-0.8*k,0.4*k,0.72*k,0.08*k);x.fill();x.fillStyle='#e0533a';x.fillRect(-0.2*k,-0.5*k,0.4*k,0.045*k);
 // arm to the rope
 x.fillStyle=suit;x.beginPath();x.roundRect(-0.03*k,-0.7*k,0.25*k,0.11*k,0.05*k);x.fill();
 // helmet
 x.fillStyle=suit;x.beginPath();x.arc(0.0,-0.98*k,0.17*k,0,7);x.fill();const vg=x.createLinearGradient(0,-1.1*k,0.18*k,-0.88*k);vg.addColorStop(0,'#f6d57a');vg.addColorStop(1,'#9a6a1c');
 x.fillStyle=vg;x.beginPath();x.ellipse(0.06*k,-0.98*k,0.1*k,0.11*k,0,0,7);x.fill();x.restore()}
function lane(i,w,u,t){const top=LT[i],gy=top+LH-GOFF,bot=i==3?H:top+LH;x.save();x.beginPath();x.rect(0,i==0?0:top,W,bot-(i==0?0:top));x.clip();
 const y0=i==0?0:top;let g=x.createLinearGradient(0,y0,0,gy);g.addColorStop(0,w.sky[0]);g.addColorStop(.6,w.sky[1]);g.addColorStop(1,w.sky[2]);x.fillStyle=g;x.fillRect(0,y0,W,gy-y0);
 
 if(w.stars){for(const st of w.st){x.globalAlpha=(.3+.6*st[3])*(.7+.3*Math.sin(t*1.1+st[3]*30));x.fillStyle='#fff';x.beginPath();x.arc(st[0],top+st[1],st[2],0,7);x.fill()}x.globalAlpha=1}
 if(w.disc){const P=w.disc,ex=P.x,ey=top+P.y,er=P.r;const eg=x.createRadialGradient(ex-er*.35,ey-er*.35,er*.1,ex,ey,er);eg.addColorStop(0,P.c[0]);eg.addColorStop(.6,P.c[1]);eg.addColorStop(1,P.c[2]);x.fillStyle=eg;x.beginPath();x.arc(ex,ey,er,0,7);x.fill()}
 if(i==0){x.fillStyle='rgba(255,255,255,.22)';for(const [cx,cy,cr] of [[230,560,50],[300,548,40],[820,575,60],[900,590,40]]){const xx=(cx+t*6)%1240-80;x.beginPath();x.ellipse(xx,cy,cr*1.6,cr*.45,0,0,7);x.fill()}}
 const hh=(px,sc)=>gy-(18+26*(Math.sin(px/140+w.hp[0])*.5+Math.sin(px/61+w.hp[1])*.3+Math.sin(px/23+w.hp[2])*.2+.6))*sc;
 x.fillStyle=w.hill[0];x.beginPath();x.moveTo(0,gy);for(let px=0;px<=W;px+=6)x.lineTo(px,hh(px,1));x.lineTo(W,gy);x.fill();
 x.fillStyle=w.hill[1];x.beginPath();x.moveTo(0,gy);for(let px=0;px<=W;px+=6)x.lineTo(px,hh(px*1.9+70,.45));x.lineTo(W,gy);x.fill();
 g=x.createLinearGradient(0,gy,0,bot);g.addColorStop(0,w.gr[0]);g.addColorStop(1,w.gr[1]);x.fillStyle=g;x.fillRect(0,gy,W,bot-gy);
 if(w.tholin){x.fillStyle='rgba(150,80,50,.35)';for(const p of w.pt){x.beginPath();x.ellipse(p[0],gy+8+p[1]*300,p[2]*1.5,p[2]*.18,0,0,7);x.fill()}}
 // swing frame (A-frame), pivot 2.5 m rope + 0.45 m seat height
 const py=gy-(LR+0.42)*PX;x.strokeStyle='#4c5560';x.lineWidth=7;x.lineCap='round';
 x.beginPath();x.moveTo(SX-150,py);x.lineTo(SX+150,py);x.stroke();for(const sx of [-150,150]){x.beginPath();x.moveTo(SX+sx-34,gy);x.lineTo(SX+sx,py);x.lineTo(SX+sx+34,gy);x.stroke()}
 // swing arc guide
 x.save();x.setLineDash([6,10]);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.beginPath();x.arc(SX,py,LR*PX+6,Math.PI/2-A0,Math.PI/2+A0);x.stroke();x.restore();
 const s=u-T0,th=thAt(w,s);x.save();x.translate(SX,py);rider(th);x.restore();
 x.restore();
 // labels: world name + g (left), swing count (right)
 const n=Math.max(0,w.peaks.filter(p=>p<=s).length-1),last=w.peaks[n],k=s-last,pop=(n>0&&k<0.25)?1+0.3*Math.exp(-k/.1):1;
 txt(w.n,72,top+46,42,'#fff',1,'Anton','left');x.font='42px Anton';const nw=x.measureText(w.n).width;txt('g = '+w.g.toFixed(2)+' m/s²',72+nw+14,top+44,23,'rgba(240,244,250,.92)',1,'Mont','left');
 const won=i==3&&n>=1,ks=s-WD[3].T,stamp=i==3&&ks>0&&ks<2.4;
 if(!stamp)txt(n+(n==1?' SWING':' SWINGS'),915,top+105,48*pop,won?'#9df0bf':'#ffd166',1,'Anton','right');
 // live 'time for one swing' bar: grows until the first full swing, then freezes (Pluto's ends up 4x Earth's)
 {const tb=cl(s,0,w.T),bw=tb/12.918*280,bx=560,by=top+140;x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.roundRect(bx-4,by-4,288,26,8);x.fill();
  x.fillStyle=n>=1?(i==3?'#9df0bf':'#ffd166'):'#ffffff';x.beginPath();x.roundRect(bx,by,Math.max(4,bw),18,6);x.fill();
  txt(tb.toFixed(1)+' s',bx+Math.max(4,bw)+10,by+17,26,'#ffffff',1,'Anton','left');if(!stamp)txt('TIME FOR ONE SWING',bx,by-10,19,'rgba(240,244,250,.9)',1,'Mont','left')}
 if(stamp){const a=Math.min(ease(ks/.12),ease((2.4-ks)/.3)),pp=1+0.35*Math.exp(-ks/.12);txt('12.9 s',700,top+118,96*pp,'#9df0bf',a,'Anton','center')}}
const CARDS=[[0,2.6,'SAME SWING, 4 WORLDS','WHICH ONE IS SLOWEST?'],[2.6,5.85,'EARTH: ONE SWING','EVERY 3.2 SECONDS'],[5.85,7.65,'MARS: 5.3 SECONDS',''],[7.65,8.9,'THE MOON: 8 SECONDS',''],
 [8.9,12.40,'GUESS: ONE SWING','ON PLUTO TAKES…?'],[12.40,15.5,'12.9 SECONDS!','EARTH: 4 SWINGS ALREADY'],[15.5,19.7,'YOUR WEIGHT DOESN\'T MATTER','ONLY GRAVITY + ROPE LENGTH'],
 [19.7,24.8,'PLUTO PULLS 16 TIMES WEAKER','SO IT SWINGS 4 TIMES SLOWER'],[24.8,27.1,'WHICH WORLD WOULD','YOU SWING ON?'],[27.1,28.8,'FOLLOW →','MORE EVERY DAY'],[28.8,D+1,'SAME SWING, 4 WORLDS','WHICH ONE IS SLOWEST?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,70,820),l2?fit(l2,70,820):99);const pop=(l1=='12.9 SECONDS!')?1+0.1*Math.exp(-(t-a)/.15):1;txt(l1,495,402,sz*pop,'#fff',al);if(l2)txt(l2,495,402+sz*1.06,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
 const u=t>=28.8?t-D:t;
 for(let i=0;i<4;i++)lane(i,WD[i],u,t);
 for(let i=1;i<4;i++){x.fillStyle='rgba(0,0,0,.8)';x.fillRect(0,LT[i]-3,W,6);x.fillStyle='rgba(255,255,255,.10)';x.fillRect(0,LT[i]+3,W,1.5)}
 let g=x.createLinearGradient(0,280,0,540);g.addColorStop(0,'rgba(0,10,30,.35)');g.addColorStop(1,'rgba(0,10,30,0)');x.fillStyle=g;x.fillRect(0,280,W,260);
 const s3=u-T0-WD[3].T;if(s3>0&&t<28.8){x.save();x.globalAlpha=.5*ease(s3/.4)+.5*Math.exp(-s3/.25);x.strokeStyle='#9df0bf';x.lineWidth=4+8*Math.exp(-s3/.25);x.strokeRect(6,LT[3]+6,W-12,LH-12);x.restore()}
 cards(t);
 const fa=(t<2.6?ease((2.6-t)/.3):0)+(t>28.8?ease((t-28.8)/.3):0);txt('2.5 m rope · let go from 35° · no air drag',495,506,22,'#eef2f8',fa,'Mont');
 g=x.createRadialGradient(540,980,560,540,980,1300);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
