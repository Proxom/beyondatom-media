<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- planck-length (1M+ list #3, style C): one continuous powers-of-ten zoom from a fingertip to the Planck length.
     Scale: z(t) = log10(screen width in metres). Each level is drawn at its own native screen width wL and grows by 10^(zL-z).
     Facts: Planck length 1.616255e-35 m (NIST CODATA 2022); DNA helix ~2 nm wide (NCBI StatPearls); proton charge radius 0.84 fm
     (NIST CODATA), three valence quarks + gluons (DOE); Bohr radius 5.29e-11 m (NIST). From a 1 cm view to a proton (1.68e-15 m) ~13
     powers of ten; proton to Planck length: log10(1.68e-15/1.616e-35) = 20.0. All pictures are illustrations (not microscope images). -->
<script>
const W=1080,H=1920,CX=540,CY=960,D=37.0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ss=(a,b,v)=>{const t=cl((v-a)/(b-a));return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const cv=document.getElementById('c'),x=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('40px Mont')]).then(()=>{window.TEXREADY=true});
// ---------- camera: monotone cubic through keyframes (t, z) ----------
const K=[[0,-1.74],[2.0,-1.86],[5.9,-3.80],[6.9,-3.95],[8.5,-8.00],[9.6,-8.12],[10.4,-9.55],[11.8,-9.68],[12.5,-13.95],[13.4,-14.06],
 [14.1,-14.55],[17.8,-14.85],[23.6,-34.62],[35.0,-34.79],[37.0,-34.84]];
const MS=(()=>{const n=K.length,d=[],m=[];for(let i=0;i<n-1;i++)d.push((K[i+1][1]-K[i][1])/(K[i+1][0]-K[i][0]));
 m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=(d[i-1]*d[i]<=0)?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]==0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const tt=3/Math.sqrt(s);m[i]=tt*a*d[i];m[i+1]=tt*b*d[i]}}return m})();
function Z(t){t=cl(t,0,D);let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const [t0,z0]=K[i],[t1,z1]=K[i+1],h=t1-t0,s=(t-t0)/h;
 const h00=2*s*s*s-3*s*s+1,h10=s*s*s-2*s*s+s,h01=-2*s*s*s+3*s*s,h11=s*s*s-s*s;return h00*z0+h10*h*MS[i]+h01*z1+h11*h*MS[i+1]}
// ---------- precomputed geometry ----------
const R0=rnd(11);
const RIDGES=[];for(let i=0;i<95;i++){const ph=[R0()*6.28,R0()*6.28,R0()*6.28];RIDGES.push({r:0.012+i*0.0128,ph,a:[R0()*.18,R0()*.12,R0()*.07],br:R0()<.08?R0()*6.28:-1})}
const PORES=[];for(let i=0;i<900;i++){const ri=Math.floor(R0()*RIDGES.length),an=R0()*6.28;PORES.push([ri,an,.25+R0()*.5])}
const CELLS=[];{const r=rnd(5);for(let gy=-14;gy<=14;gy++)for(let gx=-9;gx<=9;gx++){const px=gx*0.165+(gy&1?0.08:0)+(r()-.5)*.05,py=gy*0.15+(r()-.5)*.05;
 const keep=Math.hypot(px,py)<0.02;CELLS.push({x:keep?0:px,y:keep?0:py,rx:0.075+r()*.012,ry:0.068+r()*.012,rot:r()*3,nx:keep?0:(r()-.5)*.03,ny:keep?0:(r()-.5)*.03,wob:[r()*6.28,r()*6.28,r()*.012+.004],c:r()})}}
const FIB=[];{const r=rnd(9);for(let i=0;i<70;i++){const pts=[];let px=(r()-.5)*1.6,py=(r()-.5)*2.6,an=r()*6.28;if(i==0){px=-.9;py=-.2;an=.2}
 for(let k=0;k<60;k++){pts.push([px,py]);an+=(r()-.5)*.9;px+=Math.cos(an)*.045;py+=Math.sin(an)*.045;if(i==0&&k==19){px=0;py=0}}FIB.push({pts,w:.012+r()*.014,c:r()})}}
const NUC=[];{// 6 protons + 6 neutrons, packed; centre one is a proton at the origin
 const P=[[0,0,1],[.155,.06,0],[-.15,.07,0],[.03,-.16,1],[.05,.17,1],[-.12,-.11,0],[.15,-.1,1],[-.04,.08,0],[.09,.11,0],[-.16,-.02,1],[-.02,-.07,0],[.08,-.03,1]];
 for(const p of P)NUC.push({x:p[0],y:p[1],p:p[2],d:Math.hypot(p[0],p[1])});NUC.sort((a,b)=>b.d-a.d)}
const STREAK=[];{const r=rnd(3);for(let i=0;i<520;i++)STREAK.push({a:r()*6.283,d:r(),w:.6+r()*2.2,h:r()})}
const FOAM=[];{const r=rnd(42);for(let i=0;i<90;i++)FOAM.push({x:r()*W,y:r()*H,r:60+r()*260,f:.3+r()*1.2,p:r()*6.28,h:r()})}
const SPARK=[];{const r=rnd(77);for(let i=0;i<700;i++)SPARK.push([r(),r(),r(),r()])}
// ---------- levels: native screen width zL (log10 m); draw(g,u) with u = px per level-unit at current zoom ----------
function skinBg(g){const gr=g.createRadialGradient(330,560,80,540,960,1300);gr.addColorStop(0,'#f2c7a8');gr.addColorStop(.45,'#d99a7b');gr.addColorStop(1,'#6e3b2c');g.fillStyle=gr;g.fillRect(0,0,W,H)}
function drawFinger(g,u,t){if(u>1080*60){g.fillStyle="#d99a7b";g.fillRect(0,0,W,H);return}g.fillStyle='#0b0605';g.fillRect(0,0,W,H);
 // finger pad ~1.5 cm wide in a 2 cm view (0.75 units); the view starts at 2.5 cm so the whole pad is visible
 g.save();g.translate(CX,CY+u*.08);const pw=.4*u,ph=.62*u;
 const bl=g.createRadialGradient(0,0,pw*.7,0,0,ph*1.25);bl.addColorStop(0,'rgba(255,170,130,.22)');bl.addColorStop(1,'rgba(255,120,80,0)');g.fillStyle=bl;g.beginPath();g.arc(0,0,ph*1.25,0,7);g.fill();
 g.beginPath();g.ellipse(0,0,pw,ph,0,0,7);g.save();g.clip();
 const sk=g.createRadialGradient(-pw*.35,-ph*.35,pw*.1,0,0,ph*1.05);sk.addColorStop(0,'#f6cfb2');sk.addColorStop(.5,'#dc9f80');sk.addColorStop(1,'#7a3f2e');g.fillStyle=sk;g.fillRect(-pw,-ph,2*pw,2*ph);
 g.lineCap='round';const lw=Math.max(1,u*.0058);
 for(const R of RIDGES){const rr=R.r;if(rr*u<4||rr*u>2600)continue;const N=Math.max(40,Math.min(220,Math.floor(rr*u*.3)));
  g.beginPath();for(let k=0;k<=N;k++){const a=k/N*6.2832;
   const rad=rr*(1+R.a[0]*.25*Math.sin(2*a+R.ph[0])+R.a[1]*.2*Math.sin(3*a+R.ph[1])+R.a[2]*.25*Math.sin(5*a+R.ph[2]))*(1+.18*Math.sin(a));
   const px=Math.cos(a)*rad*u*.82,py=Math.sin(a)*rad*u*1.15-rr*u*.18;k?g.lineTo(px,py):g.moveTo(px,py)}
  g.strokeStyle='rgba(118,50,36,.6)';g.lineWidth=lw*1.9;g.stroke();g.save();g.translate(-lw*.45,-lw*.55);g.strokeStyle='rgba(255,228,208,.4)';g.lineWidth=lw*.7;g.stroke();g.restore()}
 g.fillStyle='rgba(95,38,28,.55)';for(const [ri,an,sc] of PORES){const R=RIDGES[ri];const rr=R.r;const rad=rr*(1+R.a[0]*.25*Math.sin(2*an+R.ph[0])+R.a[1]*.2*Math.sin(3*an+R.ph[1])+R.a[2]*.25*Math.sin(5*an+R.ph[2]))*(1+.18*Math.sin(an));
  const px=Math.cos(an)*rad*u*.82,py=Math.sin(an)*rad*u*1.15-rr*u*.18;if(Math.abs(px)>800||Math.abs(py)>1200)continue;g.beginPath();g.arc(px,py,Math.max(.8,u*.0022*sc),0,7);g.fill()}
 const sh=g.createRadialGradient(-pw*.3,-ph*.3,pw*.2,0,0,ph*1.02);sh.addColorStop(0,'rgba(255,240,225,.16)');sh.addColorStop(.75,'rgba(60,20,10,0)');sh.addColorStop(1,'rgba(30,8,4,.7)');g.fillStyle=sh;g.fillRect(-pw,-ph,2*pw,2*ph);
 g.restore();g.strokeStyle='rgba(255,200,170,.35)';g.lineWidth=Math.max(2,u*.004);g.beginPath();g.ellipse(0,0,pw,ph,0,Math.PI*1.05,Math.PI*1.6);g.stroke();g.restore()}
function drawCells(g,u,t){const bg=g.createRadialGradient(CX,CY,50,CX,CY,1300);bg.addColorStop(0,'#0a1630');bg.addColorStop(1,'#02040a');g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.save();g.translate(CX,CY);g.globalCompositeOperation='lighter';
 for(const c of CELLS){const px=c.x*u,py=c.y*u,rx=c.rx*u,ry=c.ry*u;if(Math.abs(px)-rx>700||Math.abs(py)-ry>1100)continue;
  g.save();g.translate(px,py);g.rotate(c.rot+.05*Math.sin(t*.6+c.wob[0]));
  // membrane glow
  g.beginPath();for(let k=0;k<=40;k++){const a=k/40*6.2832,w=1+c.wob[2]*8*Math.sin(3*a+c.wob[0])+c.wob[2]*5*Math.sin(5*a+c.wob[1]);const ex=Math.cos(a)*rx*w,ey=Math.sin(a)*ry*w;k?g.lineTo(ex,ey):g.moveTo(ex,ey)}g.closePath();
  g.fillStyle='rgba(20,60,70,'+(.25+.15*c.c)+')';g.fill();g.strokeStyle='rgba(70,230,190,.55)';g.lineWidth=Math.max(1.2,u*.006);g.shadowColor='rgba(60,255,200,.9)';g.shadowBlur=Math.min(30,u*.02);g.stroke();
  // nucleus
  g.shadowBlur=0;const nr=u*.026;const ng=g.createRadialGradient(c.nx*u,c.ny*u,0,c.nx*u,c.ny*u,nr*1.35);ng.addColorStop(0,'rgba(120,140,255,.95)');ng.addColorStop(.7,'rgba(70,80,230,.6)');ng.addColorStop(1,'rgba(40,40,200,0)');
  g.fillStyle=ng;g.beginPath();g.ellipse(c.nx*u,c.ny*u,nr*1.35,nr*1.2,0,0,7);g.fill();g.restore()}
 g.restore()}
function drawChromatin(g,u,t){const bg=g.createRadialGradient(CX,CY,40,CX,CY,1200);bg.addColorStop(0,'#1a1660');bg.addColorStop(1,'#04031a');g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.save();g.translate(CX,CY);g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
 for(const f of FIB){g.beginPath();f.pts.forEach((p,i)=>{const px=p[0]*u+Math.sin(t*.7+i*.3+f.c*9)*u*.004,py=p[1]*u;i?g.lineTo(px,py):g.moveTo(px,py)});
  const hue=220+f.c*60;g.strokeStyle='hsla('+hue+',90%,'+(55+f.c*15)+'%,.28)';g.lineWidth=f.w*u*1.6;g.stroke();g.strokeStyle='hsla('+hue+',100%,80%,.35)';g.lineWidth=f.w*u*.45;g.stroke()}
 g.restore()}
const BASES=['#ff6b6b','#ffd166','#4cc9f0','#80ed99'];
function drawDNA(g,u,t){const bg=g.createRadialGradient(CX,CY,60,CX,CY,1250);bg.addColorStop(0,'#141a3a');bg.addColorStop(1,'#020308');g.fillStyle=bg;g.fillRect(0,0,W,H);
 // helix along a slightly tilted axis through the centre: diameter 2 nm in a 8 nm view -> 0.25 units; pitch 3.4 nm -> 0.425; rise 0.34 nm -> 0.0425
 g.save();g.translate(CX,CY);g.rotate(-.42);const rad=.125*u,pitch=.425*u,spin=t*.9;const L=Math.ceil(1400/(.0425*u))+2;
 const pts=[];for(let k=-L;k<=L;k++){const y=k*.0425*u,a=k/10*6.2832+spin;pts.push({y,a1:a,a2:a+2.4,k})}
 const drawStrand=(front)=>{for(const p of pts){for(const [a,col] of [[p.a1,'#9fb4ff'],[p.a2,'#ffb4e6']]){const z=Math.cos(a);if((z>0)!=front)continue;const xx=Math.sin(a)*rad,s=(.75+.25*z);
   const gr=g.createRadialGradient(xx-s*u*.006,p.y-s*u*.006,0,xx,p.y,s*u*.026);gr.addColorStop(0,'#fff');gr.addColorStop(.35,col);gr.addColorStop(1,'rgba(20,20,60,'+(front?.0:.0)+')');
   g.globalAlpha=front?1:.55;g.fillStyle=gr;g.beginPath();g.arc(xx,p.y,s*u*.026,0,7);g.fill()}}};
 drawStrand(false);
 // base pairs (rungs)
 for(const p of pts){const x1=Math.sin(p.a1)*rad,x2=Math.sin(p.a2)*rad,zm=(Math.cos(p.a1)+Math.cos(p.a2))/2;g.globalAlpha=.55+.4*cl(zm+.5);
  const c=BASES[(p.k*7+3)&3],c2=BASES[3-((p.k*7+3)&3)];g.lineCap='round';g.lineWidth=u*.016;const xm=(x1+x2)/2;
  g.strokeStyle=c;g.beginPath();g.moveTo(x1,p.y);g.lineTo(xm,p.y);g.stroke();g.strokeStyle=c2;g.beginPath();g.moveTo(xm,p.y);g.lineTo(x2,p.y);g.stroke()}
 drawStrand(true);g.restore();g.globalAlpha=1;
 const vg=g.createRadialGradient(CX,CY,300,CX,CY,1200);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=vg;g.fillRect(0,0,W,H)}
function drawAtom(g,u,t){g.fillStyle='#01020a';g.fillRect(0,0,W,H);
 // electron probability cloud: ~exp(-2r/a0), a0 = 0.0529 nm -> 0.2116 units of a 0.25 nm view
 const a0=.2116*u;g.save();g.translate(CX,CY);g.globalCompositeOperation='lighter';g.globalAlpha=1/(1+Math.pow(u/1080/6,1.5));
 const gr=g.createRadialGradient(0,0,0,0,0,a0*4);gr.addColorStop(0,'rgba(140,200,255,.9)');gr.addColorStop(.12,'rgba(90,150,255,.55)');gr.addColorStop(.35,'rgba(60,90,230,.22)');gr.addColorStop(.7,'rgba(40,40,160,.07)');gr.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=gr;g.beginPath();g.arc(0,0,a0*4,0,7);g.fill();
 // flickering "where the electron could be" speckles
 const r=rnd(Math.floor(t*12)+1);for(let i=0;i<520;i++){const rr=-Math.log(1-r()*.995)*a0*.5,an=r()*6.283;const px=Math.cos(an)*rr,py=Math.sin(an)*rr;g.fillStyle='rgba(190,225,255,'+(.25+.5*r())+')';g.beginPath();g.arc(px,py,Math.max(1,u*.0016)*(1+r()),0,7);g.fill()}
 // the nucleus: a point (to scale it is ~1/100,000 of the atom)
 g.globalAlpha=1;g.fillStyle='rgba(255,210,170,1)';g.beginPath();g.arc(0,0,2.2,0,7);g.fill();const ng=g.createRadialGradient(0,0,0,0,0,14);ng.addColorStop(0,'rgba(255,180,120,.8)');ng.addColorStop(1,'rgba(255,120,60,0)');g.fillStyle=ng;g.beginPath();g.arc(0,0,14,0,7);g.fill();
 g.restore()}
function sphere(g,px,py,r,c1,c2,al){g.save();g.globalAlpha=al;const gr=g.createRadialGradient(px-r*.35,py-r*.4,r*.05,px,py,r);gr.addColorStop(0,c1);gr.addColorStop(.55,c2);gr.addColorStop(1,'rgba(10,5,10,1)');
 g.fillStyle=gr;g.beginPath();g.arc(px,py,r,0,7);g.fill();g.restore()}
function drawNucleus(g,u,t){const bg=g.createRadialGradient(CX,CY,30,CX,CY,1100);bg.addColorStop(0,'#2a0c10');bg.addColorStop(1,'#030104');g.fillStyle=bg;g.fillRect(0,0,W,H);
 // nucleon radius ~0.85 fm in an 8 fm view -> 0.106 units
 g.save();g.translate(CX,CY);g.rotate(t*.15);const r=.106*u;
 const gl=g.createRadialGradient(0,0,0,0,0,r*4);gl.addColorStop(0,'rgba(255,140,90,.35)');gl.addColorStop(1,'rgba(255,80,40,0)');g.fillStyle=gl;g.beginPath();g.arc(0,0,r*4,0,7);g.fill();
 for(const n of NUC){const px=n.x*u,py=n.y*u;n.p?sphere(g,px,py,r,'#ffd0b0','#e0473a',1):sphere(g,px,py,r,'#e8eefc','#6d7fa8',1)}g.restore()}
function drawProton(g,u,t){const bg=g.createRadialGradient(CX,CY,30,CX,CY,1100);bg.addColorStop(0,'#3a0d06');bg.addColorStop(1,'#050102');g.fillStyle=bg;g.fillRect(0,0,W,H);
 // proton charge radius 0.84 fm in a 2.5 fm view -> 0.336 units
 const R=.336*u;g.save();g.translate(CX,CY);g.globalCompositeOperation='lighter';
 const gr=g.createRadialGradient(0,0,0,0,0,R*1.25);gr.addColorStop(0,'rgba(255,170,90,.55)');gr.addColorStop(.6,'rgba(255,90,40,.35)');gr.addColorStop(.85,'rgba(200,40,20,.18)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,R*1.25,0,7);g.fill();
 // sea sparkle (quark-antiquark pairs, gluons): illustrative
 const rr=rnd(Math.floor(t*15)+3);for(let i=0;i<260;i++){const a=rr()*6.283,d=Math.sqrt(rr())*R;g.fillStyle='rgba(255,'+(170+rr()*80|0)+',140,'+(.15+.45*rr())+')';g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,Math.max(1,u*.0025)*(.5+rr()),0,7);g.fill()}
 // three valence quarks (colour charge drawn as red, green, blue) joined by wiggly gluon tubes
 const Q=[0,1,2].map(i=>{const a=i*2.094+t*.55+.3*Math.sin(t*1.3+i);const d=R*(.42+.08*Math.sin(t*1.7+i*2));return[Math.cos(a)*d,Math.sin(a)*d]});const QC=['255,70,70','80,255,120','90,140,255'];
 g.lineCap='round';for(let i=0;i<3;i++){const [ax,ay]=Q[i],[bx,by]=Q[(i+1)%3];g.beginPath();for(let k=0;k<=40;k++){const s=k/40,px=lerp(ax,bx,s),py=lerp(ay,by,s),nx=-(by-ay),ny=bx-ax,nl=Math.hypot(nx,ny);const w=Math.sin(s*Math.PI*9-t*9)*R*.03*Math.sin(s*Math.PI);k?g.lineTo(px+nx/nl*w,py+ny/nl*w):g.moveTo(px,py)}
  g.strokeStyle='rgba(255,220,150,.55)';g.lineWidth=Math.max(1.5,R*.022);g.stroke()}
 Q.forEach(([px,py],i)=>{const qg=g.createRadialGradient(px,py,0,px,py,R*.2);qg.addColorStop(0,'rgba(255,255,255,1)');qg.addColorStop(.25,'rgba('+QC[i]+',.95)');qg.addColorStop(1,'rgba('+QC[i]+',0)');g.fillStyle=qg;g.beginPath();g.arc(px,py,R*.2,0,7);g.fill()});
 g.restore()}
function drawFoam(g,u,t){g.fillStyle='#030008';g.fillRect(0,0,W,H);g.save();g.globalCompositeOperation='lighter';
 for(const f of FOAM){const r=f.r*(1+.35*Math.sin(t*f.f*2.2+f.p))*Math.min(2.2,Math.max(.6,u/1080));const px=CX+(f.x-CX)*(.9+.1*Math.sin(t*.4+f.p)),py=CY+(f.y-CY)*(.9+.1*Math.cos(t*.37+f.p));
  const hue=f.h<.5?275+f.h*40:180+f.h*30;const al=.10+.10*Math.sin(t*f.f*3+f.p*2);
  const gr=g.createRadialGradient(px,py,r*.55,px,py,r);gr.addColorStop(0,'hsla('+hue+',90%,60%,0)');gr.addColorStop(.85,'hsla('+hue+',95%,65%,'+cl(al+.08)+')');gr.addColorStop(1,'hsla('+hue+',90%,50%,0)');g.fillStyle=gr;g.beginPath();g.arc(px,py,r,0,7);g.fill()}
 const r=rnd(Math.floor(t*20)+5);for(const s of SPARK){if(r()<.55)continue;g.fillStyle='rgba(220,200,255,'+(.2+.6*r())+')';g.fillRect(s[0]*W,s[1]*H,1.6+s[2]*1.6,1.6+s[2]*1.6)}
 const cg=g.createRadialGradient(CX,CY,0,CX,CY,700);cg.addColorStop(0,'rgba(200,170,255,.22)');cg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=cg;g.fillRect(0,0,W,H);g.restore()}
const LV=[{z:-1.70,f:drawFinger},{z:-3.82,f:drawCells},{z:-5.70,f:drawChromatin},{z:-8.10,f:drawDNA},{z:-9.60,f:drawAtom},{z:-14.10,f:drawNucleus},{z:-14.60,f:drawProton},{z:-34.79,f:drawFoam}];
// ---------- the void between the proton and the Planck length: streaks flying outward as we zoom ----------
function drawVoid(g,z,dz,t){const p=cl((-14.9-z)/(34.6-14.9));const hue=lerp(18,275,p);
 const bg=g.createRadialGradient(CX,CY,20,CX,CY,1200);bg.addColorStop(0,'hsla('+hue+',80%,'+lerp(22,12,p)+'%,1)');bg.addColorStop(1,'hsla('+hue+',90%,2%,1)');g.fillStyle=bg;g.fillRect(0,0,W,H);
 const sp=cl(Math.abs(dz)/3.5);g.save();g.translate(CX,CY);g.globalCompositeOperation='lighter';g.lineCap='round';
