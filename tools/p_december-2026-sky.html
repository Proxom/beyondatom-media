<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- december-2026-sky (time-bound: "December 2026 sky: dates to save", 26 Nov 17:00).
     USNO Moon phases 2026: New Moon 9 Dec 00:52 UT, Full Moon 24 Dec 01:28 UT. USNO Earth seasons: December solstice 21 Dec 2026.
     NASA Science, Geminids: active Dec 4-17, 2026, peak Dec 13-14; one of the best and most reliable showers; 40-50 meteors per hour under dark skies; radiant in Gemini.
     American Meteor Society / IMO 2026 calendar: Moon about 15 % lit (waxing crescent) on the Geminid peak night, limited moonlight.
     Drawing: sky, meteors, landscape and the tilted Earth are illustrations (not a real star chart); Moon photo NASA GSFC SVS (GSFC_20171208_Archive_e001861);
     Earth photo Apollo 17 "Blue Marble" AS17-148-22727 (NASA). -->
<script>
const W=1080,H=1920,FPS=30,D=26.2,LOOP=25.9;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(2026);const STARS=[];for(let i=0;i<520;i++)STARS.push([R()*W,R()*1400,R()*1.8+.3,R(),R()]);
const MET=[];for(let i=0;i<60;i++)MET.push([R(),R(),R(),R()]);
const HILL=[];for(let i=0;i<=30;i++)HILL.push(R());const TREES=[];for(let i=0;i<18;i++)TREES.push([R()*W,R(),R()]);
const MOON=new Image();MOON.src='pl/moon-full.jpg';const EARTH=new Image();EARTH.src='pl/as17-148-22727.jpg';
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const HZ=1360;
function sky(t,dark){let g=x.createLinearGradient(0,0,0,HZ);g.addColorStop(0,'#01020a');g.addColorStop(.7,'#06102a');g.addColorStop(1,lerp(0,1,1-dark)>0?'#1b2a55':'#0d1736');x.fillStyle=g;x.fillRect(0,0,W,H);
 // milky way band
 x.save();x.translate(540,700);x.rotate(-0.55);const mg=x.createLinearGradient(0,-170,0,170);mg.addColorStop(0,'rgba(170,180,255,0)');mg.addColorStop(.5,'rgba(170,180,255,'+(0.08+0.06*dark)+')');mg.addColorStop(1,'rgba(170,180,255,0)');x.fillStyle=mg;x.fillRect(-1200,-170,2400,340);x.restore();
 for(const s of STARS){const tw=0.75+0.25*Math.sin(t*(1.5+s[4]*3)+s[3]*9);x.globalAlpha=cl((.25+.6*s[3])*tw*(0.75+0.45*dark));x.fillStyle=s[4]>.9?'#ffd9b0':'#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}x.globalAlpha=1}
function land(t,mr){// lake reflecting the sky, then dark hills at the horizon
 let g=x.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#0e1a3a');g.addColorStop(1,'#03060f');x.fillStyle=g;x.fillRect(0,HZ-40,W,H-HZ+40);
 for(const s of STARS){if(s[1]<700)continue;const ry=HZ+(HZ-s[1])*0.55;if(ry>H)continue;x.globalAlpha=(.12+.25*s[3])*(0.7+0.3*Math.sin(t*2+s[0]));x.fillStyle='#cfe0ff';x.fillRect(s[0]+Math.sin(t*1.5+ry*0.05)*3,ry,s[2]*2,1.5)}x.globalAlpha=1;
 if(mr>0){const rg=x.createLinearGradient(0,HZ,0,H);rg.addColorStop(0,'rgba(235,240,255,'+(0.5*mr)+')');rg.addColorStop(1,'rgba(235,240,255,0)');x.fillStyle=rg;for(let i=0;i<26;i++){const yy=HZ+40+i*20,w=120+Math.sin(t*3+i)*30+i*6;x.fillRect(540-w/2,yy,w,6)}}
 x.fillStyle='#03050b';x.beginPath();x.moveTo(0,HZ+30);x.lineTo(0,HZ);for(let i=0;i<=30;i++)x.lineTo(i*W/30,HZ-20-HILL[i]*60-Math.sin(i*0.5)*30);x.lineTo(W,HZ+30);x.closePath();x.fill();
 for(const tr of TREES){const tx=tr[0],th=60+tr[1]*90,ty=HZ+30;x.beginPath();x.moveTo(tx,ty-th);x.lineTo(tx-th*0.28,ty);x.lineTo(tx+th*0.28,ty);x.closePath();x.fill()}}
const RAD=[770,720]; // Gemini radiant (illustrative)
function meteors(t,rate,al){if(al<=0.01)return;for(let i=0;i<MET.length;i++){const m=MET[i];const per=3.2/rate,ph=((t+m[0]*per*7)/per)%7;if(ph>1)continue;
 const ang=m[1]*Math.PI*2,start=60+m[2]*260,len=220+m[3]*260,p=ease(ph);const sx=RAD[0]+Math.cos(ang)*(start+len*p*0.6),sy=RAD[1]+Math.sin(ang)*(start+len*p*0.6);
 const tx=sx-Math.cos(ang)*len*0.5*(1-ph*0.5),ty=sy-Math.sin(ang)*len*0.5*(1-ph*0.5);const a=al*Math.sin(Math.PI*ph);
 const g=x.createLinearGradient(tx,ty,sx,sy);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(230,240,255,'+a+')');x.strokeStyle=g;x.lineWidth=3+m[3]*3;x.lineCap='round';x.beginPath();x.moveTo(tx,ty);x.lineTo(sx,sy);x.stroke();
 x.fillStyle='rgba(255,255,255,'+a+')';x.beginPath();x.arc(sx,sy,2.5+m[3]*2,0,7);x.fill()}}
function moonImg(cx,cy,r,al){if(al<=0.01)return;x.save();x.globalAlpha=al;const gl=x.createRadialGradient(cx,cy,r*0.9,cx,cy,r*2.2);gl.addColorStop(0,'rgba(230,235,255,.35)');gl.addColorStop(1,'rgba(230,235,255,0)');x.fillStyle=gl;x.beginPath();x.arc(cx,cy,r*2.2,0,7);x.fill();
 x.beginPath();x.arc(cx,cy,r,0,7);x.clip();const k=r/225*240;x.drawImage(MOON,cx-k,cy-k,2*k,2*k);x.restore()}
function crescent(cx,cy,r,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.beginPath();x.rect(0,0,W,H);x.arc(cx-r*0.55,cy-r*0.12,r*0.98,0,7);x.clip('evenodd');x.fillStyle='#f4f1e6';x.shadowColor='rgba(255,250,230,.8)';x.shadowBlur=20;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore()}
function earthTilt(cx,cy,r,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.translate(cx,cy);
 // sunlight from the right; north pole tilted 23.4 degrees away from the Sun (December solstice)
 x.save();x.rotate(-23.4*Math.PI/180);x.beginPath();x.arc(0,0,r,0,7);x.clip();x.drawImage(EARTH,-r,-r,2*r,2*r);x.restore();
 x.beginPath();x.arc(0,0,r,0,7);x.clip();const sh=x.createLinearGradient(-r,0,r,0);sh.addColorStop(0,'rgba(0,0,10,.88)');sh.addColorStop(.47,'rgba(0,0,10,.82)');sh.addColorStop(.55,'rgba(0,0,10,0)');x.fillStyle=sh;x.fillRect(-r,-r,2*r,2*r);x.restore();
 x.save();x.globalAlpha=al;x.translate(cx,cy);x.rotate(-23.4*Math.PI/180);x.strokeStyle='#ffd166';x.lineWidth=5;x.setLineDash([16,12]);x.beginPath();x.moveTo(0,-r-70);x.lineTo(0,r+70);x.stroke();x.restore();
 txt('N',cx-Math.sin(23.4*Math.PI/180)*(r+100),cy-Math.cos(23.4*Math.PI/180)*(r+100)+20,48,'#ffd166',al,'Anton');
 // sunlight arrows from the right
 x.save();x.globalAlpha=al*0.8;x.strokeStyle='#ffe08a';x.lineWidth=6;for(let i=-2;i<=2;i++){const yy=cy+i*90;x.beginPath();x.moveTo(1010,yy);x.lineTo(cx+r+40,yy);x.stroke();x.beginPath();x.moveTo(cx+r+40,yy);x.lineTo(cx+r+64,yy-14);x.moveTo(cx+r+40,yy);x.lineTo(cx+r+64,yy+14);x.stroke()}x.restore()}
const TILES=[['DEC','9',4.1],['DEC','13-14',7.8],['DEC','21',15.9],['DEC','24',21.6]];
function tiles(t,al){const y=1190,w=190,h=128,gap=24,x0=540-(4*w+3*gap)/2;for(let i=0;i<4;i++){const [m,d,ta]=TILES[i],on=t>=ta&&(i==3?t<25.2:t<TILES[i+1][2]),past=t>=ta;
 const xx=x0+i*(w+gap);x.save();x.globalAlpha=al*(on?1:past?0.75:0.5);x.fillStyle=on?'#ffd166':'rgba(255,255,255,.16)';x.beginPath();x.roundRect(xx,y,w,h,18);x.fill();x.restore();
 txt(m,xx+w/2,y+44,32,on?'#1a1300':'#e8eefc',al*(on?1:0.85),'Anton');txt(d,xx+w/2,y+108,d.length>2?54:62,on?'#1a1300':'#fff',al*(on?1:0.85),'Anton')}}
const CARDS=[[-1,4.1,'DECEMBER 2026 SKY:','4 DATES TO SAVE'],[4.1,7.8,'DEC 9: NEW MOON','DARKEST NIGHTS'],[7.8,15.9,'DEC 13-14: GEMINIDS PEAK','ONE OF THE BEST SHOWERS'],
 [15.9,21.6,'DEC 21: SOLSTICE','LONGEST NIGHT IN THE NORTH'],[21.6,24.0,'DEC 24: CHRISTMAS EVE','FULL MOON'],[24.0,25.2,'WHICH ONE','WILL YOU WATCH?'],[25.2,25.9,'FOLLOW →','MORE EVERY DAY'],[25.9,D+1,'DECEMBER 2026 SKY:','4 DATES TO SAVE']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,76,840),fit(l2,76,840));txt(l1,495,410,sz,'#fff',al);txt(l2,495,410+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 const dark=u>=4.1&&u<15.9?1:0.4;sky(u,dark);
 // meteors: a few in the hook, many at the Geminid peak
 meteors(u,1.2,u<4.1?1:0);meteors(u,4.0,u>=7.8&&u<15.9?Math.min(ease((u-7.8)/.5),ease((15.9-u)/.4)):0);
 if(u>=7.8&&u<15.9){const a=Math.min(ease((u-8.4)/.4),ease((15.9-u)/.3));txt('GEMINI',RAD[0],RAD[1]+16,40,'rgba(200,215,255,.9)',a*0.9,'Anton');
  txt('40-50 AN HOUR UNDER DARK SKIES',495,1110,46,'#e8eefc',ease((u-10.0)/.4)*ease((15.9-u)/.3),'Anton');
  const k=ease((u-11.5)/3.6);crescent(200,lerp(1000,1420,k),46,ease((u-11.0)/.4)*ease((15.9-u)/.3))}
 if(u>=4.1&&u<7.8){const a=Math.min(ease((u-4.3)/.4),ease((7.8-u)/.3));x.save();x.globalAlpha=a;x.fillStyle='#0a0d18';x.beginPath();x.arc(540,830,170,0,7);x.fill();x.strokeStyle='rgba(200,210,240,.35)';x.lineWidth=3;x.beginPath();x.arc(540,830,170,0,7);x.stroke();x.restore();
  txt('NEW MOON',540,845,60,'rgba(220,228,255,.85)',a,'Anton')}
 if(u>=15.9&&u<21.6){const a=Math.min(ease((u-16.0)/.5),ease((21.6-u)/.3));x.fillStyle='rgba(1,2,8,'+(0.85*a)+')';x.fillRect(0,0,W,H);earthTilt(470,840,250,a);txt('SUN →',860,1110,40,'#ffe08a',a,'Anton')}
 if(u>=21.6&&u<25.2){const k=ease((u-21.6)/2.6);moonImg(540,lerp(1500,930,k),250,Math.min(1,ease((u-21.6)/.3))*ease((25.2-u)/.3))}
const mr=u>=21.6&&u<25.2?ease((u-22.4)/1.2)*ease((25.2-u)/.3):0; land(u,mr);tiles(u,u<4.1?ease((u+0.5)/.6):1);
 cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont'),new Promise(r=>{if(MOON.complete)r();else MOON.onload=r}),new Promise(r=>{if(EARTH.complete)r();else EARTH.onload=r})]).then(()=>{window.TEXREADY=true});
</script>
