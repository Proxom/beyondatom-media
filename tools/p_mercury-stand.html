<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- mercury-stand (series "What If…?"): what standing on Mercury would be like.
     NASA Science, Mercury Facts: from the surface the Sun would appear more than three times as large as from Earth; daytime temperatures can reach
       800 F (430 C) and drop to -290 F (-180 C) at night; Mercury has no real atmosphere to hold the heat (only a thin exosphere); it is not the hottest planet (Venus is);
       water ice may be in permanently shadowed craters at the poles.
     NASA, MESSENGER (29 Nov 2012): new evidence for water ice in permanently shadowed polar craters.
     Drawing: landscape, Sun size comparison (3.2 x), crater and ice are illustrations; the temperature counter is sped up. -->
<script>
const W=1080,H=1920,FPS=30,D=24.5,LOOP=24.2;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(88);const STARS=[];for(let i=0;i<300;i++)STARS.push([R()*W,R()*1250,R()*1.6+.3,R()]);
const CR=[];for(let i=0;i<40;i++){const z=R();CR.push([R()*1.4-0.2,z,R()])}CR.sort((a,b)=>a[1]-b[1]);
const ICE=[];for(let i=0;i<60;i++)ICE.push([R(),R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const HZ=1250;
function stars(a){for(const s of STARS){x.globalAlpha=(.25+.6*s[3])*a;x.fillStyle='#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}x.globalAlpha=1}
function ground(t,light,night){// grey cratered plain in perspective
 const g=x.createLinearGradient(0,HZ,0,H);g.addColorStop(0,night?'#2b3140':'#a49d92');g.addColorStop(1,night?'#0d1018':'#3e3a35');x.fillStyle=g;x.fillRect(0,HZ,W,H-HZ);
 for(const c of CR){const z=c[1],yy=HZ+10+Math.pow(z,1.5)*(H-HZ),sc=0.12+z*1.3,xx=W/2+(c[0]-0.55)*W*(0.6+z*1.4)+Math.sin(t*0.05)*20*z;const rw=(70+c[2]*120)*sc,rh=rw*0.28;
  x.fillStyle=night?'rgba(0,0,0,.35)':'rgba(40,36,32,.55)';x.beginPath();x.ellipse(xx,yy,rw,rh,0,0,7);x.fill();
  x.strokeStyle=night?'rgba(120,140,170,.25)':'rgba(255,245,225,'+(0.35*light)+')';x.lineWidth=Math.max(1,3*sc);x.beginPath();x.ellipse(xx,yy,rw,rh,0,Math.PI*1.05,Math.PI*1.95);x.stroke()}
 if(!night){x.fillStyle='rgba(255,200,120,'+(0.18*light)+')';x.fillRect(0,HZ,W,H-HZ)}}
function sun(cx,cy,r,al){if(al<=0.01)return;x.save();x.globalAlpha=al;let g=x.createRadialGradient(cx,cy,r*0.8,cx,cy,r*2.4);g.addColorStop(0,'rgba(255,240,200,.55)');g.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*2.4,0,7);x.fill();
 g=x.createRadialGradient(cx-r*0.2,cy-r*0.2,r*0.1,cx,cy,r);g.addColorStop(0,'#ffffff');g.addColorStop(.7,'#fff3c8');g.addColorStop(1,'#ffd27a');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore()}
function tempAt(t){if(t<6.6)return null;if(t<9.4)return lerp(100,430,ease((t-6.6)/2.8));if(t<11.2)return 430;if(t<13.4)return lerp(430,-180,ease((t-11.2)/2.2));return -180}
function day(t){x.fillStyle='#000';x.fillRect(0,0,W,HZ);stars(1);const rise=ease((t+1)/5);const r=272,cy=lerp(1300,1080,rise);sun(600,cy,r,1);ground(t,1,false);
 if(t>=4.6&&t<6.9){const a=Math.min(ease((t-4.8)/.4),ease((6.9-t)/.3));x.save();x.globalAlpha=a;x.setLineDash([14,10]);x.strokeStyle='#ffe9a8';x.lineWidth=5;x.beginPath();x.arc(230,760,85,0,7);x.stroke();x.restore();txt('FROM EARTH',230,890,40,'#ffe9a8',a,'Anton');
  txt('FROM MERCURY',600,cy-r-40,44,'#fff6d6',a,'Anton')}
 const T=tempAt(t);if(T!==null){const done=t>=9.4;txt(Math.round(T)+' °C',540,720,160*(done?1+.12*Math.exp(-(t-9.4)/.15):1),done?'#ffb347':'#fff',ease((t-6.6)/.3),'Anton');if(done)txt('DAYTIME HIGH',540,800,48,'#ffe2b0',ease((t-9.5)/.3),'Anton')}}
function night(t){x.fillStyle='#000';x.fillRect(0,0,W,HZ);stars(1);const k=ease((t-10.3)/1.2);sun(600,lerp(1080,1600,k),272,1-k);ground(t,0,k>0.5);
 const T=tempAt(t);const done=t>=13.4;txt(Math.round(T)+' °C',540,880,170*(done?1+.12*Math.exp(-(t-13.4)/.15):1),done?'#9fd4ff':'#fff',1,'Anton');if(done)txt('NIGHT LOW',540,960,48,'#cfe6ff',ease((t-13.5)/.3),'Anton')}
function pole(t){x.fillStyle='#000';x.fillRect(0,0,W,H);stars(1);
 // crater cross-section: rims lit by grazing sunlight from the left, floor in permanent shadow
 const by=1300;x.fillStyle='#575049';x.beginPath();x.moveTo(0,by-140);x.lineTo(140,by-210);x.quadraticCurveTo(260,by-220,300,by-120);x.quadraticCurveTo(540,by+240,780,by-120);x.quadraticCurveTo(830,by-230,950,by-200);x.lineTo(W,by-150);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
 // sunlit right rim (light from the low Sun on the left)
 x.fillStyle='rgba(255,240,205,.75)';x.beginPath();x.moveTo(780,by-120);x.quadraticCurveTo(830,by-230,950,by-200);x.lineTo(W,by-150);x.lineTo(W,by-120);x.quadraticCurveTo(900,by-160,800,by-90);x.closePath();x.fill();
 // sunbeam grazing over the left rim
 const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(255,240,200,.35)');g.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=g;x.beginPath();x.moveTo(0,by-330);x.lineTo(W,by-280);x.lineTo(W,by-200);x.lineTo(140,by-215);x.lineTo(0,by-200);x.closePath();x.fill();
 sun(-40,by-260,60,1);
 // shadowed floor + ice
 x.fillStyle='#16171c';x.beginPath();x.moveTo(300,by-120);x.quadraticCurveTo(540,by+240,780,by-120);x.closePath();x.fill();
 const ia=ease((t-19.4)/1.0);for(const c of ICE){const ix=390+c[0]*300,iy=by+20+c[1]*90-Math.abs(ix-540)*0.25;const sp=0.5+0.5*Math.sin(t*4+c[2]*20);x.globalAlpha=ia*(0.65+0.35*sp);x.fillStyle='#f2fbff';x.shadowColor='rgba(170,230,255,.9)';x.shadowBlur=14;x.beginPath();x.ellipse(ix,iy,8+c[2]*14,4+c[2]*5,0,0,7);x.fill()}x.globalAlpha=1;x.shadowBlur=0;
 txt('PERMANENT SHADOW',540,by-190,46,'#cfe0ff',ease((t-16.6)/.4),'Anton');txt('WATER ICE (LIKELY)',540,by+120,58,'#ffffff',ia,'Anton')}
const CARDS=[[-1,3.7,'WHAT IF YOU STOOD','ON MERCURY?'],[3.7,10.3,'THE SUN CAN LOOK','OVER 3 TIMES BIGGER'],[10.3,15.8,'AT NIGHT: -180 °C','ALMOST NO AIR TO HOLD HEAT'],[15.8,22.4,'POLAR CRATERS IN SHADOW:','EVIDENCE OF WATER ICE!'],
 [22.4,23.5,'WOULD YOU','VISIT?'],[23.5,24.2,'FOLLOW →','MORE EVERY DAY'],[24.2,D+1,'WHAT IF YOU STOOD','ON MERCURY?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,76,840),fit(l2,76,840));txt(l1,495,410,sz,'#fff',al);txt(l2,495,410+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 if(u<10.3)day(u);else if(u<15.8)night(u);else{pole(u);if(u<16.2){x.fillStyle='rgba(0,0,0,'+(1-(u-15.8)/0.4)+')';x.fillRect(0,0,W,H)}}
 cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
