<!doctype html><meta charset=utf8><body style="margin:0;background:#000">
<canvas id=g width=1080 height=1920 style="display:none"></canvas><canvas id=c width=1080 height=1920></canvas>
<!-- planet-speed-race: 8 planets in lanes moving at their true mean orbital speeds (NASA NSSDC); sizes not to scale. -->
<script id=fs type=x-shader>
precision highp float;
uniform vec2 R;uniform float T;uniform vec3 SUN;
uniform vec4 SP[9];uniform float TY[9];uniform float SPIN[9];uniform float AL[9];
uniform vec3 RN;uniform float RIN,ROUT;uniform float GUIDE,GX,GY0,GY1;uniform vec4 HL;uniform float SKYON;uniform sampler2D TEX,CLD,MTX;
float h1(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n3(p);p*=2.02;a*=.5;}return s;}
vec3 sky(vec2 q){vec3 d=normalize(vec3((q-.5*R)/R.x,1.2));vec3 c=vec3(0.);
 for(int l=0;l<2;l++){float sc=l==0?160.:320.;vec3 p=d*sc;vec3 id=floor(p);float hs=h1(id+float(l)*7.);
  if(hs>.88){vec3 sp=id+.5+.35*(vec3(h1(id+1.),h1(id+2.),h1(id+3.))-.5);float dd=length(p-sp);
   c+=pow(hs-.88,1.5)*30.*exp(-dd*dd*30.)*mix(vec3(1.,.85,.7),vec3(.75,.85,1.),h1(id+9.));}}
 c+=vec3(.035,.03,.06)*pow(fbm(d*2.5+3.),2.5)*2.;c+=vec3(.010,.016,.035)*(1.-q.y/R.y);return c;}
// albedo by type; p = unit vector in planet frame (y = spin axis)
// 0 earth 1 jupiter 2 saturn 3 uranus 4 moon 5 mars 6 mercury 7 venus 8 neptune
vec3 alb(float ty,vec3 p){
 float lat=p.y;
 if(ty<.5){vec2 uv=vec2(atan(p.z,-p.x)/6.28318+.5,acos(clamp(p.y,-1.,1.))/3.14159);
  vec3 c=pow(texture2D(TEX,uv).rgb,vec3(1.9))*1.45;float cl=texture2D(CLD,uv).a;return mix(c,vec3(.97),smoothstep(.04,.75,cl)*.85);}
 if(ty<1.5){float tw=fbm(p*5.+vec3(T*.01,0.,0.));float w=lat+.05*(tw-.5)+.02*(fbm(p*18.)-.5)+.006*(fbm(p*60.)-.5);
  float b=sin(w*24.)*.5+.5,b2=sin(w*58.+1.)*.5+.5,b3=fbm(vec3(p.x*3.,w*40.,p.z*3.));
  vec3 c=mix(vec3(.93,.86,.74),vec3(.62,.40,.25),pow(b,1.6));c=mix(c,vec3(.98,.95,.88),b2*.3);c*=.82+.36*b3;
  c=mix(c,vec3(.75,.55,.40),smoothstep(.35,.55,abs(sin(w*9.+.6)))*.25);c=mix(c,vec3(.55,.52,.52),smoothstep(.78,.95,abs(lat)));
  vec2 q=vec2(atan(p.x,p.z),asin(clamp(lat,-1.,1.))+.384);vec2 ab=vec2(.127,.086);float e=length(q/ab);
  float ang=atan(q.y/ab.y,q.x/ab.x)+3.*(1.-e);float sw=fbm(vec3(cos(ang)*e*3.,sin(ang)*e*3.,1.));
  vec3 rs=mix(vec3(.70,.24,.12),vec3(.88,.46,.26),sw);c=mix(c,rs,smoothstep(1.02,.9,e));
  c=mix(c,vec3(.96,.90,.80),smoothstep(1.3,1.05,e)*smoothstep(.95,1.08,e)*.7);return c;}
 if(ty<2.5){float w=lat+.02*(fbm(p*5.)-.5);float b=sin(w*22.)*.5+.5,b2=sin(w*57.)*.5+.5;
  vec3 c=mix(vec3(.86,.76,.55),vec3(.74,.62,.42),b);c=mix(c,vec3(.93,.87,.70),b2*.3);
  return mix(c,vec3(.62,.66,.66),smoothstep(.75,.97,abs(lat)));}
 if(ty<3.5){float w=lat+.015*(fbm(p*4.)-.5);vec3 c=mix(vec3(.55,.80,.86),vec3(.66,.88,.91),sin(w*12.)*.5+.5);c*=.94+.08*fbm(p*9.);
  return mix(c,vec3(.80,.94,.95),smoothstep(.55,.85,lat)*.6);}
 if(ty<4.5){vec2 uv=vec2(atan(-p.z,p.x)/6.28318+.5,acos(clamp(p.y,-1.,1.))/3.14159);vec3 m=texture2D(MTX,uv).rgb;return pow(m,vec3(2.3))*1.35;}
 if(ty<5.5){float d=fbm(p*2.3+vec3(1.3,.2,4.1)),f=fbm(p*11.+2.),g=fbm(p*34.);vec3 c=mix(vec3(.80,.47,.27),vec3(.66,.38,.22),f);
  c=mix(c,vec3(.36,.24,.17),smoothstep(.52,.63,d)*smoothstep(.75,.2,abs(lat)));c*=.9+.2*g;return mix(c,vec3(.95,.93,.9),smoothstep(.976,.986,lat));}
 if(ty<6.5){float n=fbm(p*4.+5.),cr=fbm(p*14.+1.);vec3 c=vec3(.58,.55,.52)*(.75+.45*n);return c*(.85+.3*smoothstep(.4,.7,cr));}
 if(ty<7.5){float w=fbm(vec3(p.x*2.,p.y*6.,p.z*2.)+vec3(T*.02,0.,0.));return mix(vec3(.93,.84,.62),vec3(.86,.72,.48),w)*(.95+.1*fbm(p*7.));}
 float w=lat+.02*(fbm(p*5.)-.5);vec3 c=mix(vec3(.20,.36,.82),vec3(.28,.46,.90),sin(w*10.)*.5+.5);c*=.92+.12*fbm(p*8.);
 float sp=smoothstep(.75,.6,length(vec2(atan(p.x,p.z)-.6,(lat+.35)*2.6)));c=mix(c,vec3(.12,.20,.52),sp*.6);
 return mix(c,vec3(.75,.85,1.),smoothstep(.72,.78,fbm(vec3(p.x*4.,lat*16.,p.z*4.)))*smoothstep(.1,.25,abs(lat))*.5);}
vec3 atm(float ty){return ty<.5?vec3(.3,.55,1.):ty<1.5?vec3(.9,.8,.6):ty<2.5?vec3(.95,.85,.6):ty<3.5?vec3(.5,.9,1.):ty<4.5?vec3(0.):ty<5.5?vec3(.95,.62,.45)*.6:ty<6.5?vec3(0.):ty<7.5?vec3(1.,.9,.6):vec3(.4,.6,1.);}
float ringD(float r){float d=0.;
 d+=smoothstep(1.24,1.26,r)*smoothstep(1.53,1.51,r)*.25;d+=smoothstep(1.52,1.53,r)*smoothstep(1.95,1.94,r)*.95;
 d+=smoothstep(2.025,2.035,r)*smoothstep(2.27,2.26,r)*.6;d*=.75+.25*n3(vec3(r*90.,0.,0.))+.15*(n3(vec3(r*300.,1.,0.))-.5);return clamp(d,0.,1.);}
vec3 ringC(float r){return mix(vec3(.88,.74,.52),vec3(1.,.93,.78),smoothstep(1.5,2.2,r))*1.35;}
mat3 frameOf(float ty){ // world->planet: y axis = spin axis; saturn axis = ring normal
 if(ty>1.5&&ty<2.5){vec3 yv=RN;vec3 xv=normalize(cross(yv,vec3(0.,0.,1.)));vec3 zv=cross(xv,yv);return mat3(xv.x,yv.x,zv.x,xv.y,yv.y,zv.y,xv.z,yv.z,zv.z);}
 return mat3(1.);}
void main(){
 vec2 q=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y); // canvas px, y down
 vec3 col=SKYON>.5?sky(q):vec3(0.);float AOUT=0.;
 // distance guide line (behind everything)
 if(GUIDE>0.&&q.y>GY0&&q.y<GY1){float dx=abs(q.x-GX);float dash=step(.5,fract(q.y/18.));col+=vec3(.55,.7,1.)*GUIDE*smoothstep(1.6,.4,dx)*dash*.35;}
 // soft halos
 for(int k=0;k<9;k++){vec4 S=SP[k];if(SKYON<.5||S.w<=0.||AL[k]<=0.)continue;float dd=length(q-S.xy)/S.w;col+=atm(TY[k])*exp(-max(dd-1.,0.)*7.)*.10*AL[k]*step(1.,dd);}
 vec3 rd=vec3(0.,0.,-1.);
 // saturn ring (index 4 is saturn): ring plane through its centre
 vec4 Sa=SP[4];
 float ringA=0.,ringBack=0.;vec3 rcol=vec3(0.);
 if(Sa.w>0.&&AL[4]>0.){ // ray (q.x, -q.y, z) toward -z; work in y-up coords
  vec3 o=vec3(q.x-Sa.x,-(q.y-Sa.y),0.);float dn=dot(rd,RN);float tz=dot(-o,RN)/dn; // o + rd*t on plane (relative)
  vec3 hp=o+rd*tz;float rr=length(hp)/ROUT*2.27;
  if(rr>1.2&&rr<2.3){float dn2=ringD(rr);
   // planet shadow on ring
   vec3 lp=hp;float sh=1.;{float bb=dot(lp,SUN),cc=dot(lp,lp)-Sa.w*Sa.w;float h=bb*bb-cc;if(h>0.&&(-bb+sqrt(h))>0.)sh=.08;}
   float lit=.55+.45*abs(dot(RN,SUN));rcol=ringC(rr)*lit*sh*1.05;ringA=dn2*AL[4];ringBack=hp.z<0.?1.:0.;}}
 // spheres: find front-most
 float best=-1e9;int bi=-1;vec3 bn=vec3(0.);
 for(int k=0;k<9;k++){vec4 S=SP[k];if(S.w<=0.||AL[k]<=0.)continue;vec2 d=q-S.xy;float r2=dot(d,d);float rr=S.w+.75;if(r2>rr*rr)continue;
  float z=sqrt(max(S.w*S.w-r2,0.));if(z>best){best=z;bi=k;bn=vec3(d.x,-d.y,z)/S.w;}}
 // ring behind planet
 if(ringA>0.&&ringBack>.5){col=mix(col,rcol,clamp(ringA,0.,.98));AOUT=max(AOUT,clamp(ringA,0.,.98));}
 if(bi>=0){vec4 S;float ty,spn,al;
  for(int k=0;k<9;k++){if(k==bi){S=SP[k];ty=TY[k];spn=SPIN[k];al=AL[k];}}
  float dpx=length(q-S.xy);float cov=clamp(S.w-dpx+.5,0.,1.);
  vec3 n=normalize(bn);vec3 lp=frameOf(ty)*n;float ca=cos(spn),sa=sin(spn);lp=vec3(ca*lp.x+sa*lp.z,lp.y,-sa*lp.x+ca*lp.z);
  vec3 a=alb(ty,lp);float ndl=dot(n,SUN);float dif=smoothstep(-.08,.35,ndl)*max(ndl+.08,0.)/1.08;
  float mu=max(n.z,0.);dif*=.55+.45*pow(mu,.4);
  if(ty>1.5&&ty<2.5){ // ring shadow on saturn
   vec3 P=n*S.w;float dn=dot(SUN,RN);if(abs(dn)>1e-4){float tt=-dot(P,RN)/dn;if(tt>0.){float rr=length(P+SUN*tt)/ROUT*2.27;dif*=1.-.85*ringD(rr);}}}
  vec3 c=a*dif*1.25;float rim=pow(1.-mu,3.)*smoothstep(-.2,.5,ndl);c+=atm(ty)*rim*.55;c+=a*.035; // faint fill so night side is not pure black
  // highlight outline (red/green) for one body
  if(HL.w>0.&&float(bi)==HL.x){float e=smoothstep(S.w-5.,S.w-1.,dpx);c=mix(c,HL.y>.5?vec3(1.,.32,.3):vec3(.45,1.,.65),e*HL.w);c*=1.-HL.z*.55;}
  col=mix(col,c,cov*al);AOUT=AOUT+(1.-AOUT)*cov*al;}
 // ring in front
 if(ringA>0.&&ringBack<.5){col=mix(col,rcol,clamp(ringA,0.,.98));AOUT=AOUT+(1.-AOUT)*clamp(ringA,0.,.98);}
 col=1.-exp(-col*1.1);col=pow(col,vec3(.95));if(SKYON>.5)gl_FragColor=vec4(col,1.);else gl_FragColor=vec4(min(col,vec3(AOUT)),AOUT);}
</script>
<script src="tex.js"></script><script src="texm.js"></script><script>
const W=1080,H=1920;const g=document.getElementById('g'),gl=g.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:true,alpha:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw gl.getProgramInfoLog(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function mkTex(src,unit,cb){const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);cb()};im.src=src;}
let _tl=0;const _ok=()=>{_tl++;if(_tl==3){window.F0=null;window.TEXREADY=true}};
mkTex(TEXA,0,_ok);mkTex(TEXC,1,_ok);mkTex(TEXM,2,_ok);
gl.uniform1i(U('TEX'),0);gl.uniform1i(U('CLD'),1);gl.uniform1i(U('MTX'),2);
const c=document.getElementById('c'),x=c.getContext('2d');
</script>
