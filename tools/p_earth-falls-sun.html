<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- earth-falls-sun (series "What If…?"): if Earth suddenly stopped orbiting, it would fall straight into the Sun.
     Radial free fall from 1 AU, Sun GM 1.32712e20 m^3/s^2 (NASA NSSDC Sun fact sheet), Sun radius 695,700 km.
     t(x) = sqrt(r0^3/(2GM)) * (sqrt(x(1-x)) + acos(sqrt(x))), x = r/r0. Total 64.6 days (= half the period of an orbit with a = 0.5 AU, Kepler's third law).
     Venus's orbit (0.723 AU) day 41.2, halfway day 52.8, Mercury's orbit (0.387 AU) day 57.0, Sun's surface day 64.6 at 616 km/s.
     Video time is linear in days (2.81 days per second). Earth is drawn huge (not to scale); the Sun's apparent size grows as 1/distance
     (its starting size is exaggerated); the orbit rings are illustrative markers. -->
<script>
const W=1080,H=1920,FPS=30,D=31.5,T0=0.0,TIMP=23.5,AU=1.495978707e11,GM=1.32712440018e20,RS=6.957e8,XS=RS/AU;
const K=Math.sqrt(AU**3/(2*GM))/86400,DTOT=K*(Math.sqrt(XS*(1-XS))+Math.acos(Math.sqrt(XS))),RATE=DTOT/(TIMP-T0);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)};
const tOfX=x=>K*(Math.sqrt(x*(1-x))+Math.acos(Math.sqrt(x)));
function xOfDay(d){if(d<=0)return 1;if(d>=DTOT)return XS;let a=XS,b=1;for(let i=0;i<60;i++){const m=(a+b)/2;if(tOfX(m)>d)a=m;else b=m}return (a+b)/2}
const dayAt=u=>cl((u-T0)*RATE,0,DTOT);
const vAt=x=>Math.sqrt(2*GM/AU*(1/x-1))/1000; // km/s
window.MODEL={DTOT:DTOT.toFixed(2),RATE:RATE.toFixed(3),venusT:(T0+tOfX(0.723332)/RATE).toFixed(2),mercT:(T0+tOfX(0.387098)/RATE).toFixed(2),
 half:tOfX(0.5).toFixed(2),day30x:xOfDay(30).toFixed(3),vImp:vAt(XS).toFixed(0),sunV:(1/0.723332**2).toFixed(2),sunM:(1/0.387098**2).toFixed(2)};
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(77),STARS=[];for(let i=0;i<650;i++)STARS.push([R()*Math.PI*2,R(),R()*1.3+.4,R()]);
// granulation texture (procedural)
const GR=document.createElement('canvas');GR.width=GR.height=512;{const g=GR.getContext('2d');g.fillStyle='#b8430c';g.fillRect(0,0,512,512);const r=rnd(5);
 for(let i=0;i<1400;i++){const px=r()*512,py=r()*512,rr=6+r()*12;for(const [ox,oy] of [[0,0],[512,0],[-512,0],[0,512],[0,-512]]){const gg=g.createRadialGradient(px+ox,py+oy,0,px+ox,py+oy,rr);
  gg.addColorStop(0,'rgba(255,214,120,.85)');gg.addColorStop(.6,'rgba(250,150,50,.45)');gg.addColorStop(1,'rgba(150,40,5,0)');g.fillStyle=gg;g.beginPath();g.arc(px+ox,py+oy,rr,0,7);g.fill()}}}
let EARTH=null;const img=new Image();img.src='pl/as17-148-22727.jpg';
const E={x:540,y:1235,r:335};
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function sunGeom(xx){const Rp=88/xx,limb=900-225*Math.sqrt(xx);return {cx:540,cy:limb-Rp,R:Rp}}
function stars(u,xx){const vp=sunGeom(xx),v=vAt(xx),s=Math.log(1/xx)*0.33+u*0.012,len=Math.min(420,2+v*0.55);
 for(const st of STARS){const f=(st[1]+s)%1,rr=70*Math.pow(26,f),r0=70*Math.pow(26,Math.max(0,f-len/9000));const a=st[0],cx=vp.cx+Math.cos(a)*rr,cy=vp.cy+Math.sin(a)*rr*1.0;
  if(cx<-20||cx>W+20||cy<-20||cy>H+20)continue;const al=(.35+.6*st[3])*cl(f*5)*cl((1-f)*8);x.strokeStyle='rgba(235,240,255,'+al+')';x.lineWidth=st[2];x.beginPath();
  x.moveTo(vp.cx+Math.cos(a)*r0,vp.cy+Math.sin(a)*r0);x.lineTo(cx,cy);x.stroke();x.fillStyle='rgba(240,244,255,'+al+')';x.beginPath();x.arc(cx,cy,st[2]*.9,0,7);x.fill()}}
function sun(xx,t){const g=sunGeom(xx),{cx,cy}=g,Rp=g.R;
 // glow
 const gl=x.createRadialGradient(cx,cy,Rp*.9,cx,cy,Rp*3.2+90);gl.addColorStop(0,'rgba(255,190,90,.6)');gl.addColorStop(.35,'rgba(255,140,40,.24)');gl.addColorStop(1,'rgba(255,120,30,0)');
 x.fillStyle=gl;x.fillRect(0,0,W,H);
 // disc with limb darkening
 const dg=x.createRadialGradient(cx,cy,0,cx,cy,Rp);dg.addColorStop(0,'#fff8e2');dg.addColorStop(.55,'#ffe09a');dg.addColorStop(.85,'#ffb54a');dg.addColorStop(1,'#f07a1c');
 x.fillStyle=dg;x.beginPath();x.arc(cx,cy,Rp,0,7);x.fill();
 if(Rp>40){x.save();x.beginPath();x.arc(cx,cy,Rp,0,7);x.clip();x.globalAlpha=cl((Rp-40)/300)*.45;x.globalCompositeOperation='multiply';
  const sc=Math.max(.12,Rp/900);const pat=x.createPattern(GR,'repeat');const m=new DOMMatrix().translateSelf(cx+t*3,cy).scaleSelf(sc,sc);pat.setTransform(m);x.fillStyle=pat;x.fillRect(cx-Rp,cy-Rp,2*Rp,2*Rp);x.restore()}}
function ring(xx,a,label,t){// illustrative orbit marker: grows past the camera as Earth crosses it
 const k=Math.pow(a/xx,7),rr=600*k;if(rr<140||rr>2600)return;const g=sunGeom(xx),al=cl((rr-140)/160)*cl((2600-rr)/900);
 x.save();x.globalAlpha=al*.85;x.strokeStyle='#9fd3ff';x.lineWidth=3+2*k;x.setLineDash([18,14]);x.lineDashOffset=-t*40;x.beginPath();x.ellipse(g.cx,g.cy,rr,rr*.34,0,0,7);x.stroke();x.restore();
 if(rr<1300&&rr>260){x.font='34px Mont';const lw=x.measureText(label).width;txt(label,Math.min(g.cx+rr*.62,915-lw/2),g.cy+rr*.34*.79+46,34,'#cfe8ff',al*cl((rr-260)/150),'Mont')}}
function earth(xx,u){const ex=E.x,ey=E.y,er=E.r,heat=cl((1/(xx*xx)-1)/30);
 // atmosphere rim
 const ag=x.createRadialGradient(ex,ey,er*.96,ex,ey,er*1.12);ag.addColorStop(0,'rgba(120,180,255,.55)');ag.addColorStop(1,'rgba(120,180,255,0)');x.fillStyle=ag;x.beginPath();x.arc(ex,ey,er*1.12,0,7);x.fill();
 x.save();x.beginPath();x.arc(ex,ey,er,0,7);x.clip();
 if(img.complete&&img.naturalWidth){x.translate(ex,ey);x.rotate(-0.25+u*0.006);x.drawImage(img,-er*1.02,-er*1.02,er*2.04,er*2.04);x.setTransform(1,0,0,1,0,0)}else{x.fillStyle='#2a5aa0';x.fillRect(ex-er,ey-er,2*er,2*er)}
 // night side (Sun is above): shade the lower part
 const sh=x.createLinearGradient(0,ey-er*.35,0,ey+er*.55);sh.addColorStop(0,'rgba(0,4,14,0)');sh.addColorStop(.55,'rgba(0,4,14,.78)');sh.addColorStop(1,'rgba(0,3,10,.95)');x.fillStyle=sh;x.fillRect(ex-er,ey-er,2*er,2*er);
 // warm sunlight on the day side, growing as 1/r^2
 x.globalCompositeOperation='screen';const wl=x.createLinearGradient(0,ey-er,0,ey+er*.2);wl.addColorStop(0,'rgba(255,170,80,'+(.08+.6*heat)+')');wl.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=wl;x.fillRect(ex-er,ey-er,2*er,2*er);
 x.restore();
 // sunlit rim on top
 x.save();x.strokeStyle='rgba(255,230,180,'+(.35+.5*heat)+')';x.lineWidth=4;x.beginPath();x.arc(ex,ey,er-1,Math.PI*1.08,Math.PI*1.92);x.stroke();x.restore()}
function surface(t,k){// after impact: the solar surface fills the frame
 const pat=x.createPattern(GR,'repeat');const m=new DOMMatrix().translateSelf(t*-8,t*-22).scaleSelf(2.6,2.6);pat.setTransform(m);x.fillStyle=pat;x.fillRect(0,0,W,H);
 const v=x.createRadialGradient(540,900,200,540,900,1250);v.addColorStop(0,'rgba(60,10,0,.15)');v.addColorStop(1,'rgba(30,4,0,.7)');x.fillStyle=v;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,'+cl(1-k/0.7)+')';x.fillRect(0,0,W,H)}
const CARDS=[[0,3.0,'IF EARTH STOPPED…','HOW LONG TO HIT THE SUN?'],[3.0,6.9,'GUESS NOW:','DAYS, WEEKS OR MONTHS?'],[6.9,11.6,'A WHOLE MONTH…','THE SUN BARELY GROWS'],
 [11.6,14.1,'BUT WE KEEP','SPEEDING UP'],[14.1,17.9,'DAY 41: VENUS\'S ORBIT','ALMOST 2 TIMES THE SUNLIGHT'],[19.9,23.4,'DAY 57: MERCURY\'S ORBIT','ALMOST 7 TIMES THE SUNLIGHT']];
const BIG=[[23.85,28.4,'64.6 DAYS','IMPACT AT 616 km/s'],[28.4,29.8,'DID YOU','GUESS RIGHT?'],[29.8,31.0,'FOLLOW →','MORE EVERY DAY']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0?1:ease((t-a)/.2),ease((b-t)/.18));
  const sz=Math.min(fit(l1,76,840),fit(l2,76,840));txt(l1,495,398,sz,'#fff',al);txt(l2,495,398+sz*1.08,sz,'#ffd166',al)}
 for(const [a,b,l1,l2] of BIG){if(t<a||t>=b)continue;const al=Math.min(ease((t-a)/.2),ease((b-t)/.15)),big=l1=='64.6 DAYS';const pop=big?1+.12*Math.exp(-(t-a)/.15):1;
  const s1=fit(l1,big?190:120,800)*pop;txt(l1,495,860,s1,'#fff',al);txt(l2,495,860+(big?110:s1*1.05),big?fit(l2,72,800):s1,'#ffe3a6',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';x.fillStyle='#000';x.fillRect(0,0,W,H);
 const u=t>=31.0?t-D:t;const day=dayAt(u),xx=xOfDay(day);
 if(u<TIMP){
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#03040a');bg.addColorStop(1,'#000');x.fillStyle=bg;x.fillRect(0,0,W,H);
  stars(u,xx);ring(xx,0.723332,'VENUS\'S ORBIT',t);ring(xx,0.387098,'MERCURY\'S ORBIT',t);sun(xx,t);earth(xx,u);
  // day counter on Earth's night side
  const dn=Math.round(day),pulse=1+0.06*Math.exp(-(((day+.5)%1))*3)*(day>0?1:0);
  txt('DAY '+dn,525,1370,132*pulse,'#fff',1);
  // top band so cards read
  const g=x.createLinearGradient(0,250,0,580);g.addColorStop(0,'rgba(20,6,0,0)');g.addColorStop(.35,'rgba(20,6,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,250,W,330);
  // last instant: everything goes white
  const kf=cl((u-(TIMP-0.25))/0.25);if(kf>0){x.fillStyle='rgba(255,250,235,'+kf+')';x.fillRect(0,0,W,H)}
 }else{surface(t,u-TIMP)}
 cards(t);}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont'),new Promise(r=>{if(img.complete)r();img.onload=r;img.onerror=r})]).then(()=>{window.TEXREADY=true});
</script>
