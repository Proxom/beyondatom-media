<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- sleep-in-space (series "Life in Space"): how astronauts sleep in orbit.
     ESA, Sleeping in space: no up or down, so astronauts can attach their sleeping bags to a wall or the ceiling; they can wake up deprived of
       oxygen and gasping for air because a bubble of their own exhaled carbon dioxide has formed around their heads, so the sleeping area must be well ventilated.
     NASA (space station crew sleep): private crew quarters; airflow and carbon dioxide are among the factors that affect crew sleep.
     Drawing: cabin, astronaut, CO2 cloud and air flow are illustrations (CO2 is invisible). -->
<script>
const W=1080,H=1920,FPS=30,D=26.9,LOOP=26.6;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(77);const MOL=[];for(let i=0;i<46;i++)MOL.push([R()*Math.PI*2,R(),R(),R()]);const AIR=[];for(let i=0;i<34;i++)AIR.push([R(),R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function module(t){// station module walls around the cabin
 let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#8b929c');g.addColorStop(.5,'#c9ced6');g.addColorStop(1,'#80878f');x.fillStyle=g;x.fillRect(0,0,W,H);
 const off=(t*8)%160;x.strokeStyle='rgba(60,66,76,.5)';x.lineWidth=4;
 for(let y=-160;y<H+160;y+=160){x.strokeRect(30,y+off,240,140);x.strokeRect(810,y+off+40,240,140)}
 x.fillStyle='rgba(40,46,56,.35)';for(let y=-160;y<H+160;y+=160){x.fillRect(60,y+off+50,180,14);x.fillRect(840,y+off+90,180,14)}
 x.strokeStyle='#e8c33a';x.lineWidth=10;for(let y=-160;y<H+160;y+=320){x.beginPath();x.moveTo(285,y+off+40);x.lineTo(285,y+off+120);x.stroke();x.beginPath();x.moveTo(795,y+off+200);x.lineTo(795,y+off+280);x.stroke()}}
function astronaut(t,co2,air){// sleeping bag tied to the back wall; head at the top
 const bob=Math.sin(t*0.9)*8;x.save();x.translate(0,bob);
 let g=x.createLinearGradient(-110,0,110,0);g.addColorStop(0,'#1f4f8f');g.addColorStop(.5,'#3c7dd1');g.addColorStop(1,'#1d4a85');x.fillStyle=g;x.beginPath();x.roundRect(-115,-250,230,640,110);x.fill();
 x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=4;x.beginPath();x.moveTo(40,-200);x.lineTo(40,360);x.stroke(); // zip
 x.fillStyle='#2b2f36';for(const yy of [-60,220]){x.fillRect(-150,yy,300,26)} // straps
 x.fillStyle='#596273';for(const yy of [-60,220]){x.beginPath();x.arc(-160,yy+13,16,0,7);x.fill();x.beginPath();x.arc(160,yy+13,16,0,7);x.fill()}
 // head
 x.fillStyle='#e8b896';x.beginPath();x.arc(0,-330,92,0,7);x.fill();x.fillStyle='#3b2a20';x.beginPath();x.arc(0,-352,94,Math.PI*1.05,Math.PI*1.95);x.fill();
 x.strokeStyle='#5b3d2c';x.lineWidth=5;x.lineCap='round';const gasp=t>=18.45&&t<19.9;
 if(gasp){for(const ex of [-32,32]){x.fillStyle='#fff';x.beginPath();x.arc(ex,-322,15,0,7);x.fill();x.fillStyle='#2b1d14';x.beginPath();x.arc(ex,-320,7,0,7);x.fill()}x.fillStyle='#5b2a20';x.beginPath();x.ellipse(0,-276,14,18,0,0,7);x.fill()}
 else{x.beginPath();x.arc(-32,-322,16,0.2,Math.PI-0.2);x.stroke();x.beginPath();x.arc(32,-322,16,0.2,Math.PI-0.2);x.stroke();x.beginPath();x.arc(0,-280,12,0.3,Math.PI-0.3);x.stroke()}
 // exhaled CO2 cloud (illustration; real CO2 is invisible)
 if(co2>0.01){const r=lerp(120,250,co2);const cg=x.createRadialGradient(0,-300,20,0,-300,r);cg.addColorStop(0,'rgba(150,160,175,'+(0.55*co2)+')');cg.addColorStop(1,'rgba(150,160,175,0)');x.fillStyle=cg;x.beginPath();x.arc(0,-300,r,0,7);x.fill();
  for(const m of MOL){const rr=lerp(90,r*0.9,m[1])+Math.sin(t*1.3+m[3]*6)*10,a=m[0]+t*0.15*(m[2]-.5);const mx=Math.cos(a)*rr*0.85,my=-300+Math.sin(a)*rr*0.75;
   x.globalAlpha=co2*0.9;x.fillStyle='#6f7a8c';x.beginPath();x.arc(mx,my,9,0,7);x.fill();x.fillStyle='#d23a3a';x.beginPath();x.arc(mx-15,my,7,0,7);x.fill();x.beginPath();x.arc(mx+15,my,7,0,7);x.fill();x.globalAlpha=1}}
 x.restore()}
function cabin(t,ang,co2,air){x.save();x.translate(540,1030);x.scale(0.88,0.88);x.rotate(ang);
 // cabin box
 x.fillStyle='#1b2433';x.beginPath();x.roundRect(-300,-560,600,1120,28);x.fill();x.strokeStyle='#d8dde5';x.lineWidth=14;x.stroke();
 x.fillStyle='rgba(255,230,170,.12)';x.beginPath();x.roundRect(-270,-530,540,1060,20);x.fill();
 // lamp and laptop
 x.fillStyle='#ffe6a8';x.beginPath();x.roundRect(170,-520,90,22,8);x.fill();x.fillStyle='#39414f';x.beginPath();x.roundRect(160,40,110,74,8);x.fill();x.fillStyle='#7fb2ff';x.fillRect(168,48,94,52);
 // fan (top left) and air flow
 x.save();x.translate(-200,-450);x.fillStyle='#596273';x.beginPath();x.arc(0,0,52,0,7);x.fill();x.rotate(air>0?t*14:t*0.3);x.fillStyle='#c9ced6';for(let k=0;k<4;k++){x.rotate(Math.PI/2);x.beginPath();x.ellipse(24,0,26,10,0,0,7);x.fill()}x.restore();
 if(air>0.01){for(const a of AIR){const ph=(a[0]+t*0.9*(0.6+a[2]))%1;const x0=-200+(a[1]-.5)*120,y0=-400;const xs=lerp(x0,(a[1]-.5)*200,ph),ys=lerp(y0,480,ph);x.strokeStyle='rgba(190,230,255,'+(0.85*air*Math.sin(ph*Math.PI))+')';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(xs,ys);x.lineTo(xs+(((a[1]-.5)*200)-x0)*0.08,ys+70);x.stroke()}}
 x.save();x.beginPath();x.roundRect(-290,-550,580,1100,24);x.clip();astronaut(t,co2,air);x.restore();x.restore()}
const CARDS=[[-1,2.6,'HOW DO ASTRONAUTS','SLEEP IN SPACE?'],[2.6,5.4,'LYING, STANDING','OR UPSIDE DOWN?'],[5.4,11.9,'ANY WAY: NO UP OR DOWN','BAG TIED TO THE WALL'],[11.9,18.4,'THE DANGER: A CLOUD','OF THEIR OWN CO2'],
 [18.4,21.2,'THEY CAN WAKE UP','GASPING FOR AIR'],[21.2,24.3,'SO THE CABINS HAVE','AIR BLOWING THROUGH'],[24.3,25.9,'COULD YOU','SLEEP LIKE THAT?'],[25.9,26.6,'FOLLOW →','MORE EVERY DAY'],[26.6,D+1,'HOW DO ASTRONAUTS','SLEEP IN SPACE?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,76,840),fit(l2,76,840));const g=x.createLinearGradient(0,320,0,580);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.55*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,260);
 txt(l1,495,410,sz,'#fff',al);txt(l2,495,410+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 module(u);
 // cabin angle: gentle sway in the hook, then a full roll to show there is no up or down
 let ang=0.12*Math.sin(u*0.9);if(u>=6.2&&u<11.6)ang+=Math.PI*2*ease((u-6.2)/5.0);
 const co2=u>=12.4&&u<24?Math.min(ease((u-12.4)/3.0),1-ease((u-19.5)/2.4)):0,air=u>=18.8&&u<24.6?Math.min(ease((u-18.8)/.5),ease((24.6-u)/.4)):0;
 x.save();x.globalAlpha=0.5;x.fillStyle='#000';x.fillRect(0,0,W,H);x.restore();
 cabin(u,ang,co2,air);
 if(u>=6.4&&u<11.6){const a=Math.min(ease((u-6.6)/.3),ease((11.6-u)/.3));txt('UP?',150,1300,64,'#ffd166',a,'Anton');txt('DOWN?',930-40,820,64,'#ffd166',a*0.9,'Anton','right')}
 if(co2>0.3&&u<19.5){const a=(co2-0.3)/0.7;txt('CO2',790,760,70,'#e8edf5',a,'Anton');txt('(ILLUSTRATION)',790,800,28,'#e8edf5',a,'Anton')}
 if(u<5.4||u>=26.6){for(let k=0;k<3;k++){const ph=(u*0.35+k/3)%1;txt('Z',380-ph*120-k*10,760-ph*150,40+ph*40,'#ffffff',Math.sin(ph*Math.PI)*0.9,'Anton')}}
 cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
