<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- escape-four-worlds (series "Who Lands / Wins First?"): the same ball fired straight up at 3 km/s on Earth, Mars, Mercury and the Moon.
     No air drag, no spin. Radial motion r'' = -GM/r^2 integrated numerically (sim time compressed, the clock shows sim time).
     GM and volumetric mean radius from the NASA NSSDC fact sheets. One shared km scale for every column; the ground arcs use the
     real radii on that scale. Balls and cannons are drawn bigger than scale. -->
<script>
const W=1080,H=1920,FPS=30,D=34.5,LOOP=34.0,V0=3.0,LAUNCH=0.0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)};
const CX=[170,385,600,815],CW=207,GY=1372,YT=722,KMAX=2800,K=(GY-YT)/KMAX; // px per km
const WD=[
 {n:'EARTH',gm:398600,R:6371.0,gr:['#3f7fbf','#1d4f2a','#0b2414'],tint:'rgba(60,120,220,.16)',atm:'rgba(110,170,255,.55)'},
 {n:'MARS',gm:42828,R:3389.5,gr:['#c0623a','#7a3218','#2e1209'],tint:'rgba(200,100,60,.13)'},
 {n:'MERCURY',gm:22032,R:2439.7,gr:['#9d948a','#5c554f','#211e1c'],tint:'rgba(170,160,150,.11)'},
 {n:'MOON',gm:4902.8,R:1737.4,gr:['#bdbbb6','#6c6a66','#242322'],tint:'rgba(200,200,210,.10)'}];
// integrate each flight (sim seconds), store altitude every 1 s
for(const w of WD){let r=w.R,v=V0,t=0,dt=0.25;w.alt=[0];w.ve=Math.sqrt(2*w.gm/w.R);w.g=w.gm/w.R/w.R*1000;w.tap=null;w.tland=null;w.hmax=0;
 while(t<7200){for(let s=0;s<4;s++){const a=-w.gm/(r*r);v+=a*dt;r+=v*dt;t+=dt}
  if(w.tap===null&&v<=0){w.tap=t;w.hmax=r-w.R}
  if(r<w.R){w.tland=t;w.alt.push(0);break}w.alt.push(r-w.R)}}
function alt(w,sm){const s=sm*60;if(s<=0)return 0;if(w.tland!==null&&s>=w.tland)return 0;const i=Math.floor(s),k=s-i;const a=w.alt;if(i+1>=a.length)return a[a.length-1];return a[i]*(1-k)+a[i+1]*k}
// video time -> sim minutes (piecewise linear; events land on the beats of the voice)
const KEY=[[LAUNCH,0],[1.0,1.5],[7.3,WD[0].tap/60],[10.2,WD[0].tland/60],[15.0,WD[1].tap/60],[17.0,WD[2].tap/60],[21.9,WD[1].tland/60],[24.4,WD[2].tland/60],[LOOP,100]];
function sim(u){if(u<=LAUNCH)return 0;for(let i=1;i<KEY.length;i++){if(u<=KEY[i][0]){const [a,p]=KEY[i-1],[b,q]=KEY[i];return p+(q-p)*(u-a)/(b-a)}}return KEY[KEY.length-1][1]}
function vid(sm){for(let i=1;i<KEY.length;i++){const [a,p]=KEY[i-1],[b,q]=KEY[i];if(sm<=q)return a+(b-a)*(sm-p)/(q-p)}return LOOP}
window.MODEL=WD.map(w=>[w.n,w.ve.toFixed(3),w.g.toFixed(2),Math.round(w.hmax),w.tap&&(w.tap/60).toFixed(1),w.tland&&(w.tland/60).toFixed(1)]).concat([['moon@100min',Math.round(alt(WD[3],100))]]);
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const STARS=[];{const r=rnd(77);for(let k=0;k<420;k++)STARS.push([r()*W,r()*H,r()*1.6+.3,r()])}
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=18;x.fillText(s,px,py);x.shadowBlur=5;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const r10=n=>Math.round(n/10)*10;
function column(i,w,u,t){const cx=CX[i],x0=cx-CW/2;const sm=sim(u);const a=alt(w,sm);const smv=sm*60;
 const up=w.tap===null||smv<w.tap,landed=w.tland!==null&&smv>=w.tland;
 x.save();x.beginPath();x.rect(x0,560,CW,H-560);x.clip();
 let g=x.createLinearGradient(0,600,0,GY);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,w.tint);x.fillStyle=g;x.fillRect(x0,600,CW,GY-600);
 // ground: the real radius on the same km scale
 const Rp=w.R*K;g=x.createLinearGradient(0,GY,0,GY+120);g.addColorStop(0,w.gr[0]);g.addColorStop(.25,w.gr[1]);g.addColorStop(1,w.gr[2]);
 if(w.atm){const ag=x.createRadialGradient(cx,GY+Rp,Rp,cx,GY+Rp,Rp+34);ag.addColorStop(0,w.atm);ag.addColorStop(1,'rgba(110,170,255,0)');x.fillStyle=ag;x.beginPath();x.arc(cx,GY+Rp,Rp+34,0,7);x.fill()}
 x.fillStyle=g;x.beginPath();x.arc(cx,GY+Rp,Rp,0,7);x.fill();
 x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.beginPath();x.arc(cx,GY+Rp,Rp,Math.PI*1.25,Math.PI*1.75);x.stroke();
 if(i==0){// ISS height line (about 400 km)
  const yi=GY-400*K;x.save();x.setLineDash([8,8]);x.strokeStyle='rgba(140,220,255,.85)';x.lineWidth=3;x.beginPath();x.moveTo(x0+8,yi);x.lineTo(x0+CW-8,yi);x.stroke();x.restore();
  txt('ISS ~400 km',x0+10,yi+26,20,'rgba(170,230,255,.95)',1,'Mont','left')}
 // trail (max height so far) + peak marker
 const hs=up?a:w.hmax;const by=GY-Math.min(a,KMAX+60)*K;
 if(hs>0){const ty=GY-Math.min(hs,KMAX+60)*K;g=x.createLinearGradient(0,GY,0,ty);g.addColorStop(0,'rgba(255,200,90,.05)');g.addColorStop(1,'rgba(255,210,110,.55)');x.fillStyle=g;x.fillRect(cx-3,ty,6,GY-ty);}
 if(!up&&w.tap!==null){const py=GY-w.hmax*K;const pa=ease((u-vid(w.tap/60))/.3);x.globalAlpha=pa;x.fillStyle='#ffd166';x.fillRect(cx-46,py-2,92,4);x.globalAlpha=1;
  txt('PEAK '+fmt(r10(w.hmax))+' km',cx,py-14,24,'#ffe3a0',pa,'Mont')}
 // cannon (drawn bigger than scale)
 x.save();x.translate(cx,GY+2);x.fillStyle='#2a2f38';x.beginPath();x.roundRect(-26,-18,52,22,6);x.fill();
 const cg=x.createLinearGradient(-13,0,13,0);cg.addColorStop(0,'#5b636f');cg.addColorStop(.5,'#9aa3ae');cg.addColorStop(1,'#4a515b');x.fillStyle=cg;x.fillRect(-13,-62,26,48);x.fillStyle='#1c2027';x.fillRect(-15,-66,30,8);x.restore();
 // muzzle flash at launch
 const fk=u-LAUNCH;if(fk>-0.02&&fk<0.5){const fa=Math.exp(-Math.max(0,fk)/.12);const fg=x.createRadialGradient(cx,GY-66,0,cx,GY-66,90);fg.addColorStop(0,'rgba(255,240,200,'+fa+')');fg.addColorStop(.4,'rgba(255,170,70,'+fa*.6+')');fg.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=fg;x.fillRect(cx-90,GY-156,180,180)}
 // ball
 if(a<KMAX+40){const bY=u<LAUNCH?GY-60:Math.min(by,GY-60-(1-cl(fk/.15))*0),br=14;
  const yb=landed?GY-14:(u<LAUNCH?GY-60:Math.min(GY-60,by));const bxx=landed?cx+46:cx;
  const gl=x.createRadialGradient(bxx,yb,0,bxx,yb,br*3.2);gl.addColorStop(0,'rgba(255,200,90,.5)');gl.addColorStop(1,'rgba(255,200,90,0)');x.fillStyle=gl;x.fillRect(bxx-br*3.2,yb-br*3.2,br*6.4,br*6.4);
  const bg=x.createRadialGradient(bxx-br*.35,yb-br*.4,br*.1,bxx,yb,br);bg.addColorStop(0,'#fff8ea');bg.addColorStop(.5,'#f4b53f');bg.addColorStop(1,'#a8551c');x.fillStyle=bg;x.beginPath();x.arc(bxx,yb,br,0,7);x.fill()}
 else{// off the top of the chart: arrow
  const pulse=.75+.25*Math.sin(t*6);x.globalAlpha=pulse;x.fillStyle=t>=25.2&&t<LOOP?'#9df0bf':'#ffd166';x.beginPath();x.moveTo(cx,YT-4);x.lineTo(cx-22,YT+30);x.lineTo(cx+22,YT+30);x.fill();x.globalAlpha=1}
 // landing dust
 if(landed){const k=u-vid(w.tland/60);const ra=ease(k/.15)*(1-ease((k-.2)/1.0));if(ra>0){const rr=20+70*Math.sqrt(cl(k/1.2));x.globalAlpha=ra*.8;const dg=x.createRadialGradient(cx+46,GY-4,rr*.2,cx+46,GY-4,rr);
  dg.addColorStop(0,'rgba(255,245,225,0)');dg.addColorStop(.6,'rgba(255,240,215,.7)');dg.addColorStop(1,'rgba(255,240,215,0)');x.fillStyle=dg;x.beginPath();x.ellipse(cx+46,GY-6,rr,rr*.4,0,0,7);x.fill();x.globalAlpha=1}}
 x.restore();
 // name in the ground band
 txt(w.n,cx,1428,fit(w.n,40,CW-16),'#fff',1,'Anton');
 // live altitude counter
 const esc=i==3&&a>KMAX&&t>=25.2;const done=landed;const kd=done?u-vid(w.tland/60):0;const pop=done?1+0.3*Math.exp(-kd/.12):1;
 const col=esc?'#9df0bf':(done?'#ffffff':'#ffd166');
 txt(done?'LANDED':fmt(a)+' km',cx,676,fit(done?'LANDED':'99,999 km',40,CW-14)*pop,col,u>-0.2?1:0.85,'Anton');
 const sub=done?'after '+Math.round(w.tland/60)+' min':(esc?'still climbing':(up?'climbing':'falling'));
 txt(sub,cx,704,20,'rgba(235,240,248,.9)',u>LAUNCH+0.2?1:0,'Mont');}
const CARDS=[[0,6.0,'SAME SHOT, 4 WORLDS','WHICH BALL NEVER COMES BACK?'],[6.0,8.75,'EARTH: 490 km UP','HIGHER THAN THE ISS'],
 [8.75,11.2,'EARTH: BACK DOWN','AFTER 11 MINUTES'],[11.2,16.35,'MARS OR MERCURY:','WHICH GOES HIGHER?'],[16.35,20.5,'MERCURY: 2,420 km','SMALLER, SO ITS PULL FADES FASTER'],
 [20.5,25.2,'MARS: BACK IN 49 MIN','MERCURY: 69 MIN'],[25.2,31.4,'THE MOON: GONE FOREVER','ESCAPE SPEED: ONLY 2.4 km/s'],[31.4,33.0,'WHERE WOULD YOU','LAUNCH FROM?'],
 [33.0,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'SAME SHOT, 4 WORLDS','WHICH BALL NEVER COMES BACK?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,78,820),l2?fit(l2,80,820):99);const pop=(l1.startsWith('MERCURY:')||l1.startsWith('THE MOON'))?1+0.08*Math.exp(-(t-a)/.15):1;
 txt(l1,495,404,sz*pop,'#fff',al);if(l2)txt(l2,495,404+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03040b');g.addColorStop(.5,'#060a18');g.addColorStop(1,'#02030a');x.fillStyle=g;x.fillRect(0,0,W,H);
 g=x.createRadialGradient(760,520,40,760,520,700);g.addColorStop(0,'rgba(70,60,140,.22)');g.addColorStop(1,'rgba(70,60,140,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 g=x.createRadialGradient(220,1050,40,220,1050,620);g.addColorStop(0,'rgba(30,90,150,.16)');g.addColorStop(1,'rgba(30,90,150,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of STARS){x.globalAlpha=(.25+.6*s[3])*(.7+.3*Math.sin(t*1.3+s[3]*40));x.fillStyle='#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}x.globalAlpha=1;
 const u=t>=LOOP?t-D:t;
 // km grid
 for(let km=500;km<=2500;km+=500){const y=GY-km*K;x.fillStyle='rgba(255,255,255,.13)';x.fillRect(CX[0]-CW/2,y-1,CX[3]+CW/2-(CX[0]-CW/2),2);
  txt(fmt(km)+' km',CX[3]+CW/2-6,y-8,19,'rgba(230,236,245,.7)',1,'Mont','right')}
 for(let i=0;i<4;i++)column(i,WD[i],u,t);
 for(let i=1;i<4;i++){x.fillStyle='rgba(255,255,255,.08)';x.fillRect((CX[i-1]+CX[i])/2-1,640,2,GY-640)}
 // Moon win glow
 const mk=t-25.2;if(mk>0&&t<LOOP){x.save();x.globalAlpha=.6*ease(mk/.4);x.strokeStyle='#9df0bf';x.lineWidth=4;x.strokeRect(CX[3]-CW/2+3,640,CW-6,GY-640+70);x.restore()}
 // top shading so the cards read
 g=x.createLinearGradient(0,300,0,620);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,300,W,320);
 cards(t);
 const fa=(t<6.0?ease((6.0-t)/.3):0)+(t>=LOOP?1:0);txt('3 km/s straight up · no air drag · balls not to scale',495,560,23,'#eef2f8',fa,'Mont');
 const ga=t>=11.2&&t<16.35?Math.min(ease((t-11.2)/.3),ease((16.35-t)/.2)):0;txt('both pull about 3.7 m/s² at the ground',495,560,24,'#eef2f8',ga,'Mont');
 const sm=sim(u);txt(u<LAUNCH?'READY…':Math.floor(sm)+' MIN AFTER LAUNCH',495,618,30,'#cfe6ff',t>=LOOP?0:1,'Mont');
 g=x.createRadialGradient(540,980,560,540,980,1300);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
