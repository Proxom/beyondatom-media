<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- earth-tunnel (series "What If…?"): jump into a tunnel from the North Pole to the South Pole (no air, no heat, no friction).
     Gravity inside Earth from the PREM density model (Dziewonski & Anderson 1981), integrated numerically:
     core-mantle boundary (2,891 km deep) at 12.7 min, inner-core boundary (5,150 km) at 17.0 min, centre at 19.1 min and 9.9 km/s,
     other side at 38.2 min (38 min 11 s, as in Klotz, Am. J. Phys. 83, 231 (2015)).
     Video: real fall time 0.15 -> 38.18 min mapped linearly onto 0 -> 21 s; after the far side the clock runs in slow motion
     (the fall back starts from rest), the view turns 180 degrees so the South Pole is on top, and the end matches frame 0 (loop).
     Layer radii from PREM; the crust is drawn thicker than scale; the astronaut is drawn far bigger than scale. -->
<script>
const W=1080,H=1920,FPS=30,D=31.0,RE=6371e3,G=6.674e-11,TARR=21.0,S0=0.15;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)};
function rho(r){const x=r/6371e3,k=r/1e3;
 if(k<=1221.5)return 13.0885-8.8381*x*x;if(k<=3480)return 12.5815-1.2638*x-3.6426*x*x-5.5281*x**3;
 if(k<=5701)return 7.9565-6.4761*x+5.5283*x*x-3.0807*x**3;if(k<=5771)return 5.3197-1.4836*x;if(k<=5971)return 11.2494-8.0298*x;
 if(k<=6151)return 7.1089-3.8045*x;if(k<=6346.6)return 2.6910+0.6924*x;if(k<=6356)return 2.9;if(k<=6368)return 2.6;return 1.02}
const NM=6371,M=new Float64Array(NM+1);for(let i=0;i<NM;i++){const r=(i+.5)*1e3;M[i+1]=M[i]+4*Math.PI*r*r*rho(r)*1000*1e3}
const gAt=r=>r<=0?0:G*M[Math.min(NM,Math.floor(r/1e3))]/(r*r);
// integrate the fall to the centre; the second half mirrors it
const TT=[],RR=[],VV=[];{let r=RE,v=0,t=0;const dt=.05;TT.push(0);RR.push(r);VV.push(0);while(r>0){v+=gAt(r)*dt;r-=v*dt;t+=dt;TT.push(t);RR.push(Math.max(r,0));VV.push(v)}}
const TC=TT[TT.length-1],TTOT=2*TC;
function state(ts){// ts seconds since jump -> [signed position (+ north, - south) in m, speed m/s]
 const P2=2*TTOT,k0=((ts%P2)+P2)%P2,back=k0>=TTOT,k=back?k0-TTOT:k0;let tt=k<=TC?k:TTOT-k;let i=Math.min(TT.length-2,Math.floor(tt/0.05));const f=cl((tt-TT[i])/0.05);
 const r=RR[i]*(1-f)+RR[i+1]*f,v=VV[i]*(1-f)+VV[i+1]*f;const sgn=(k<=TC?1:-1)*(back?-1:1);return [sgn*r,v]}
const SLOW=(S0*60)/(D-TARR);  // after arrival: real seconds per video second (slow motion)
function simSec(t){if(t<TARR)return (S0+t*(TTOT/60-S0)/TARR)*60;return TTOT+(t-TARR)*SLOW}
const td=d=>{let i=0;while(i<RR.length-1&&RE-RR[i]<d)i++;return TT[i]};
window.MODEL={TTOT:(TTOT/60).toFixed(3),TC:(TC/60).toFixed(2),vmax:(VV[VV.length-1]/1e3).toFixed(2),cmb:(td(2891e3)/60).toFixed(2),icb:(td(5150e3)/60).toFixed(2),mass:M[NM].toExponential(4),
 tCMB:(td(2891e3)/60/(TTOT/60-S0)*TARR).toFixed(2),tCen:((TC/60-S0)/(TTOT/60-S0)*TARR).toFixed(2)};
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(9),STARS=[];for(let i=0;i<360;i++)STARS.push([R()*W,R()*H,R()*1.4+.3,R()]);
const BLOBS=[];for(let i=0;i<260;i++)BLOBS.push([R()*Math.PI*2,Math.sqrt(R()),R()*.05+.02,R()]);
const CX=540,CY=985,RP=430;
const LAY=[[1,'#7a5236','#5b3b25'],[0.985,'#b5461a','#93300d'],[0.5462,'#ffa43a','#f06a1a'],[0.1917,'#fff6c8','#ffd35a']];
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function astro(k,v){// k = px per 1.8 m figure; drawn at the origin, feet at 0, head up
 const suit='#f2f3f5';x.fillStyle='#b9bec7';x.fillRect(-0.2*k,-0.85*k,0.17*k,0.85*k);x.fillStyle=suit;x.fillRect(0.03*k,-0.85*k,0.17*k,0.85*k);
 x.fillStyle='#c8ccd3';x.fillRect(-0.36*k,-1.48*k,0.16*k,0.6*k);const tg=x.createLinearGradient(-0.25*k,0,0.25*k,0);tg.addColorStop(0,'#cfd3da');tg.addColorStop(.5,suit);tg.addColorStop(1,'#dfe2e7');
 x.fillStyle=tg;x.beginPath();x.roundRect(-0.25*k,-1.5*k,0.5*k,0.7*k,0.1*k);x.fill();x.fillStyle='#e0533a';x.fillRect(-0.25*k,-1.2*k,0.5*k,0.05*k);
 // arms up (falling)
 for(const s of [-1,1]){x.save();x.translate(s*0.22*k,-1.42*k);x.rotate(s*(0.5+0.15*Math.sin(v)));x.fillStyle=suit;x.beginPath();x.roundRect(-0.065*k,-0.6*k,0.13*k,0.6*k,0.06*k);x.fill();x.restore()}
 x.fillStyle=suit;x.beginPath();x.arc(0.02*k,-1.62*k,0.19*k,0,7);x.fill();const vg=x.createLinearGradient(0,-1.75*k,0.2*k,-1.5*k);vg.addColorStop(0,'#f6d57a');vg.addColorStop(1,'#9a6a1c');
 x.fillStyle=vg;x.beginPath();x.ellipse(0.06*k,-1.62*k,0.12*k,0.12*k,0,0,7);x.fill()}
function earth(t,rot,Z){const tw=14*Math.pow(Z,-0.42);// cross-section, drawn in world coords: centre (0,0), radius RP, north up before rotation
 // atmosphere glow
 const ag=x.createRadialGradient(0,0,RP*.98,0,0,RP*1.12);ag.addColorStop(0,'rgba(110,170,255,.55)');ag.addColorStop(1,'rgba(110,170,255,0)');x.fillStyle=ag;x.beginPath();x.arc(0,0,RP*1.12,0,7);x.fill();
 // ocean / surface band
 x.fillStyle='#1c58a6';x.beginPath();x.arc(0,0,RP,0,7);x.fill();
 for(const [f,c1,c2] of LAY.slice(0)){const rr=RP*(f==1?0.992:f);const g=x.createRadialGradient(0,0,rr*.2,0,0,rr);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.beginPath();x.arc(0,0,rr,0,7);x.fill()}
 // mantle convection blobs (subtle)
 x.save();x.beginPath();x.arc(0,0,RP*.985,0,7);x.arc(0,0,RP*.5462,0,7,true);x.clip();
 for(const b of BLOBS){const a=b[0]+t*0.01*(b[3]-.5),rr=RP*(.56+.42*b[1]);x.fillStyle='rgba(255,170,90,'+(b[2]*1.6)+')';x.beginPath();x.arc(Math.cos(a)*rr,Math.sin(a)*rr,RP*.035*(1+b[3]),0,7);x.fill()}x.restore();
 // core glow
 const cg=x.createRadialGradient(0,0,0,0,0,RP*.62);cg.addColorStop(0,'rgba(255,250,220,.55)');cg.addColorStop(1,'rgba(255,200,90,0)');x.fillStyle=cg;x.beginPath();x.arc(0,0,RP*.62,0,7);x.fill();
 // layer edge lines
 x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;for(const f of [0.985,0.5462,0.1917]){x.beginPath();x.arc(0,0,RP*f,0,7);x.stroke()}
 // polar ice caps (both poles look the same, so the turned view loops)
 for(const s of [-1,1]){x.fillStyle='#eef6ff';x.beginPath();x.arc(0,0,RP*1.004,s<0?Math.PI*1.36:Math.PI*.36,s<0?Math.PI*1.64:Math.PI*.64);x.arc(0,0,RP*.986,s<0?Math.PI*1.64:Math.PI*.64,s<0?Math.PI*1.36:Math.PI*.36,true);x.fill()}
 // tunnel
 x.fillStyle='rgba(8,6,10,.92)';x.fillRect(-tw/2,-RP*1.01,tw,RP*2.02);x.fillStyle='rgba(255,220,160,.3)';x.fillRect(-tw/2-1.5/Z,-RP*1.01,1.5/Z,RP*2.02);x.fillRect(tw/2,-RP*1.01,1.5/Z,RP*2.02)}
function cam(t){// zoom Z and focus point (world px) + rotation
 const zin=t>=30.2?1:(t<3.6?1-ease(t/3.6):(t>28.9?ease((t-28.9)/1.3):0));const Z=Math.exp(Math.log(34)*zin);
 const rot=Math.PI*ease((t-24.3)/2.6);return [Z,zin,rot]}
const CARDS=[[0,3.9,'A TUNNEL THROUGH EARTH','MINUTES, HOURS OR DAYS?'],[3.9,6.0,'GUESS NOW:','HOW LONG TO FALL THROUGH?'],[6.0,7.03,'GRAVITY PULLS YOU','FASTER AND FASTER'],
 [7.03,9.9,'13 MINUTES: THE CORE','INTO THE LIQUID OUTER CORE'],[9.9,13.3,'THE CENTER:','9.9 km PER SECOND'],[13.3,18.7,'NOW GRAVITY','SLOWS YOU DOWN'],[18.7,21.3,'YOU STOP RIGHT AT','THE SOUTH POLE']];
const BIG=[[21.3,23.6,'38 MIN 11 S','TO FALL THROUGH EARTH'],[23.6,25.6,'NOT THE TEXTBOOK 42 MIN:','THE HEAVY CORE SPEEDS YOU UP'],[25.6,27.6,'THEN YOU FALL','ALL THE WAY BACK'],[27.6,28.9,'DID YOU','GUESS RIGHT?'],[28.9,30.2,'FOLLOW →','MORE EVERY DAY'],[30.2,D+1,'A TUNNEL THROUGH EARTH','MINUTES, HOURS OR DAYS?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0?1:ease((t-a)/.2),ease((b-t)/.18));
  const sz=Math.min(fit(l1,76,840),fit(l2,76,840));txt(l1,495,398,sz,'#fff',al);txt(l2,495,398+sz*1.08,sz,'#ffd166',al)}
 for(const [a,b,l1,l2] of BIG){if(t<a||t>=b)continue;const al=Math.min(b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.15)),big=l1=='38 MIN 11 S';const pop=big?1+.1*Math.exp(-(t-a)/.15):1;
  const s1=Math.min(fit(l1,big?120:76,840),big?999:fit(l2,76,840))*pop;txt(l1,495,398+(big?60:0),s1,'#fff',al);txt(l2,495,398+(big?60:0)+(big?78:s1*1.08),big?fit(l2,64,840):s1,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
 const u=t>=30.2?t-D:t;               // the last 0.8 s is the start again (loop)
 const ts=u<0?(S0*60+u*SLOW):simSec(u);const [p,v]=state(ts);
 const [Z,zin,rot0]=cam(t);const rot=t>=30.2?0:rot0;
 // person position in world px (north up), then rotated
 const py=-p/RE*RP;const fx=0,fy=py;const c=Math.cos(rot),s=Math.sin(rot);const rpy=fy*c,rpx=-fy*s;
 // camera: blend focus from Earth centre to the person when zoomed in
 const fyS=rpy*(1-(1-0.48*zin)/Z);
 for(const st of STARS){x.globalAlpha=.35+.5*st[3];x.fillStyle='#fff';x.beginPath();x.arc(st[0],st[1],st[2],0,7);x.fill()}x.globalAlpha=1;
 x.save();x.translate(CX,CY);x.scale(Z,Z);x.translate(0,-fyS);x.rotate(rot);earth(t,rot,Z);x.restore();
 // astronaut (screen size fixed; not to scale) with speed streaks
 const sx=CX+rpx*Z*(1/Z),sy=CY+(rpy-fyS)*Z;const k=54+30*zin;const dir=(v>1?(p>0?1:-1):0)*(rot>Math.PI/2?-1:1); // +1 = moving down on screen
 const vs=v/9918;if(vs>0.02){x.save();x.globalAlpha=.6*cl(vs*2);x.strokeStyle='#ffe2b0';x.lineWidth=3;for(const ox of [-22,-8,8,22]){x.beginPath();x.moveTo(sx+ox,sy-dir*(k*1.2));x.lineTo(sx+ox,sy-dir*(k*1.2+40+160*vs));x.stroke()}x.restore()}
 const gl=x.createRadialGradient(sx,sy-k*.9,0,sx,sy-k*.9,k*1.4);gl.addColorStop(0,'rgba(255,255,255,.45)');gl.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gl;x.fillRect(sx-k*1.5,sy-k*2.4,k*3,k*3);
 x.save();x.translate(sx,sy+k*0.9);x.rotate(Math.sin(t*1.7)*0.12);astro(k,t*3);x.restore();
 // layer labels (left of the tunnel, upright), shown in the full view
 const la=(1-zin)*(t<21.3?1:cl((24.3-t)/.3));
 {const pa=t<30.2?cl(1-(1-zin)*3):1;if(pa>0.01){txt('NORTH POLE',sx+100,sy-k*1.9,40,'#ffffff',pa,'Anton','left')}}if(la>0.01){const L=[['CRUST',0.992],['MANTLE',0.77],['OUTER CORE',0.37],['INNER CORE',0.0]];
  const depth=RE-Math.abs(p),pr=Math.abs(p)/RE;
  for(const [n,f] of L){const yy=CY-f*RP+(f==0?10:24);const here=(n=='CRUST'&&pr>0.985)||(n=='MANTLE'&&pr<=0.985&&pr>0.5462)||(n=='OUTER CORE'&&pr<=0.5462&&pr>0.1917)||(n=='INNER CORE'&&pr<=0.1917);
   txt(n,CX-38,yy,here?38:30,here?'#ffffff':'rgba(255,255,255,.7)',la,'Mont','right')}}
 // clock (top right) + depth line
 const ca=(1-zin)*(t<30.2?1:0);if(ca>0.01&&!(t>=21.3&&t<23.6)){const sec=Math.round(ts),mm=Math.floor(sec/60),ss=sec%60;const clock=mm+':'+String(ss).padStart(2,'0');
  txt(clock,925,640,96,'#fff',ca,'Anton','right');const dkm=Math.round((RE-Math.abs(p))/1e3);const far=p<0;
  txt(far?(Math.round((RE-Math.abs(p))/1e3)).toLocaleString('en-US')+' km TO GO':'DEPTH '+dkm.toLocaleString('en-US')+' km',925,688,30,'#ffd9a0',ca,'Mont','right');
  txt(Math.round(v/1e3*10)/10+' km/s',925,728,30,'#cfe8ff',ca,'Mont','right')}
 // top band for cards
 const g=x.createLinearGradient(0,250,0,560);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.35,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,250,W,310);
 cards(t);}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
