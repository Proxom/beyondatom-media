<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- space-toilet (series "Life in Space"): how astronauts use the toilet in orbit.
     NASA, "Boldly Go! NASA's New Space Toilet..." (17 Sep 2020): space toilets use air flow to pull urine and feces away from the body; a specially shaped funnel and hose
       for urine and the seat for bowel movements; air flow starts automatically when the lid is lifted; foot restraints and handholds keep astronauts from floating away;
       pre-treated urine goes to a regenerative system that recycles water.
     NASA, "NASA Achieves Water Recovery Milestone on International Space Station" (2023): 98% of the water crews take to space is recovered (urine processor + brine processor).
     Drawing: the toilet, the air streaks and the recycling machine are simplified illustrations. -->
<script>
const W=1080,H=1920,FPS=30,D=29.6,LOOP=29.4;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(31);const AIR=[];for(let i=0;i<60;i++)AIR.push([R(),R(),R(),R()]);const DROP=[];for(let i=0;i<26;i++)DROP.push([R(),R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function module(t){let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#7d848e');g.addColorStop(.5,'#bfc5cd');g.addColorStop(1,'#757c86');x.fillStyle=g;x.fillRect(0,0,W,H);
 const off=(t*10)%160;x.strokeStyle='rgba(60,66,76,.5)';x.lineWidth=4;
 for(let y=-160;y<H+160;y+=160){x.strokeRect(20,y+off,200,140);x.strokeRect(860,y+off+40,200,140)}
 x.fillStyle='rgba(40,46,56,.35)';for(let y=-160;y<H+160;y+=160){x.fillRect(45,y+off+50,150,14);x.fillRect(885,y+off+90,150,14)}
 x.save();x.globalAlpha=.55;x.fillStyle='#000';x.fillRect(0,0,W,H);x.restore()}
// toilet: wall unit with fan grill, small pointy seat on a can, funnel on a hose, foot loops and handholds. origin = seat centre
function toilet(t,air,hiFeet,hiFan){
 // wall panel
 x.fillStyle='#d9dde3';x.beginPath();x.roundRect(-330,-560,660,900,30);x.fill();x.strokeStyle='#8e96a1';x.lineWidth=8;x.stroke();
 // fan grill
 x.save();x.translate(0,-380);x.fillStyle='#3a414c';x.beginPath();x.arc(0,0,105,0,7);x.fill();
 x.save();x.rotate(t*(air>0.05?16:0.4));x.fillStyle='#aab2bd';for(let k=0;k<5;k++){x.rotate(Math.PI*2/5);x.beginPath();x.ellipse(48,0,46,16,0,0,7);x.fill()}x.restore();
 x.strokeStyle='#555d69';x.lineWidth=6;for(let r=40;r<=100;r+=30){x.beginPath();x.arc(0,0,r,0,7);x.stroke()}
 if(hiFan>0.01){x.strokeStyle='rgba(120,255,160,'+hiFan+')';x.lineWidth=12;x.beginPath();x.arc(0,0,118,0,7);x.stroke()}x.restore();
 // can + seat
 let g=x.createLinearGradient(-120,0,120,0);g.addColorStop(0,'#9aa2ad');g.addColorStop(.5,'#eef1f4');g.addColorStop(1,'#8f97a2');x.fillStyle=g;x.beginPath();x.roundRect(-120,20,240,300,20);x.fill();
 x.fillStyle='#5b6370';x.beginPath();x.ellipse(0,20,150,46,0,0,7);x.fill();x.fillStyle='#1f242b';x.beginPath();x.ellipse(0,20,70,22,0,0,7);x.fill();
 x.fillStyle='#e9ecf0';x.beginPath();x.moveTo(-150,14);x.quadraticCurveTo(0,-30,150,14);x.quadraticCurveTo(0,40,-150,14);x.fill();
 // hose + funnel (left)
 x.strokeStyle='#e0b23a';x.lineWidth=26;x.lineCap='round';x.beginPath();x.moveTo(-120,250);x.bezierCurveTo(-330,240,-300,40,-250,-80);x.stroke();
 x.save();x.translate(-250,-110);x.rotate(-0.25);x.fillStyle='#f2c94c';x.beginPath();x.moveTo(-60,-70);x.lineTo(60,-70);x.lineTo(16,30);x.lineTo(-16,30);x.closePath();x.fill();x.fillStyle='#b8901f';x.beginPath();x.ellipse(0,-70,60,16,0,0,7);x.fill();x.restore();
 // handholds (yellow rails) and foot loops
 x.strokeStyle='#e8c33a';x.lineWidth=18;for(const sx of [-1,1]){x.beginPath();x.moveTo(sx*300,-240);x.lineTo(sx*300,-60);x.stroke()}
 if(hiFeet>0.01){x.strokeStyle='rgba(120,255,160,'+hiFeet+')';x.lineWidth=10;for(const sx of [-1,1]){x.strokeRect(sx*300-22,-262,44,224)}}
 x.strokeStyle='#2f3742';x.lineWidth=16;for(const sx of [-1,1]){x.beginPath();x.ellipse(sx*120,560,70,26,0,0,7);x.stroke()}
 if(hiFeet>0.01){x.strokeStyle='rgba(120,255,160,'+hiFeet+')';x.lineWidth=8;for(const sx of [-1,1]){x.beginPath();x.ellipse(sx*120,560,88,40,0,0,7);x.stroke()}}
 // air streaks into the seat and the funnel
 if(air>0.01){for(const a of AIR){const ph=(a[0]+t*1.1*(0.6+a[2]))%1;const tgt=a[3]<0.6?[0,20]:[-250,-120];const ang=a[1]*Math.PI*2,rr=lerp(420,10,ph);
  const sx=tgt[0]+Math.cos(ang)*rr*0.9,sy=tgt[1]+Math.sin(ang)*rr*0.55-(1-ph)*80;const dx=(tgt[0]-sx)*0.12,dy=(tgt[1]-sy)*0.12;
  x.strokeStyle='rgba(150,220,255,'+(0.9*air*Math.sin(ph*Math.PI))+')';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+dx,sy+dy);x.stroke()}}}
function astronaut(t,px,py,sc,rot,feetIn){x.save();x.translate(px,py);x.scale(sc,sc);x.rotate(rot);
 // legs
 x.strokeStyle='#e8b896';x.lineWidth=34;x.lineCap='round';
 if(feetIn){x.beginPath();x.moveTo(-40,140);x.lineTo(-90,330);x.stroke();x.beginPath();x.moveTo(40,140);x.lineTo(90,330);x.stroke()}
 else{x.beginPath();x.moveTo(-40,140);x.lineTo(-110,300);x.stroke();x.beginPath();x.moveTo(40,140);x.lineTo(70,320);x.stroke()}
 x.fillStyle='#1b1f26';for(const p of (feetIn?[[-90,335],[90,335]]:[[-112,305],[72,325]])){x.beginPath();x.ellipse(p[0],p[1],34,18,0,0,7);x.fill()}
 // shorts + polo
 x.fillStyle='#2c3e66';x.beginPath();x.roundRect(-70,90,140,90,18);x.fill();
 x.fillStyle='#1e2f57';x.beginPath();x.roundRect(-85,-120,170,230,40);x.fill();x.fillStyle='#e8c33a';x.fillRect(-60,-70,40,10);
 // arms
 x.strokeStyle='#1e2f57';x.lineWidth=36;if(feetIn){x.beginPath();x.moveTo(-70,-90);x.lineTo(-175,-150);x.stroke();x.beginPath();x.moveTo(70,-90);x.lineTo(175,-150);x.stroke()}
 else{x.beginPath();x.moveTo(-70,-90);x.lineTo(-160,-200);x.stroke();x.beginPath();x.moveTo(70,-90);x.lineTo(150,-210);x.stroke()}
 // head
 x.fillStyle='#e8b896';x.beginPath();x.arc(0,-190,70,0,7);x.fill();x.fillStyle='#3b2a20';x.beginPath();x.arc(0,-205,72,Math.PI*1.05,Math.PI*1.95);x.fill();
 x.strokeStyle='#5b3d2c';x.lineWidth=5;x.fillStyle='#2b1d14';x.beginPath();x.arc(-24,-188,7,0,7);x.fill();x.beginPath();x.arc(24,-188,7,0,7);x.fill();
 x.beginPath();x.arc(0,-160,13,0.2,Math.PI-0.2);x.stroke();x.restore()}
function chips(u){if(u<4.6||u>=14.3)return;const a=Math.min(ease((u-4.6)/.3),ease((14.3-u)/.3));const L=[['A BAG',270],['A FAN',540],['MAGNETS',810]];
 for(let i=0;i<3;i++){const [s,cx]=L[i];const ai=a*ease((u-4.6-i*0.35)/.25);if(ai<=0.01)continue;const win=i==1&&u>=7.5;const lose=i!=1&&u>=7.5;
  x.save();x.globalAlpha=ai*(lose?0.35:1);x.fillStyle=win?'#1f9d55':'rgba(20,24,32,.85)';x.beginPath();x.roundRect(cx-120,620,240,96,22);x.fill();x.strokeStyle=win?'#8dffb8':'#ffd166';x.lineWidth=5;x.stroke();x.restore();
  txt(s,cx,688,fit(s,60,210),'#fff',ai*(lose?0.35:1))}}
function recycle(u,k){// pipe from the toilet down to the water machine, then up to a drink pouch; k = reveal 0..1
 if(k<=0.01)return;x.save();x.globalAlpha=k;
 x.strokeStyle='#e0b23a';x.lineWidth=34;x.lineCap='round';x.beginPath();x.moveTo(300,1110);x.lineTo(300,1290);x.lineTo(430,1290);x.stroke();
 x.fillStyle='#2b3340';x.beginPath();x.roundRect(420,1160,400,270,30);x.fill();x.strokeStyle='#8fd3ff';x.lineWidth=7;x.stroke();
 txt('WATER',620,1250,62,'#cfe9ff',k);txt('RECOVERY',620,1320,62,'#cfe9ff',k);
 for(let i=0;i<3;i++){x.fillStyle='rgba(143,211,255,'+(0.4+0.4*Math.sin(u*4+i))+')';x.beginPath();x.arc(540+i*80,1380,16,0,7);x.fill()}
 x.strokeStyle='#8fd3ff';x.lineWidth=34;x.beginPath();x.moveTo(820,1290);x.lineTo(910,1290);x.lineTo(910,1080);x.stroke();
 x.fillStyle='rgba(180,225,255,.92)';x.beginPath();x.roundRect(810,760,200,320,36);x.fill();x.fillStyle='#3d8bd6';const lvl=cl((u-19)/6);x.beginPath();x.roundRect(822,1068-290*lvl,176,290*lvl+0.1,26);x.fill();
 x.fillStyle='#e8c33a';x.fillRect(898,700,24,70);
 for(const d of DROP){const ph=(d[0]+u*0.6)%1;let px,py;if(ph<0.25){const q=ph/0.25;px=300;py=lerp(1110,1290,q)}else if(ph<0.45){const q=(ph-.25)/.2;px=lerp(300,430,q);py=1290}else if(ph<0.6){px=-99;py=-99}else if(ph<0.75){const q=(ph-.6)/.15;px=lerp(820,910,q);py=1290}else{const q=(ph-.75)/.25;px=910;py=lerp(1290,1080,q)}
  x.fillStyle=ph<0.5?'#ffd34d':'#bfe6ff';x.beginPath();x.arc(px,py,11,0,7);x.fill()}
 x.restore()}
const CARDS=[[-1,4.6,'HOW DO ASTRONAUTS','USE THE TOILET?'],[4.6,7.5,'NOTHING FALLS. GUESS:','WHAT DOES THE JOB?'],[7.5,14.3,'A FAN! AIR FLOW','PULLS IT ALL AWAY'],[14.3,18.0,'FEET AND HANDS','HELD IN PLACE'],
 [18.0,22.2,'URINE BECOMES','DRINKING WATER'],[22.2,27.2,'98% OF CREW WATER','CAN BE RECOVERED'],[27.2,28.7,'COULD YOU','GO IN SPACE?'],[28.7,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'HOW DO ASTRONAUTS','USE THE TOILET?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,840),fit(l2,80,840));const g=x.createLinearGradient(0,320,0,600);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.6*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,280);
 txt(l1,495,420,sz,'#fff',al);txt(l2,495,420+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 module(u);
 const air=u>=7.6&&u<17.6?Math.min(ease((u-7.6)/.4),ease((17.6-u)/.4)):(u<4.6||u>=LOOP-0.01?0.5:0);
 const hiFeet=u>=14.4&&u<18?Math.min(ease((u-14.4)/.3),ease((18-u)/.3))*(0.6+0.4*Math.sin(u*6)):0;
 const hiFan=u>=7.6&&u<11?Math.min(ease((u-7.6)/.3),ease((11-u)/.3))*(0.6+0.4*Math.sin(u*6)):0;
 // camera: toilet big in the centre, slow push; in the recycle part it slides left and shrinks
 const rk=u>=17.9&&u<27.4?Math.min(ease((u-17.9)/.8),ease((27.4-u)/.6)):0;
 const zoom=lerp(1.1+0.04*Math.sin(u*0.4),0.62,rk),cx=lerp(540,300,rk),cy=lerp(1240,900,rk);
 x.save();x.translate(cx,cy);x.scale(zoom,zoom);toilet(u,air,hiFeet,hiFan);
 // astronaut: floats beside it in the hook, then stands in the foot loops holding the rails
 const inF=u>=14.3&&u<18;const fl=u<14.3||u>=LOOP;
 const ha=u<7.4?ease((7.4-u)/.4):u>=27.2?ease((u-27.2)/.5):0;if(ha>0.01){x.globalAlpha=ha;astronaut(u,-165+Math.sin(u*0.8)*20,-300+Math.sin(u*1.1)*18,0.7,-0.3+Math.sin(u*0.6)*0.12,false);x.globalAlpha=1}
 if(inF){const a=ease((u-14.3)/.35);x.globalAlpha=a;astronaut(u,0,170,1.08,0,true);x.globalAlpha=1}
 // floating toilet paper roll in the hook (nothing falls)
 if(u<7.4||u>=27.2){x.save();x.globalAlpha=u<7.4?ease((7.4-u)/.4):ease((u-27.2)/.5);x.translate(200+Math.sin(u*0.7)*30,-230+Math.cos(u*0.9)*20);x.rotate(u*0.8);x.fillStyle='#f5f5f0';x.beginPath();x.roundRect(-45,-40,90,80,14);x.fill();x.fillStyle='#c9c9c0';x.beginPath();x.arc(0,0,14,0,7);x.fill();x.restore()}
 x.restore();
 if(u>=8.2&&u<14.3){const a=Math.min(ease((u-8.2)/.3),ease((14.3-u)/.3));txt('FUNNEL + HOSE',290,990,68,'#ffd166',a);txt('SEAT',800,1300,76,'#ffd166',a)}
 recycle(u,rk);
 if(u>=22.2&&u<27.4){const a=Math.min(ease((u-22.2)/.3),ease((27.4-u)/.3));const v=Math.round(98*ease((u-22.2)/0.8));txt(v+'%',700,960,170,'#8fd3ff',a)}
 chips(u);cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
