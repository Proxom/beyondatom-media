<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- moon-vs-australia (series "How Big Is It?"): is the Moon bigger than Australia?
     Moon: NASA NSSDC Moon fact sheet, mean radius 1737.4 km -> 3474.8 km across; whole surface 4*pi*r^2 = 37.93 million km2.
     Australia: Geoscience Australia, "almost 4000 km wide from east to west"; area 7,688,287 km2. Africa: Britannica, about 30,365,000 km2.
     Sum Africa + Australia = 38.05 million km2 (Moon 37.93: 0.3 % apart).
     Maps: Natural Earth 1:110m admin-0 (public domain), Lambert azimuthal equal-area projections (Australia centred 134E 25.5S, Africa 17E 2N).
     Scene 1: Moon disk and Australia at one scale (0.215 px per km). Scene 2: the Moon's surface laid flat as a cylindrical equal-area map
     (width 2*pi*r, height 2r, so its area is exact; the texture is only illustrative), Africa and Australia at the same scale (0.072 px per km).
     Moon image: NASA Goddard Scientific Visualization Studio, "Full Moon" (LRO/LOLA), GSFC_20171208_Archive_e001861. -->
<script src="moon-vs-australia.geo.js"></script>
<script>
const W=1080,H=1920,FPS=30,D=29.5,LOOP=29.2;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(5);const STARS=[];for(let i=0;i<260;i++)STARS.push([R()*W,R()*H,R()*1.5+.3,R()]);
const MOON=new Image();MOON.src='pl/moon-full.jpg';const MR=1737.4; // km
const P1=0.215,C1=[540,1020],P2=0.072;
const AUX=GEO.au.flat(),AUMIN=Math.min(...AUX.map(p=>p[0])),AUMAX=Math.max(...AUX.map(p=>p[0]));
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function land(rings,cx,cy,sc,fill,stroke,al){x.save();x.globalAlpha=al;x.beginPath();for(const r of rings){r.forEach((p,i)=>{const X=cx+p[0]*sc,Y=cy+p[1]*sc;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath()}
 x.fillStyle=fill;x.fill('evenodd');if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}x.restore()}
function moonDisk(cx,cy,r,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.beginPath();x.arc(cx,cy,r,0,7);x.clip();const k=r/225*240;x.drawImage(MOON,cx-k,cy-k,2*k,2*k);x.restore();
 x.save();x.globalAlpha=al*0.6;x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.restore()}
function bar(x0,x1,y,col,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.strokeStyle=col;x.lineWidth=7;x.lineCap='round';x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=10;
 x.beginPath();x.moveTo(x0,y);x.lineTo(x1,y);x.moveTo(x0,y-22);x.lineTo(x0,y+22);x.moveTo(x1,y-22);x.lineTo(x1,y+22);x.stroke();x.restore()}
const CARDS=[[-1,3.6,'IS THE MOON BIGGER','THAN AUSTRALIA?'],[3.6,17.1,'SAME SCALE:','MOON vs AUSTRALIA'],[17.1,21.2,'BUT PEEL THE WHOLE MOON','AND LAY IT FLAT...'],
 [21.2,24.8,'SAME AS AFRICA + AUSTRALIA','ABOUT 38 MILLION SQ KM'],[24.8,27.2,'BY AREA:','NEARLY 5 AUSTRALIAS!'],[27.2,28.5,'DID YOU','GUESS RIGHT?'],[28.5,29.2,'FOLLOW →','MORE EVERY DAY'],[29.2,D+1,'IS THE MOON BIGGER','THAN AUSTRALIA?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,76,840),fit(l2,76,840));const g=x.createLinearGradient(0,320,0,580);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.5*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,260);
 txt(l1,495,410,sz,'#fff',al);txt(l2,495,410+sz*1.08,sz,'#ffd166',al)}}
function scene1(t,fade){// ocean + Australia + Moon at one scale
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06243f');g.addColorStop(1,'#0a3a5e');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.globalAlpha=0.08;for(let i=0;i<14;i++){x.fillStyle='#9fd4ff';x.fillRect(0,(i*150+t*12)%H,W,2)}x.globalAlpha=1;
 const lg=x.createLinearGradient(0,600,0,1450);lg.addColorStop(0,'#5f8f3e');lg.addColorStop(.45,'#c98a4b');lg.addColorStop(1,'#a8743c');land(GEO.au,C1[0],C1[1],P1,lg,'#f3e0b8',1);
 const my=lerp(-420,C1[1],ease((t+1.2)/4.4)),r=MR*P1;moonDisk(C1[0],my,r,0.9);
 const a1=ease((t-4.0)/.3);bar(C1[0]-r,C1[0]+r,C1[1]-r-40,'#ffd166',a1);txt('MOON: 3,475 km',540,C1[1]-r-62,60,'#ffd166',a1,'Anton');
 const a2=ease((t-8.0)/.3),ax0=C1[0]+AUMIN*P1,ax1=C1[0]+AUMAX*P1;bar(ax0,ax1,C1[1],'#ffffff',a2);txt('AUSTRALIA: ALMOST 4,000 km WIDE',540,C1[1]+80,50,'#ffffff',a2,'Anton');
 const a3=ease((t-11.0)/.3),ny0=C1[1]-1616.3*P1,ny1=C1[1]+1569.3*P1;x.save();x.globalAlpha=a3;x.strokeStyle='#7fe8ff';x.lineWidth=7;x.lineCap='round';x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=10;x.beginPath();x.moveTo(905,ny0);x.lineTo(905,ny1);x.moveTo(883,ny0);x.lineTo(927,ny0);x.moveTo(883,ny1);x.lineTo(927,ny1);x.stroke();x.restore();
 txt('TOP TO BOTTOM: ABOUT 3,180 km',495,1432,46,'#7fe8ff',a3,'Anton');
 if(t>=14.3){const k=t-14.3;txt('WIDER, NOT TALLER!',495,1270,92*(1+.15*Math.exp(-k/.15)),'#7CFFB2',ease(k/.2),'Anton')}
 if(fade>0){x.fillStyle='rgba(2,4,10,'+fade+')';x.fillRect(0,0,W,H)}}
function scene2(t){x.fillStyle='#02040a';x.fillRect(0,0,W,H);for(const s of STARS){x.globalAlpha=.25+.5*s[3];x.fillStyle='#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}x.globalAlpha=1;
 const k1=ease((t-17.1)/1.2),r=lerp(MR*P1,MR*P2,k1),cy=lerp(C1[1],700,k1);
 const kp=ease((t-18.3)/2.2),fw=2*Math.PI*MR*P2,fh=2*MR*P2;
 if(kp<=0)moonDisk(540,cy,r,1);
 else{const w=lerp(2*r,fw,kp),h=fh,rr=lerp(r,0,kp);x.save();x.beginPath();x.roundRect(540-w/2,cy-h/2,w,h,rr);x.clip();
  x.drawImage(MOON,330,330,1260,1260,540-w/2,cy-h/2,w,h);x.restore();
  x.save();x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=3;x.beginPath();x.roundRect(540-w/2,cy-h/2,w,h,rr);x.stroke();x.restore();
  txt('THE MOON\'S WHOLE SURFACE',540,cy-h/2-24,42,'#e8eefc',ease((t-19.4)/.4),'Anton');txt('(ILLUSTRATIVE PICTURE, TRUE AREA)',540,cy+h/2-14,26,'#e8eefc',ease((t-19.8)/.4),'Anton');txt('37.9 MILLION SQ KM',540,cy+h/2+58,52,'#ffd166',ease((t-20.2)/.4),'Anton')}
 const ka=ease((t-21.2)/.5),kb=ease((t-22.4)/.5);
 land(GEO.af,330,1150,P2,'#c98a4b',null,ka);land(GEO.au,820,1160,P2,'#c98a4b',null,kb);
 txt('AFRICA',330,1150,56,'#fff',ka,'Anton');txt('30.4 MILLION',330,1206,40,'#ffd166',ka,'Anton');
 txt('AUSTRALIA',820,1150,40,'#fff',kb,'Anton');txt('7.7 MILLION',820,1196,34,'#ffd166',kb,'Anton');
 txt('+',600,1170,90,'#fff',kb,'Anton')}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 if(u<17.1)scene1(u,0);else if(u<17.7){scene2(u);x.save();x.globalAlpha=1-(u-17.1)/0.6;scene1(u,0);x.restore()}else scene2(u);
 cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont'),new Promise(r=>{if(MOON.complete)r();else MOON.onload=r})]).then(()=>{window.TEXREADY=true});
</script>
