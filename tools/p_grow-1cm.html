<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- grow-1cm (1M+ list #7, style C): "What if you grew 1 cm every second?" One continuous pull-out: the person keeps the same size on
     screen while the world shrinks around them. Start 1.70 m, +1 cm per second, 1 year = 365.25 days.
     Height h(T) = 1.70 + 0.01*T (T = seconds of growing). Milestones: 1 min 2.30 m; 1 h 37.7 m; 1 day 865.7 m (Burj Khalifa 828 m, CTBUH,
     passed after ~23 h); Everest 8,848.86 m after 884,716 s = 10.2 days; ISS orbit ~400 km (NASA: about 250 miles) after ~1.27 years
     (~15 months); 80 years 25,246 km = 1.98 x Earth's equatorial diameter 12,756 km (NSSDC). Landmarks are lined up beside the person
     for comparison (not their real places). Buildings, mountains and the person are drawn to scale with each other; the Earth photo is
     NASA AS17-148-22727 (public domain), drawn to the same scale. -->
<script>
const W=1080,H=1920,D=32.5,PX=330,CXT=695;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ss=(a,b,v)=>{const t=cl((v-a)/(b-a));return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const cv=document.getElementById('c'),x=cv.getContext('2d');
const EARTH=new Image();EARTH.src='g1-earth.jpg';
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('40px Mont'),new Promise(r=>{EARTH.onload=r})]).then(()=>{window.TEXREADY=true});
const R=6378137; // equatorial radius, m (NSSDC)
// ---------- growth clock: u = log10(T+1) through keyframes (monotone cubic) ----------
const K=[[0,0],[2.8,1.0414],[4.0,1.7853],[7.0,3.5564],[10.0,4.9365],[12.6,5.08],[16.0,5.55],[17.3,5.9468],[19.0,6.3],[20.3,7.6042],[23.4,7.70],
 [26.4,9.4022],[D,9.4022]];
const MS=(()=>{const n=K.length,d=[],m=[];for(let i=0;i<n-1;i++)d.push((K[i+1][1]-K[i][1])/(K[i+1][0]-K[i][0]));
 m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=(d[i-1]*d[i]<=0)?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]==0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const tt=3/Math.sqrt(s);m[i]=tt*a*d[i];m[i+1]=tt*b*d[i]}}return m})();
function U(t){t=cl(t,0,D);let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const [t0,z0]=K[i],[t1,z1]=K[i+1],h=t1-t0,s=(t-t0)/h;
 const h00=2*s*s*s-3*s*s+1,h10=s*s*s-2*s*s+s,h01=-2*s*s*s+3*s*s,h11=s*s*s-s*s;return h00*z0+h10*h*MS[i]+h01*z1+h11*h*MS[i+1]}
const TS=t=>Math.pow(10,U(t))-1, HT=T=>1.70+0.01*T;
// ---------- framing: person height in px and feet y (moves up at the end so the Earth ball sits above the bottom zone) ----------
function frame(t){const k=ss(23.4,26.4,t);return {hp:lerp(1010,700,k),fy:lerp(1480,1062,k)}}
// ---------- precomputed scenery (metres; x = metres to the right of the feet, y up) ----------
const r0=rnd(7);
const STARS=[];for(let i=0;i<900;i++)STARS.push([r0()*W,r0()*H,Math.pow(r0(),4)*2.4+.3,r0()*6.28,r0()]);
const BLD=[];{const r=rnd(21);let xx=9;while(xx<230){const w=12+r()*16,h=22+r()*30;BLD.push({x:xx,w,h,c:r(),seed:Math.floor(r()*1e6)});xx+=w+3+r()*6}
 xx=-9;while(xx>-200){const w=12+r()*16,h=20+r()*28;xx-=w+3+r()*6;BLD.push({x:xx,w,h,c:r(),seed:Math.floor(r()*1e6)})}}
const TOW=[];{const r=rnd(33);const xs=[150,240,300,380,560,640,720,830,980,-260,-360,-480,-600];for(const x0 of xs){TOW.push({x:x0+r()*30,w:30+r()*40,h:120+r()*260,c:r()})}}
const TREES=[];{const r=rnd(5);for(const x0 of [-2.6,-5.2,7.4,-12,13]){TREES.push({x:x0,h:5+r()*3,w:3+r()*1.5})}}
function ridge(seed,x0,x1,peakX,peakH,base,rough){const r=rnd(seed),P=[];const n=160;for(let i=0;i<=n;i++){const xx=lerp(x0,x1,i/n);
 const d=Math.abs(xx-peakX)/(x1-x0);let y=base+(peakH-base)*Math.pow(Math.max(0,1-d*2.3),1.35);P.push([xx,y])}
 for(let o=0;o<5;o++){const amp=rough*Math.pow(.55,o),f=4+o*7,ph=r()*6.28;for(const p of P){p[1]+=amp*Math.sin(p[0]/(x1-x0)*f*6.28+ph)*(1-Math.min(1,Math.abs(p[0]-peakX)/((x1-x0)*.06+1)*.0))}}
 for(const p of P){if(Math.abs(p[0]-peakX)<1)p[1]=peakH;const L=(x1-x0)*.18;p[1]*=ss(x0,x0+L,p[0])*ss(x1,x1-L,p[0])}return P}
const EVR=ridge(11,800,13000,4300,8849,300,380); for(const p of EVR){if(Math.abs(p[0]-4300)>100)p[1]=Math.min(p[1],8849-Math.abs(p[0]-4300)*.42)}
const EVR2=ridge(12,-14000,30000,9000,7000,200,500);
const CLOUD=[];{const r=rnd(44);for(let i=0;i<150;i++){const xx=(r()-.35)*120000,y=1400+r()*1500,w=600+r()*2600;CLOUD.push({x:xx,y,w,h:w*(.28+r()*.2),a:.5+r()*.4})}}
const SURF=[];{const r=rnd(55);for(let i=0;i<220;i++){SURF.push({a:(r()-.5)*1.6,w:60e3+r()*500e3,h:.25+r()*.35,al:.25+r()*.45,land:r()<.25})}}
// ---------- text helpers ----------
function T(s,X,Y,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';
 x.lineJoin='round';x.shadowColor='rgba(0,0,0,.75)';x.shadowBlur=size*.22;x.shadowOffsetY=size*.05;x.fillStyle=col||'#fff';x.fillText(s,X,Y);x.restore()}
const fmtH=h=>h<10?h.toFixed(2)+' m':h<10000?Math.floor(h).toLocaleString('en-US')+' m':Math.floor(h/1000).toLocaleString('en-US')+' km';
function fmtT(T){const pl=(n,w)=>n+' '+w+(n==1?'':'S');
 if(T<60)return pl(Math.floor(T),'SECOND');if(T<3600)return pl(Math.floor(T/60),'MINUTE');if(T<86400)return pl(Math.floor(T/3600),'HOUR');
 if(T<86400*120)return pl(Math.floor(T/86400),'DAY');if(T<31557600*2)return pl(Math.floor(T/2629800),'MONTH');return pl(Math.floor(T/31557600),'YEAR')}
// ---------- person (normalised: height 1, feet at 0, y up) ----------
function person(g,X,Y,hp,t,space){
 const S=hp;const P=(a,b)=>[X+a*S,Y-b*S];g.save();
 const sway=Math.sin(t*1.3)*.006, look=ss(3,6,t)*.012+.006*Math.sin(t*.7), br=1+.006*Math.sin(t*2.2);
 const bl=((t%3.1)<.12||(t%7.3)>7.15)?.15:1; g.translate(X,Y);g.scale(1,br);g.translate(-X,-Y);
 function poly(pts,fill){g.beginPath();pts.forEach((p,i)=>{const q=P(p[0],p[1]);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.closePath();g.fillStyle=fill;g.fill()}
 function lg(c0,c1){const gr=g.createLinearGradient(X-.17*S,0,X+.17*S,0);gr.addColorStop(0,c0);gr.addColorStop(1,c1);return gr}
 const jeans=lg('#1b2d4d','#4a74b0'),shirt=lg('#9c3d10','#ff8a3c'),skin=lg('#8c5a3e','#e9b48e'),shoe='#151515';
 // shadow on the ground
 g.fillStyle='rgba(0,0,0,'+(space?0:.35)+')';g.beginPath();g.ellipse(X+.06*S,Y+.004*S,.2*S,.016*S,0,0,6.283);g.fill();
 // legs
 poly([[-.085,.52],[-.012,.52],[-.02,.03],[-.075,.03]],jeans);poly([[.012,.52],[.085,.52],[.075,.03],[.02,.03]],jeans);
 poly([[-.09,.53],[.09,.53],[.088,.46],[-.088,.46]],jeans);
 g.fillStyle=shoe;g.beginPath();g.ellipse(X-.052*S,Y-.016*S,.045*S,.018*S,0,0,6.283);g.fill();g.beginPath();g.ellipse(X+.052*S,Y-.016*S,.045*S,.018*S,0,0,6.283);g.fill();
 // arms (behind sleeves): forearms skin
 const aL=-.004+sway, aR=.004-sway;
 poly([[-.155,.70],[-.118,.70],[-.135+aL*8,.45],[-.168+aL*8,.46]],skin);poly([[.118,.70],[.155,.70],[.168+aR*8,.46],[.135+aR*8,.45]],skin);
 g.fillStyle=skin;g.beginPath();g.ellipse(X+(-.152+aL*8)*S,Y-.44*S,.022*S,.03*S,0,0,6.283);g.fill();g.beginPath();g.ellipse(X+(.152+aR*8)*S,Y-.44*S,.022*S,.03*S,0,0,6.283);g.fill();
 // torso + sleeves
 poly([[-.13,.80],[-.06,.835],[.06,.835],[.13,.80],[.168,.70],[.115,.675],[.098,.71],[.092,.50],[-.092,.50],[-.098,.71],[-.115,.675],[-.168,.70]],shirt);
 // neck + head
 poly([[-.022,.86],[.022,.86],[.024,.82],[-.024,.82]],skin);
 g.save();g.translate(X+look*S*.2,Y-.925*S);g.rotate(look*1.5);
 g.fillStyle=skin;g.beginPath();g.ellipse(0,0,.05*S,.064*S,0,0,6.283);g.fill();
 g.fillStyle='#2a1a12';g.beginPath();g.ellipse(0,-.024*S,.053*S,.045*S,0,Math.PI*1.02,Math.PI*1.98);g.fill();
 g.beginPath();g.ellipse(0,-.03*S,.052*S,.03*S,0,Math.PI,0);g.fill();
 g.fillStyle='#1a120d';const ey=.004*S+look*S*.6,ex=look*S*.5;g.beginPath();g.ellipse(-.018*S+ex,ey,.0055*S,.0075*S*bl,0,0,6.283);g.fill();g.beginPath();g.ellipse(.018*S+ex,ey,.0055*S,.0075*S*bl,0,0,6.283);g.fill();
 g.strokeStyle='rgba(90,40,30,.8)';g.lineWidth=.004*S;g.beginPath();g.arc(0,.03*S,.012*S,.3,2.84);g.stroke();
 g.restore();
 // rim light from the right (sun)
 g.globalCompositeOperation='source-atop';
 g.restore();
}
// ---------- scene ----------
function draw(t){
 const Tn=TS(t),h=HT(Tn),{hp,fy}=frame(t),s=hp/h;           // s = px per metre
 const X=m=>PX+m*s, Y=m=>fy-m*s;
 const alt=ss(3.3,5.1,Math.log10(h));                        // 0 = blue day sky, 1 = space
 const RS=R*s;                                               // Earth radius in px
 // sky
 const g0=x.createLinearGradient(0,0,0,fy);
 g0.addColorStop(0,`rgb(${lerp(46,1,alt)|0},${lerp(104,2,alt)|0},${lerp(178,8,alt)|0})`);
 g0.addColorStop(1,`rgb(${lerp(196,8,alt)|0},${lerp(222,18,alt)|0},${lerp(240,46,alt)|0})`);
 x.fillStyle=g0;x.fillRect(0,0,W,H);
 // stars + faint Milky Way band
 const sa=ss(.55,1,alt);
 if(sa>0){x.save();const mw=x.createLinearGradient(0,H*.15,W,H*.75);mw.addColorStop(0,'rgba(0,0,0,0)');mw.addColorStop(.5,`rgba(70,80,130,${.16*sa})`);mw.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=mw;x.fillRect(0,0,W,H);
  for(const st of STARS){const tw=.75+.25*Math.sin(t*2+st[3]);x.globalAlpha=sa*tw*(.4+.6*st[4]);x.fillStyle=st[4]>.9?'#ffe9c4':'#dfe8ff';x.beginPath();x.arc(st[0],st[1],st[2],0,6.283);x.fill()}x.restore();
  // sunlight glow from the right edge
  const sg=x.createRadialGradient(W+120,520,10,W+120,520,700);sg.addColorStop(0,`rgba(255,236,200,${.55*sa})`);sg.addColorStop(.25,`rgba(255,200,140,${.18*sa})`);sg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sg;x.fillRect(0,0,W,H);}
 // ----- Earth / ground -----
 if(RS>1e6){ // flat ground
  const gg=x.createLinearGradient(0,fy,0,H);const k=ss(1.5,3.5,Math.log10(h));
  gg.addColorStop(0,k<.5?'#6d7a5a':'#4f6a3c');gg.addColorStop(1,'#1c2414');
  x.fillStyle=gg;x.fillRect(0,fy,W,H-fy);
  // sidewalk + street when near
  if(h<60){x.fillStyle='rgba(150,150,145,'+(1-ss(10,60,h))+')';x.fillRect(0,fy,W,Math.max(2,.12*s));x.fillStyle='rgba(60,62,66,'+(1-ss(10,60,h))+')';x.fillRect(0,fy+.12*s,W,Math.max(2,5*s))}
 }else{
  const cx=PX,cy=fy+RS;
  // atmosphere glow
  const ag=x.createRadialGradient(cx,cy,RS*.995,cx,cy,RS*(1+ 90e3/R)+30);ag.addColorStop(0,'rgba(120,180,255,.9)');ag.addColorStop(.35,'rgba(70,140,255,.35)');ag.addColorStop(1,'rgba(40,90,255,0)');
  x.fillStyle=ag;x.beginPath();x.arc(cx,cy,RS*(1+90e3/R)+30,0,6.283);x.fill();
  // surface: procedural first, NASA Apollo 17 photo when the ball becomes visible
  const ph=1-ss(25000,80000,RS),lh=Math.log10(h),oc=ss(4.0,5.0,lh);
  x.save();x.beginPath();x.arc(cx,cy,RS,0,6.283);x.clip();
  if(ph<1){const sg=x.createLinearGradient(0,fy,0,Math.min(H,cy));sg.addColorStop(0,`rgb(${lerp(92,63,oc)|0},${lerp(112,127,oc)|0},${lerp(70,191,oc)|0})`);sg.addColorStop(1,`rgb(${lerp(36,18,oc)|0},${lerp(48,58,oc)|0},${lerp(30,107,oc)|0})`);x.fillStyle=sg;x.fillRect(0,0,W,H);
   for(const c of SURF){const an=-Math.PI/2+c.a*Math.min(1,2.4e6/ (h+1e5));const px=cx+Math.cos(an)*RS,py=cy+Math.sin(an)*RS;const w=c.w*s;if(w<2||w>900||py>H+w)continue;
    x.globalAlpha=c.al*(1-ph)*ss(4.3,5.0,lh);x.fillStyle=c.land?'#6f7a4a':'#f2f5fa';x.beginPath();x.ellipse(px,py+w*c.h*.6,w,w*c.h,an+Math.PI/2,0,6.283);x.fill()}
   x.globalAlpha=1}
  if(ph>0){x.globalAlpha=ph;const ir=642,icx=965,icy=977;const k=RS/ir;x.drawImage(EARTH,cx-icx*k,cy-icy*k,1920*k,1920*k);x.globalAlpha=1}
  // night-side shading (sun from the right)
  const sh=x.createLinearGradient(cx-RS,0,cx+RS,0);sh.addColorStop(0,'rgba(0,0,10,.55)');sh.addColorStop(.5,'rgba(0,0,10,0)');sh.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=sh;x.fillRect(0,0,W,H);
  x.restore();
  // ISS orbit ring (~400 km)
  const io=ss(19.4,20.3,t)*(1-ss(23.4,24.2,t));
  if(io>0){x.save();x.globalAlpha=io*.85;x.strokeStyle='#ffd98a';x.lineWidth=3;x.setLineDash([14,12]);x.beginPath();x.arc(cx,cy,(R+400e3)*s,0,6.283);x.stroke();x.setLineDash([]);
   const an=-Math.PI/2+.32-(t-19)*.05;const ix=cx+Math.cos(an)*(R+400e3)*s,iy=cy+Math.sin(an)*(R+400e3)*s;const gl=x.createRadialGradient(ix,iy,0,ix,iy,26);gl.addColorStop(0,'rgba(255,255,255,1)');gl.addColorStop(.3,'rgba(255,230,170,.7)');gl.addColorStop(1,'rgba(255,200,120,0)');
   x.fillStyle=gl;x.beginPath();x.arc(ix,iy,26,0,6.283);x.fill();x.restore();
   window.__iss=[ix,iy]}
 }
 const gY=m=>{ if(RS>1e6)return fy; const c=Math.min(1,m/R); return fy+RS-Math.sqrt(Math.max(0,RS*RS-(m*s)*(m*s)))}; // ground screen y under x=m
 // ----- distant mountain range (bluish), Everest -----
 if(s*8849>6&&s*8849<9000){const haze=alt;x.save();x.globalAlpha=ss(6,60,s*8849);
  for(const [Rg,col] of [[EVR2,`rgba(${lerp(120,40,haze)|0},${lerp(140,60,haze)|0},${lerp(170,95,haze)|0},.85)`],[EVR,null]]){
   x.beginPath();x.moveTo(X(Rg[0][0]),gY(Rg[0][0])+2);for(const p of Rg)x.lineTo(X(p[0]),gY(p[0])-p[1]*s);x.lineTo(X(Rg[Rg.length-1][0]),gY(Rg[Rg.length-1][0])+2);x.closePath();
   if(col){x.fillStyle=col;x.fill()}else{const mg=x.createLinearGradient(0,Y(8849),0,fy);mg.addColorStop(0,'#5b6474');mg.addColorStop(1,'#2c3328');x.fillStyle=mg;x.fill();
    x.save();x.clip();x.fillStyle='rgba(245,248,255,.95)';x.beginPath();x.moveTo(X(Rg[0][0]),Y(5600));for(const p of Rg)x.lineTo(X(p[0]),gY(p[0])-Math.max(p[1]*s,(5600+250*Math.sin(p[0]/700))*s));x.lineTo(X(Rg[Rg.length-1][0]),Y(5600));x.closePath();
    x.fillStyle='rgba(240,245,252,.95)';x.fillRect(0,0,W,Y(5400+0));x.restore();
    // light side
    x.save();x.clip();const lg2=x.createLinearGradient(X(4300)-40,0,X(4300)+200,0);lg2.addColorStop(0,'rgba(0,0,20,.25)');lg2.addColorStop(.2,'rgba(255,240,220,.0)');x.fillStyle=lg2;x.fillRect(0,0,W,H);x.restore()}}x.restore()}
 // ----- clouds -----
 if(s*1000>2){for(const c of CLOUD){const w=c.w*s;if(w<8)continue;const cx2=X(c.x),cy2=gY(c.x)-c.y*s;if(cx2<-w||cx2>W+w)continue;
   const a=c.a*(1-ss(.002,.0006,s))*.9;const cg=x.createRadialGradient(cx2,cy2,0,cx2,cy2,w);cg.addColorStop(0,`rgba(255,255,255,${a})`);cg.addColorStop(.6,`rgba(240,244,250,${a*.6})`);cg.addColorStop(1,'rgba(255,255,255,0)');
   x.save();x.translate(cx2,cy2);x.scale(1,c.h/c.w);x.translate(-cx2,-cy2);x.fillStyle=cg;x.beginPath();x.arc(cx2,cy2,w,0,6.283);x.fill();x.restore()}}
 // ----- city: towers + Burj Khalifa (828 m) -----
 if(s*828>4&&s*828<12000){x.save();x.globalAlpha=ss(4,40,s*828);
  for(const tw of TOW){const ww=tw.w*s,hh=tw.h*s;if(hh<2)continue;const g2=x.createLinearGradient(X(tw.x),0,X(tw.x)+ww,0);g2.addColorStop(0,'#3a4658');g2.addColorStop(1,'#8796ad');x.fillStyle=g2;x.fillRect(X(tw.x),fy-hh,ww,hh)}
  // Burj profile: half-widths (m) at heights (m)
  const bx=450,BP=[[0,85],[160,70],[160,58],[320,50],[320,40],[460,34],[460,26],[585,20],[585,13],[640,10],[640,6],[828,0]];
  x.beginPath();x.moveTo(X(bx-BP[0][1]),Y(0));for(const p of BP)x.lineTo(X(bx-p[1]),Y(p[0]));for(let i=BP.length-1;i>=0;i--)x.lineTo(X(bx+BP[i][1]),Y(BP[i][0]));x.closePath();
  const bg=x.createLinearGradient(X(bx-85),0,X(bx+85),0);bg.addColorStop(0,'#55657c');bg.addColorStop(.55,'#c9d6e6');bg.addColorStop(1,'#7d8ca3');x.fillStyle=bg;x.fill();
  window.__burj=[X(bx),Y(828)];x.restore()}
 // ----- near buildings -----
 if(s*40>3&&s*40<20000){x.save();x.globalAlpha=ss(3,25,s*40);for(const b of BLD){const ww=b.w*s,hh=b.h*s;if(X(b.x)>W||X(b.x)+ww<0)continue;
   const g3=x.createLinearGradient(X(b.x),0,X(b.x)+ww,0);const c=b.c;g3.addColorStop(0,`rgb(${70+c*30|0},${74+c*24|0},${84+c*20|0})`);g3.addColorStop(1,`rgb(${150+c*40|0},${148+c*30|0},${150+c*24|0})`);
   x.fillStyle=g3;x.fillRect(X(b.x),fy-hh,ww,hh);
   if(s>2){const r=rnd(b.seed);x.fillStyle='rgba(255,226,160,.75)';const fl=Math.floor(b.h/3.2),cols=Math.floor(b.w/3);for(let i=0;i<fl;i++)for(let j=0;j<cols;j++){if(r()<.45)continue;
     x.fillStyle=r()<.5?'rgba(255,226,160,.7)':'rgba(40,52,70,.85)';x.fillRect(X(b.x+1+j*3),Y(1.2+i*3.2+1.4),1.4*s,1.4*s)}}}x.restore()}
