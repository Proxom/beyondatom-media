<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- hair-in-space (series "Life in Space"): how astronauts wash their hair in orbit.
     NASA Science, APOD 20 Dec 2017 "How to Wash Your Hair in Space" (Karen Nyberg, ISS 2013): a squirt package of water, no-rinse shampoo, vigorous use of a towel
       and comb; the leftover water evaporates, is captured by the station's air conditioning system and is purified into drinking water.
     NASA image iss072e742508: loose water forms a ball held together and stuck to surfaces by surface tension.
     Drawing: the astronaut, hair, pouch, vent and pipe are simplified illustrations. -->
<script>
const W=1080,H=1920,FPS=30,D=30.2,LOOP=30.0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(77);const HAIR=[];for(let i=0;i<170;i++)HAIR.push([R(),R(),R(),R(),R()]);
const FOAM=[];for(let i=0;i<46;i++)FOAM.push([R(),R(),R()]);const MIST=[];for(let i=0;i<70;i++)MIST.push([R(),R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function module(t){let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#6f7782');g.addColorStop(.5,'#b3bac3');g.addColorStop(1,'#69717c');x.fillStyle=g;x.fillRect(0,0,W,H);
 const off=(t*8)%160;x.strokeStyle='rgba(60,66,76,.5)';x.lineWidth=4;
 for(let y=-160;y<H+160;y+=160){x.strokeRect(20,y+off,200,140);x.strokeRect(860,y+off+40,200,140)}
 x.fillStyle='rgba(40,46,56,.35)';for(let y=-160;y<H+160;y+=160){x.fillRect(45,y+off+50,150,14);x.fillRect(885,y+off+90,150,14)}
 x.save();x.globalAlpha=.55;x.fillStyle='#000';x.fillRect(0,0,W,H);x.restore()}
// head centre = origin, head radius 150. wet 0..1 (hair clings), foam 0..1, eyesClosed 0..1
function hair(t,wet,front){x.lineCap='round';
 for(let i=0;i<HAIR.length;i++){const h=HAIR[i];if((h[4]<0.5)!==front)continue;
  const a0=lerp(-Math.PI*1.02,0.02,h[0]);// scalp angle (top half + a bit)
  const sx=Math.cos(a0)*140,sy=Math.sin(a0)*140-10;
  const len=lerp(lerp(330,470,h[1]),lerp(240,320,h[1]),wet);
  // dry: strands float outward and curl slowly; wet: they lie flat along the head and clump
  const out=a0+Math.sin(t*0.7+h[2]*6)*0.25*(1-wet);const tang=a0+(a0<-Math.PI/2?-1:1)*Math.PI/2*0.9;
  // wet hair still floats (no gravity) but sticks together in clumps
  const ca=-Math.PI*1.02+Math.round(h[0]*10)/10*Math.PI*1.04+Math.sin(t*0.6+Math.round(h[0]*10))*0.12;
  const dirA=lerp(out,ca,wet*0.85);const c1=dirA+Math.sin(t*0.9+h[3]*7)*lerp(0.5,0.12,wet),c2=c1+Math.sin(t*0.5+h[2]*9)*lerp(0.6,0.15,wet);
  const p1x=sx+Math.cos(dirA)*len*0.35,p1y=sy+Math.sin(dirA)*len*0.35,p2x=p1x+Math.cos(c1)*len*0.35,p2y=p1y+Math.sin(c1)*len*0.35,p3x=p2x+Math.cos(c2)*len*0.3,p3y=p2y+Math.sin(c2)*len*0.3;
  const col=wet>0.02?'rgb('+Math.round(lerp(222,150,wet))+','+Math.round(lerp(182,112,wet))+','+Math.round(lerp(104,58,wet))+')':'rgb(222,182,104)';
  x.strokeStyle=col;x.lineWidth=lerp(7,9,wet)+h[3]*3;x.globalAlpha=front?0.95:0.8;x.beginPath();x.moveTo(sx,sy);x.bezierCurveTo(p1x,p1y,p2x,p2y,p3x,p3y);x.stroke();
  if(h[1]>0.7){x.strokeStyle='rgba(255,236,180,'+(0.35*(1-wet*0.6))+')';x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.bezierCurveTo(p1x,p1y,p2x,p2y,p3x,p3y);x.stroke()}}
 x.globalAlpha=1}
function person(t,wet,foam,eyes,smile){
 // shoulders + polo (bottom)
 x.fillStyle='#1e2f57';x.beginPath();x.moveTo(-330,520);x.quadraticCurveTo(-300,240,-90,200);x.lineTo(90,200);x.quadraticCurveTo(300,240,330,520);x.closePath();x.fill();
 x.fillStyle='#e8c33a';x.fillRect(-200,330,70,14);x.fillStyle='#e8b896';x.fillRect(-55,120,110,100);
 hair(t,wet,false);
 // head
 x.fillStyle='#efc3a0';x.beginPath();x.ellipse(0,0,140,165,0,0,7);x.fill();
 // hair over the top of the head
 x.fillStyle='rgb('+Math.round(lerp(212,140,wet))+','+Math.round(lerp(170,104,wet))+','+Math.round(lerp(96,54,wet))+')';x.beginPath();x.ellipse(0,-30,150,142,0,Math.PI*1.02,Math.PI*1.98);x.quadraticCurveTo(60,-95,0,-88);x.quadraticCurveTo(-70,-95,-150,-35);x.fill();
 x.fillStyle='#e8b896';x.beginPath();x.ellipse(-140,20,22,38,0,0,7);x.fill();x.beginPath();x.ellipse(140,20,22,38,0,0,7);x.fill();
 // eyes
 x.fillStyle='#2b1d14';x.strokeStyle='#2b1d14';x.lineWidth=6;
 for(const sx of [-52,52]){if(eyes>0.5){x.beginPath();x.arc(sx,10,16,0.2,Math.PI-0.2);x.stroke()}else{x.beginPath();x.ellipse(sx,8,13,15,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(sx+4,3,4,0,7);x.fill();x.fillStyle='#2b1d14'}}
 x.strokeStyle='#8a5a45';x.lineWidth=7;x.beginPath();if(smile>0.5)x.arc(0,62,34,0.25,Math.PI-0.25);else x.ellipse(0,78,16,10,0,0,7);x.stroke();
 x.fillStyle='rgba(230,140,120,.35)';x.beginPath();x.arc(-85,55,22,0,7);x.fill();x.beginPath();x.arc(85,55,22,0,7);x.fill();
 hair(t,wet,true);
 // shampoo foam on the hair
 if(foam>0.01){for(let i=0;i<FOAM.length;i++){const f=FOAM[i];if(f[2]>foam)continue;const a=lerp(-Math.PI*0.98,-0.02,f[0]);const r=lerp(150,260,f[1]);
  const px=Math.cos(a)*r+Math.sin(t*2+i)*4,py=Math.sin(a)*r*0.95-20;x.fillStyle='rgba(255,255,255,.92)';x.beginPath();x.arc(px,py,lerp(18,34,f[1]),0,7);x.fill();
  x.strokeStyle='rgba(190,215,240,.8)';x.lineWidth=3;x.stroke()}}}
function blob(px,py,r,t,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.translate(px,py);const g=x.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);g.addColorStop(0,'rgba(235,248,255,.95)');g.addColorStop(.6,'rgba(120,190,245,.75)');g.addColorStop(1,'rgba(70,140,220,.55)');
 x.fillStyle=g;x.beginPath();for(let k=0;k<=40;k++){const a=k/40*Math.PI*2;const rr=r*(1+0.06*Math.sin(a*3+t*5)+0.04*Math.sin(a*2-t*3));const px2=Math.cos(a)*rr,py2=Math.sin(a)*rr;k?x.lineTo(px2,py2):x.moveTo(px2,py2)}x.closePath();x.fill();
 x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.ellipse(-r*0.35,-r*0.38,r*0.22,r*0.13,-0.6,0,7);x.fill();x.restore()}
function pouch(px,py,rot,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.translate(px,py);x.rotate(rot);x.fillStyle='rgba(205,230,250,.95)';x.beginPath();x.roundRect(-70,-120,140,220,26);x.fill();
 x.fillStyle='#4f9be0';x.beginPath();x.roundRect(-58,-20,116,108,18);x.fill();x.fillStyle='#e8c33a';x.fillRect(-14,-175,28,60);x.restore()}
function towel(px,py,rot,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.translate(px,py);x.rotate(rot);x.fillStyle='#2fb3a3';x.beginPath();x.roundRect(-190,-80,380,160,40);x.fill();
 x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=8;for(let k=-150;k<=150;k+=50){x.beginPath();x.moveTo(k,-70);x.lineTo(k,70);x.stroke()}x.restore()}
function comb(px,py,rot,al){if(al<=0.01)return;x.save();x.globalAlpha=al;x.translate(px,py);x.rotate(rot);x.fillStyle='#2d2f36';x.beginPath();x.roundRect(-150,-30,300,50,14);x.fill();
 for(let k=-140;k<=140;k+=20)x.fillRect(k-4,15,9,70);x.restore()}
function vent(px,py,t,al,on){if(al<=0.01)return;x.save();x.globalAlpha=al;x.translate(px,py);x.fillStyle='#2b3340';x.beginPath();x.roundRect(-150,-90,300,180,24);x.fill();x.strokeStyle='#8fd3ff';x.lineWidth=7;x.stroke();
 x.strokeStyle='#5c6675';x.lineWidth=10;for(let k=-55;k<=55;k+=28){x.beginPath();x.moveTo(-120,k);x.lineTo(120,k);x.stroke()}
 if(on){x.save();x.beginPath();x.rect(-120,-70,240,140);x.clip();x.rotate(t*10);x.fillStyle='rgba(170,180,195,.5)';for(let k=0;k<4;k++){x.rotate(Math.PI/2);x.beginPath();x.ellipse(40,0,42,14,0,0,7);x.fill()}x.restore()}
 x.restore()}
function chips(u){if(u<13.3||u>=21.0)return;const a=Math.min(ease((u-13.3)/.3),ease((21.0-u)/.3));const L=[['A DRAIN',270],['THE TOWEL',540],['THE AIR',810]];
 for(let i=0;i<3;i++){const [s,cx]=L[i];const ai=a*ease((u-13.3-i*0.4)/.25);if(ai<=0.01)continue;const win=i==2&&u>=18.35;const lose=i==0&&u>=18.35;const part=i==1&&u>=18.35;
  x.save();x.globalAlpha=ai*(lose?0.35:part?0.75:1);x.fillStyle=win?'#1f9d55':part?'rgba(31,157,85,.45)':'rgba(20,24,32,.85)';x.beginPath();x.roundRect(cx-120,620,240,96,22);x.fill();x.strokeStyle=win?'#8dffb8':'#ffd166';x.lineWidth=5;x.stroke();x.restore();
  txt(s,cx,688,fit(s,60,210),'#fff',ai*(lose?0.35:part?0.75:1))}}
const CARDS=[[-1,5.0,'HOW DO YOU WASH','HAIR IN SPACE?'],[5.0,8.8,'WATER DOESN\'T FALL.','IT CLINGS TO HAIR'],[8.8,13.0,'NO-RINSE SHAMPOO','+ TOWEL + COMB'],[13.0,18.35,'GUESS: WHERE DOES THE','LEFTOVER WATER END UP?'],
 [18.35,21.0,'THE TOWEL SOAKS SOME.','THE REST EVAPORATES'],[21.0,24.0,'AIR CONDITIONING','CATCHES IT'],[24.0,27.5,'PURIFIED INTO','DRINKING WATER'],[27.5,28.9,'WOULD YOU','DRINK IT?'],[28.9,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'HOW DO YOU WASH','HAIR IN SPACE?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,840),fit(l2,80,840));const g=x.createLinearGradient(0,320,0,600);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.78*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,280);
 txt(l1,495,420,sz,'#fff',al);txt(l2,495,420+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 module(u);
 // wet: water lands 5.6-6.6 and stays until it evaporates (18.2-21); foam 9.0-10.2 then towel/comb remove it
 const wet=u<5.6?0:u<19.9?ease((u-5.6)/1.0)*(u<18.3?1:1-0.25*ease((u-18.3)/0.8)):0.75*(1-ease((u-19.9)/2.6));
 const foam=u>=8.9&&u<12.6?Math.min(ease((u-8.9)/1.2),1-ease((u-11.0)/1.6)):0;
 // camera: big close-up, slow push; recycle part: person moves left/down and shrinks, vent + pipe + pouch on the right
 const rk=u>=20.8&&u<27.6?Math.min(ease((u-20.8)/.8),ease((27.6-u)/.6)):0;
 const zoom=lerp(1.12+0.05*Math.sin(u*0.35)+(u<5?0.02*u:0.1),0.62,rk),cx=lerp(540,330,rk),cy=lerp(1060,1150,rk);
 x.save();x.translate(cx,cy+Math.sin(u*0.8)*10);x.scale(zoom,zoom);x.rotate(Math.sin(u*0.5)*0.04*(1-rk));
 const eyes=(u>=8.9&&u<12.8)?1:0,smile=(u<5||u>=18.35)?1:0;
 person(u,wet,foam,eyes,smile);
 // hook / loop: a loose water ball floats beside the head; 5.0-6.6 the pouch squirts it onto the head
 if(u<5.0||u>=28.9){const al=u<5?1:ease((u-28.9)/.6);blob(260+Math.sin(u*0.9)*30,-260+Math.cos(u*0.7)*25,62,u,al)}
 if(u>=4.8&&u<7.6){const a=Math.min(ease((u-4.8)/.3),ease((7.6-u)/.4));pouch(330,-330,-0.7,a);const k=ease((u-5.1)/0.7);
  if(u<6.4)blob(lerp(250,60,k),lerp(-260,-170,k),lerp(30,90,k),u,1-ease((u-6.0)/.4));}
 if(wet>0.05&&u<20.4){for(let k=0;k<6;k++){const a=-Math.PI*(0.15+k*0.14);blob(Math.cos(a)*175,Math.sin(a)*175-15,22+6*Math.sin(k*2),u+k,wet*0.75)}}
 // towel 10.4-11.8 rubs, comb 11.8-13.0 strokes
 if(u>=10.2&&u<12.0){const a=Math.min(ease((u-10.2)/.25),ease((12.0-u)/.25));towel(Math.sin(u*11)*70,-210+Math.cos(u*11)*15,Math.sin(u*11)*0.15,a)}
 if(u>=11.9&&u<13.2){const a=Math.min(ease((u-11.9)/.2),ease((13.2-u)/.25));const k=((u-11.9)*1.6)%1;comb(lerp(-230,230,k),lerp(-250,-150,Math.sin(k*Math.PI)),0.25,a)}
 x.restore();
 // evaporation: mist rises from the hair; from 20.3 it streams into the vent
 const mist=u>=19.9&&u<26.5?Math.min(ease((u-19.9)/.5),ease((26.5-u)/.6)):0;
 if(mist>0.01){const hx=cx,hy=cy-200*zoom;const vx=760,vy=760;for(const m of MIST){const ph=(m[0]+u*0.35*(0.7+m[2]))%1;
  const sx=hx+(m[1]-0.5)*520*zoom,sy=hy;const tx=lerp(sx+(m[1]-0.5)*200,vx,rk),ty=lerp(hy-520,vy,rk);const px=lerp(sx,tx,ph)+Math.sin(u*2+m[2]*9)*14,py=lerp(sy,ty,ph);
  x.fillStyle='rgba(200,235,255,'+(0.55*mist*Math.sin(ph*Math.PI))+')';x.beginPath();x.arc(px,py,lerp(10,26,m[2]),0,7);x.fill()}}
 if(rk>0.01){vent(760,760,u,rk,true);
  // pipe from the vent down to a drink pouch that fills with drinking water
  x.save();x.globalAlpha=rk;x.strokeStyle='#8fd3ff';x.lineWidth=30;x.lineCap='round';x.beginPath();x.moveTo(760,850);x.lineTo(760,1000);x.stroke();
  const lvl=cl((u-24.0)/2.5);x.fillStyle='rgba(205,230,250,.95)';x.beginPath();x.roundRect(660,1000,200,300,36);x.fill();x.fillStyle='#3d8bd6';x.beginPath();x.roundRect(672,1288-276*lvl,176,276*lvl+0.1,26);x.fill();
  for(let k=0;k<5;k++){const ph=(u*1.4+k/5)%1;if(u<23.8)continue;x.fillStyle='#bfe6ff';x.beginPath();x.arc(760,lerp(850,1000,ph),10,0,7);x.fill()}
  x.fillStyle='#e8c33a';x.fillRect(748,1290,24,50);x.restore()}
 chips(u);cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
