<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- bone-loss-space ("Your Body in Space"): weight-bearing bone (hips, spine) loses about 1-1.5 % of its density per MONTH in orbit,
     vs about 0.5-1 % per YEAR for older people on Earth (NASA Bone Summit, Orwoll et al. 2013; NASA "Human Body in Space").
     Split screen: Earth counts years, orbit counts months, at the same rhythm; the bars drop at the same pace (1 % per tick:
     the top of the Earth range and the bottom of the orbit range, so "a year OR MORE"). Bars run from 100 % down to 90 % (zoomed axis).
     Mechanism (NASA "Counteracting Bone and Muscle Loss"): bone-building cells slow down, bone-removing cells keep their pace.
     Fix: crews exercise about 2 hours a day. Bone lattice, cells and figures are illustrations. -->
<script>
const W=1080,H=1920,FPS=30,D=35.3,LOOP=34.8;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const STARS=[];{const r=rnd(23);for(let k=0;k<300;k++)STARS.push([r()*W,r()*H,r()*1.5+.3,r()])}
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al)*x.globalAlpha;x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=18;x.fillText(s,px,py);x.shadowBlur=5;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
// ticks: Earth years 1..3 during 7.9-11.9, orbit months 1..3 during 12.7-16.7, then both together 4..6 during 17.3-20.9
const TE=[8.3,9.6,10.9],TO=[13.3,14.6,15.9],TB=[17.6,18.8,20.0];
function count(t,arr){let n=0;for(const a of arr)if(t>=a)n++;return n}
function units(t){const e=count(t,TE)+count(t,TB),o=count(t,TO)+count(t,TB);return [e,o]}
function lastTick(t,arr){let l=-9;for(const a of arr)if(t>=a)l=a;return l}
// --- figures
function limb(ax,ay,len,ang,w,col){const bx=ax+Math.cos(ang)*len,by=ay+Math.sin(ang)*len;x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();return [bx,by]}
function elder(px,py,s,t){// walking older person with a cane (side view), feet at py
 const ph=t*3.2,sw=Math.sin(ph)*.32,col='#f1d9c4',cloth='#6b7fa8',pants='#4b5568';x.save();x.translate(px,py);x.scale(s,s);
 x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(0,0,46,8,0,0,7);x.fill();
 const hip=[0,-92];limb(hip[0],hip[1],50,Math.PI/2+sw,15,pants);limb(hip[0],hip[1],50,Math.PI/2-sw,15,pants);
 x.save();x.translate(0,-92);x.rotate(.22);x.fillStyle=cloth;x.beginPath();x.roundRect(-17,-62,34,66,12);x.fill();
 limb(6,-54,44,Math.PI/2-.55+Math.sin(ph)*.1,11,cloth);x.restore();
 // cane
 x.strokeStyle='#8a5a32';x.lineWidth=5;x.beginPath();x.moveTo(40,-60);x.lineTo(46+Math.sin(ph)*4,0);x.stroke();
 x.fillStyle=col;x.beginPath();x.arc(22,-166,15,0,7);x.fill();x.fillStyle='#e8e8ee';x.beginPath();x.arc(18,-172,13,Math.PI*.9,Math.PI*2);x.fill();
 x.restore()}
function astro(px,py,s,t,rot){x.save();x.translate(px,py);x.rotate(rot);x.scale(s,s);const suit='#f2f3f5',sh='#b9bec7',w=Math.sin(t*1.3);
 limb(-8,30,48,Math.PI/2+.25+w*.08,16,sh);limb(8,30,48,Math.PI/2-.1-w*.08,16,suit);
 x.fillStyle='#c8ccd3';x.fillRect(-30,-36,14,56);
 const tg=x.createLinearGradient(-22,0,22,0);tg.addColorStop(0,'#cfd3da');tg.addColorStop(.5,suit);tg.addColorStop(1,'#dfe2e7');x.fillStyle=tg;x.beginPath();x.roundRect(-22,-40,44,72,12);x.fill();
 x.fillStyle='#e0533a';x.fillRect(-22,-12,44,5);
 limb(-16,-28,40,Math.PI*.85+w*.15,12,suit);limb(16,-28,40,-.5-w*.15,12,suit);
 x.fillStyle=suit;x.beginPath();x.arc(2,-58,20,0,7);x.fill();const vg=x.createLinearGradient(0,-70,20,-46);vg.addColorStop(0,'#f6d57a');vg.addColorStop(1,'#9a6a1c');x.fillStyle=vg;x.beginPath();x.ellipse(8,-58,12,13,0,0,7);x.fill();
 x.restore()}
// --- femur (X-ray look) with a trabecular dot pattern; dens 1 = full, lower = fewer dots (illustration, exaggerated)
const TRAB=[];{const r=rnd(5);for(let k=0;k<260;k++){const end=r()<.5?-1:1;const a=r()*7,d=Math.sqrt(r());TRAB.push([end,Math.cos(a)*d,Math.sin(a)*d,r(),r()*2.2+1.2])}}
function femur(cx,cy,len,dens,t,glow){x.save();x.translate(cx,cy);x.rotate(-.12);
 const hw=len/2,kr=len*.15,sw=len*.07;let g=x.createRadialGradient(0,0,10,0,0,len*.75);g.addColorStop(0,'rgba(90,170,255,'+(.22*glow)+')');g.addColorStop(1,'rgba(90,170,255,0)');x.fillStyle=g;x.fillRect(-len,-len*.6,2*len,1.2*len);
 x.fillStyle='rgba(225,238,255,.92)';x.shadowColor='rgba(140,200,255,.8)';x.shadowBlur=24;
 x.beginPath();x.roundRect(-hw+kr*.6,-sw,len-kr*1.2,2*sw,sw);x.fill();
 for(const e of [-1,1]){x.beginPath();x.arc(e*(hw-kr*.6),-kr*.45,kr*.78,0,7);x.fill();x.beginPath();x.arc(e*(hw-kr*.6),kr*.45,kr*.78,0,7);x.fill()}
 x.shadowBlur=0;
 // spongy inside: dark pores appear as density falls
 const holes=1-dens;for(const [e,u,v,th,rr] of TRAB){if(th>holes)continue;x.fillStyle='rgba(20,40,80,.75)';x.beginPath();x.arc(e*(hw-kr*.6)+u*kr*.75,v*kr*1.0,rr*len/300,0,7);x.fill()}
 x.restore()}
function bar(cx,y,w,val,col,al){x.save();x.globalAlpha=al;x.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.roundRect(cx-w/2,y,w,24,12);x.fill();
 const f=cl((val-90)/10);x.fillStyle=col;x.beginPath();x.roundRect(cx-w/2,y,Math.max(24,w*f),24,12);x.fill();x.restore();
 txt('100%',cx+w/2,y+56,20,'rgba(235,240,248,.75)',al,'Mont','right');txt('90%',cx-w/2,y+56,20,'rgba(235,240,248,.75)',al,'Mont','left')}
function panels(t,al){if(al<=0)return;x.save();x.globalAlpha=al;const [e,o]=units(t);
 const hiE=t>=7.4&&t<12.2?1:0,hiO=t>=12.2&&t<17.0?1:0;
 // left: Earth (warm room-ish dusk), right: orbit
 let g=x.createLinearGradient(0,560,0,1440);g.addColorStop(0,'#2a2238');g.addColorStop(.7,'#4a3a3a');g.addColorStop(1,'#2a2020');x.fillStyle=g;x.fillRect(0,560,540,880);
 g=x.createLinearGradient(0,560,0,1440);g.addColorStop(0,'#03050d');g.addColorStop(1,'#060b1c');x.fillStyle=g;x.fillRect(540,560,540,880);
 for(const s of STARS){if(s[0]<545||s[1]<560||s[1]>1440)continue;x.globalAlpha=al*(.3+.6*s[3]);x.fillStyle='#fff';x.fillRect(s[0],s[1],s[2],s[2])}x.globalAlpha=al;
 // Earth limb under the orbit panel
 x.save();x.beginPath();x.rect(540,560,540,880);x.clip();g=x.createRadialGradient(810,2350,980,810,2350,1080);g.addColorStop(0,'#2a64b0');g.addColorStop(.92,'#5aa0e6');g.addColorStop(1,'rgba(120,190,255,0)');x.fillStyle=g;x.beginPath();x.arc(810,2350,1080,0,7);x.fill();x.restore();
 // floor on the Earth side
 x.fillStyle='#3b2c26';x.fillRect(0,1010,540,430);
 for(const [hx,on] of [[300,hiE],[810,hiO]]){if(on){x.save();x.globalAlpha=al*.5;x.strokeStyle='#ffd166';x.lineWidth=5;x.strokeRect(hx-262+(hx>540?-6:0),566,516,868);x.restore()}}
 x.fillStyle='rgba(0,0,0,.85)';x.fillRect(536,560,8,880);
 txt('ON EARTH',300,628,44,'#fff',1,'Anton');txt('older person, hips',300,664,22,'rgba(240,235,230,.9)',1,'Mont');
 txt('IN ORBIT',810-60,628,44,'#fff',1,'Anton');txt('astronaut, hips',810-60,664,22,'rgba(230,240,255,.9)',1,'Mont');
 elder(300,1000,1.25,t);astro(750,860,1.15,t,.25+Math.sin(t*.7)*.12);
 // femurs + bars
 const de=1-0.01*e*12,do_=1-0.01*o*12;   // dots exaggerated 12x so the change is visible
 femur(290,1150,330,cl(de,0,1),t,1);femur(740,1150,330,cl(do_,0,1),t,1);
 bar(290,1250,330,100-e,'#ffb35c',1);bar(740,1250,330,100-o,'#7fc6ff',1);
 // counters (pulse on each tick)
 const pe=1+.25*Math.exp(-(t-Math.max(lastTick(t,TE),lastTick(t,TB)))/.15),po=1+.25*Math.exp(-(t-Math.max(lastTick(t,TO),lastTick(t,TB)))/.15);
 const hk=t<7.4;txt(hk?'? YEARS':(e==1?'1 YEAR':e+' YEARS'),290,1376,52*pe,'#ffd166',1,'Anton');txt(hk?'? MONTHS':(o==1?'1 MONTH':o+' MONTHS'),740,1376,52*po,'#9fd6ff',1,'Anton');
 txt('up to 1% a year',290,1418,24,'#f3e6d8',t>=7.4?1:0,'Mont');txt('1 to 1.5% a month',740,1418,24,'#dcecff',t>=12.2?1:0,'Mont');
 x.restore()}
// --- close-up: bone lattice with builder (green) and remover (red) cells
const LAT=[];{const r=rnd(77);const P=[];for(let k=0;k<120;k++)P.push([90+r()*850,600+r()*800]);for(let i=0;i<P.length;i++){const d=P.map((q,j)=>[Math.hypot(q[0]-P[i][0],q[1]-P[i][1]),j]).sort((a,b)=>a[0]-b[0]);for(let k=1;k<=3;k++){const j=d[k][1];if(j>i)LAT.push([P[i],P[j],r()])}}}
function lattice(t,al){if(al<=0)return;const k=t-21.0;x.save();x.globalAlpha=al;let g=x.createRadialGradient(540,1000,50,540,1000,800);g.addColorStop(0,'#3a1d22');g.addColorStop(1,'#120709');x.fillStyle=g;x.fillRect(0,0,W,H);
 const thin=cl(k/6.5);
 for(const [a,b,r] of LAT){const w=Math.max(3,(26+14*r)*(1-0.5*thin*(r<.35?1.6:1)));const gone=r<.18&&thin>0.6+r;if(gone)continue;
  x.strokeStyle='rgba(240,228,205,.95)';x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
 // cells: removers (red, keep pace), builders (green, slow down)
 const cells=[[0,.0],[0,.33],[0,.66],[1,.15],[1,.5],[1,.85]];
 for(const [type,off] of cells){const seg=LAT[Math.floor(off*LAT.length*.97)+3*type];const sp=type?0.10*(1-0.8*cl((k-3.2)/1.2)):0.12;const u=(off+k*sp)%1;
  const px=lerp(seg[0][0],seg[1][0],u),py=lerp(seg[0][1],seg[1][1],u)-16;
  const c=type?'#7fe0a0':'#ff6b5e';x.fillStyle=c;x.shadowColor=c;x.shadowBlur=20;x.beginPath();x.ellipse(px,py,22,16,0,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.arc(px+4,py,6,0,7);x.fill()}
 txt('BUILDERS',300,1520-80,40,'#9df0bf',ease((k-.6)/.3),'Anton');txt('REMOVERS',780,1520-80,40,'#ff8f84',ease((k-.6)/.3),'Anton');
 txt(k>3.2?'slowing down':'building bone',300,1400+0,24,'#e6fff0',ease((k-.6)/.3),'Mont');txt('same pace',780,1400,24,'#ffe9e6',ease((k-.6)/.3),'Mont');
 x.restore()}
// --- exercise: astronaut on a treadmill, held down by straps, Earth in the window
function exercise(t,al){if(al<=0)return;const k=t-27.9;x.save();x.globalAlpha=al;let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2030');g.addColorStop(1,'#0a0d16');x.fillStyle=g;x.fillRect(0,0,W,H);
 // window with Earth
 x.save();x.beginPath();x.roundRect(160,600,760,420,40);x.clip();x.fillStyle='#02040c';x.fillRect(160,600,760,420);g=x.createRadialGradient(540,1700,700,540,1700,820);g.addColorStop(0,'#2b66b4');g.addColorStop(.9,'#6fb0f0');g.addColorStop(1,'rgba(120,190,255,0)');x.fillStyle=g;x.beginPath();x.arc(540-k*12,1700,820,0,7);x.fill();
 for(let i=0;i<14;i++){x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.ellipse((300+i*97-k*30)%900+150,960+Math.sin(i)*30,40,10,0,0,7);x.fill()}x.restore();
 x.strokeStyle='#8c95a8';x.lineWidth=10;x.beginPath();x.roundRect(160,600,760,420,40);x.stroke();
 // treadmill
 x.fillStyle='#39404f';x.fillRect(250,1330,580,40);x.fillStyle='#232833';x.fillRect(250,1370,580,30);
 for(let i=0;i<12;i++){x.fillStyle='rgba(255,255,255,.12)';x.fillRect(250+((i*50-k*160)%580+580)%580,1334,6,32)}
 // runner
 const ph=k*9,s=1.5,col='#e9ecf2';x.save();x.translate(540,1330);x.scale(s,s);
 for(const sg of [1,-1]){const a=Math.sin(ph)*.6*sg;const [kx,ky]=limb(0,-110,52,Math.PI/2+a,15,'#3a4a6a');limb(kx,ky,52,Math.PI/2+a-Math.max(0,Math.sin(ph*sg))*.9,14,'#3a4a6a')}
 x.fillStyle='#5978b8';x.beginPath();x.roundRect(-18,-180,36,76,12);x.fill();for(const sg of [1,-1])limb(0,-170,44,Math.PI/2-Math.sin(ph)*.7*sg,11,'#5978b8');
 x.fillStyle='#f1d3b8';x.beginPath();x.arc(4,-200,17,0,7);x.fill();x.restore();
 // straps (bungees) pulling the runner down
 x.strokeStyle='#ffd166';x.lineWidth=4;for(const sx of [-1,1]){x.beginPath();x.moveTo(540+sx*26,1330-240);x.lineTo(540+sx*230,1340);x.stroke()}
 txt('harness pulls you onto the treadmill',540,1440,24,'#eef2f8',ease((k-.3)/.3)*(1-ease((k-3.5)/.3)),'Mont');
 x.restore()}
const CARDS=[[0,3.2,'BONES IN SPACE','HOW FAST DO THEY WEAKEN?'],[3.2,7.4,'1 MONTH IN ORBIT =','HOW MANY YEARS OF AGING?'],
 [7.4,12.2,'ON EARTH, WITH AGE:','UP TO 1% A YEAR'],[12.2,17.0,'IN ORBIT:','1 TO 1.5% EVERY MONTH'],[17.0,21.0,'1 MONTH UP THERE','= A YEAR OR MORE OF AGING'],
 [21.0,24.2,'NO WEIGHT ON','YOUR BONES'],[24.2,27.9,'BUILDING SLOWS,','REMOVING DOESN’T'],[27.9,31.6,'THE FIX: EXERCISE','ABOUT 2 HOURS A DAY'],
 [31.6,33.7,'WOULD YOU TRADE SOME','BONE FOR THIS VIEW?'],[33.7,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'BONES IN SPACE','HOW FAST DO THEY WEAKEN?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,820),l2?fit(l2,80,820):99);const pop=l1.startsWith('1 MONTH UP')?1+0.08*Math.exp(-(t-a)/.15):1;
 txt(l1,495,410,sz*pop,'#fff',al);if(l2)txt(l2,495,410+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.fillStyle='#04050b';x.fillRect(0,0,W,H);
 for(const s of STARS){x.globalAlpha=(.25+.5*s[3])*(.7+.3*Math.sin(t*1.3+s[3]*40));x.fillStyle='#fff';x.fillRect(s[0],s[1],s[2],s[2])}x.globalAlpha=1;
 const u=t>=LOOP?t-D:t;
 // hook motion: in the first seconds the orbit femur visibly loses dots (preview of the payoff), reset by 7.4 s
 const pa=t<21.0?1:(t>=33.5?ease((t-33.5)/.4):0);
 const ht=(t<7.4||t>=31.4)?(t>=LOOP?0:0):0;
 panels(t>=33.5?0:t,pa);
 if(t<7.4||t>=33.5){// hook preview: orbit bone already thinning, counter racing
  const k=t<7.4?t:0;const n=2+Math.min(4,Math.floor(cl(k/6.6)*5));
  x.save();x.globalAlpha=t<7.4?1:ease((t-33.5)/.4);femur(740,1150,330,1-0.12*n,t,1.4);x.restore()}
 lattice(t,t>=20.6&&t<28.3?(t<21.0?ease((t-20.6)/.4):1-ease((t-27.9)/.4)):0);
 exercise(t,t>=27.6&&t<34.0?(t<27.9?ease((t-27.6)/.3):1-ease((t-33.5)/.4)):0);
 let g=x.createLinearGradient(0,0,0,620);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(.55,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,620);
 cards(t);
 const fa=t>=7.4&&t<21?1:0;txt('average rates · bars zoomed (90-100%) · drawings are illustrations',495,548,20,'#eef2f8',fa*.9,'Mont');
 g=x.createRadialGradient(540,980,560,540,980,1300);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
