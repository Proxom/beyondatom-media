<!doctype html><meta charset=utf8><body style="margin:0;background:#000">
<canvas id=g width=1080 height=1920 style="display:none"></canvas><canvas id=c width=1080 height=1920></canvas>
<!-- europa-water: orthographic, to-scale spheres. Earth (NASA Blue Marble, oceans can drain), Europa (procedural ice + lineae, octant cutaway:
     ice shell 20 km, ocean 100 km = middle of NASA's 15-25 km / 60-150 km ranges; interior below the ocean illustrative), water balls (USGS ocean volume). -->
<script id=fs type=x-shader>
precision highp float;
uniform vec2 R;uniform float T;uniform vec3 SUN;
uniform vec4 SP[5];uniform float TY[5];uniform float SPIN[5];uniform float AL[5];
uniform float CUTA;uniform vec3 E0,E1,E2;uniform float CUTON;uniform float EDR,ODR;uniform sampler2D TEX,CLD;
float h1(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n3(p);p*=2.02;a*=.5;}return s;}
vec3 sky(vec2 q){vec3 d=normalize(vec3((q-.5*R)/R.x,1.2));vec3 c=vec3(0.);
 for(int l=0;l<2;l++){float sc=l==0?160.:320.;vec3 p=d*sc;vec3 id=floor(p);float hs=h1(id+float(l)*7.);
  if(hs>.88){vec3 sp=id+.5+.35*(vec3(h1(id+1.),h1(id+2.),h1(id+3.))-.5);float dd=length(p-sp);
   c+=pow(hs-.88,1.5)*30.*exp(-dd*dd*30.)*mix(vec3(1.,.85,.7),vec3(.75,.85,1.),h1(id+9.));}}
 c+=vec3(.030,.028,.060)*pow(fbm(d*2.5+3.),2.5)*2.;c+=vec3(.008,.014,.034)*(1.-q.y/R.y);return c;}
float ridged(vec3 p){return 1.-abs(2.*n3(p)-1.);}
// 0 earth 1 europa 2 water ; p = unit vector in body frame (y = spin axis)
vec3 alb(float ty,vec3 p){float lat=p.y;
 if(ty<.5){vec2 uv=vec2(atan(p.z,-p.x)/6.28318+.5,acos(clamp(p.y,-1.,1.))/3.14159);
  vec3 c=pow(texture2D(TEX,uv).rgb,vec3(1.9))*1.45;vec3 raw=texture2D(TEX,uv).rgb;
  float oc=smoothstep(.015,.07,raw.b-max(raw.r,raw.g)*.95)*smoothstep(.55,.35,raw.r);        // ocean mask (dark blue pixels)
  vec3 bed=mix(vec3(.30,.26,.22),vec3(.17,.15,.14),fbm(p*7.+2.))*(.85+.3*fbm(p*23.));
  c=mix(c,bed,oc*EDR);float cl=texture2D(CLD,uv).a*(1.-EDR);return mix(c,vec3(.97),smoothstep(.04,.75,cl)*.85);}
 if(ty<1.5){vec3 c=mix(vec3(.80,.76,.69),vec3(.93,.91,.87),fbm(p*3.+4.));c*=.93+.12*fbm(p*14.);
  float br=smoothstep(.55,.72,fbm(p*2.4+vec3(3.,9.,1.)));c=mix(c,vec3(.62,.47,.36),br*.55);             // mottled darker terrain
  float l1=pow(ridged(p*3.1+vec3(1.,2.,3.)+.25*fbm(p*6.)),26.),l2=pow(ridged(p*5.3+vec3(7.,1.,5.)),40.),l3=pow(ridged(p*9.7+vec3(2.,8.,4.)),60.);
  float ln=clamp(l1*.75+l2*.6+l3*.35,0.,1.);c=mix(c,vec3(.55,.33,.22),ln*.7);return c;}
 return vec3(.035,.20,.50)*(.92+.12*fbm(p*6.+T*.05));}
vec3 atm(float ty){return ty<.5?vec3(.3,.55,1.):ty<1.5?vec3(0.):vec3(.35,.65,1.);}
vec3 rot(vec3 p,float s){float ca=cos(s),sa=sin(s);return vec3(ca*p.x+sa*p.z,p.y,-sa*p.x+ca*p.z);}
vec3 surf(float ty,vec3 n,float spn){vec3 lp=rot(n,spn);
 vec3 a=alb(ty,lp);float ndl=dot(n,SUN);float dif=smoothstep(-.08,.35,ndl)*max(ndl+.08,0.)/1.08;
 float mu=max(n.z,0.);dif*=.55+.45*pow(mu,.4);
 vec3 c=a*dif*1.25;float rim=pow(1.-mu,3.)*smoothstep(-.3,.5,ndl);c+=atm(ty)*rim*(ty<.5?.55:ty>1.5?.45:0.);c+=a*.035;
 if(ty>1.5){vec3 h=normalize(SUN+vec3(0.,0.,1.));float sp=pow(max(dot(n,h),0.),70.);c+=vec3(1.,.98,.95)*sp*.9*smoothstep(0.,.2,ndl);
  c+=vec3(.25,.5,.85)*pow(1.-mu,2.)*.35;}
 return c;}
// cut face colour (Europa interior): r = radius fraction
const float RI=0.98719,RO=0.92312,RC=0.42;   // ice 20 km, ocean below to 120 km, core boundary illustrative
vec3 face(vec3 pv,float R0,vec3 n){float r=length(pv)/R0;vec3 q=pv/R0;vec3 c;
 if(r>RI)c=vec3(.86,.92,.98)*(.92+.1*fbm(q*60.));
 else if(r>RO){vec3 w=vec3(.06,.30,.66)*(.9+.15*fbm(q*30.+T*.3));c=mix(w,vec3(.05,.05,.07),ODR);}
 else if(r>RC)c=vec3(.46,.40,.35)*(.8+.35*fbm(q*14.+2.));
 else c=mix(vec3(.80,.58,.38),vec3(.64,.44,.28),smoothstep(0.,RC,r))*(.9+.15*fbm(q*9.));
 float l=.66+.34*max(dot(n,SUN),0.);return c*l;}
vec3 shadeAt(vec2 q){
 vec3 col=sky(q);
 for(int k=0;k<5;k++){vec4 S=SP[k];if(S.w<=0.||AL[k]<=0.)continue;float dd=length(q-S.xy)/S.w;col+=atm(TY[k])*exp(-max(dd-1.,0.)*8.)*.07*AL[k]*step(1.,dd);}
 float best=-1e9;int bi=-1;vec3 bn=vec3(0.);
 for(int k=0;k<5;k++){vec4 S=SP[k];if(S.w<=0.||AL[k]<=0.)continue;vec2 d=q-S.xy;float r2=dot(d,d);float rr=S.w+.75;if(r2>rr*rr)continue;
  float z=sqrt(max(S.w*S.w-r2,0.));if(z>best){best=z;bi=k;bn=vec3(d.x,-d.y,z)/S.w;}}
 if(bi<0)return col;
 vec4 S;float spn,al,ty;for(int k=0;k<5;k++){if(k==bi){S=SP[k];spn=SPIN[k];al=AL[k];ty=TY[k];}}
 float dpx=length(q-S.xy);float cov=clamp(S.w-dpx+.5,0.,1.);
 vec3 n=normalize(bn);vec3 c;
 if(bi==1&&CUTON>0.){ // octant cut: removed where e_i.p > a for all i (p in px, view coords y up z to viewer)
  vec3 p0=n*S.w;float a=CUTA*S.w;
  bool rem=dot(E0,p0)>a&&dot(E1,p0)>a&&dot(E2,p0)>a;
  if(!rem)c=surf(ty,n,spn);
  else{ float zb=-1e9;vec3 fn=vec3(0.);
   float z0=(a-E0.x*p0.x-E0.y*p0.y)/E0.z,z1=(a-E1.x*p0.x-E1.y*p0.y)/E1.z,z2=(a-E2.x*p0.x-E2.y*p0.y)/E2.z;
   if(z0<=p0.z+.01&&z0>zb){zb=z0;fn=E0;}if(z1<=p0.z+.01&&z1>zb){zb=z1;fn=E1;}if(z2<=p0.z+.01&&z2>zb){zb=z2;fn=E2;}
   vec3 ph=vec3(p0.xy,zb);
   if(zb>-p0.z)c=face(ph,S.w,fn);else c=col;}
 }else c=surf(ty,n,spn);
 return mix(col,c,cov*al);}
void main(){
 vec2 q=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);vec3 col;
 vec4 S1=SP[1];bool aa=false; // 4x supersampling of the cut body was ~30x too slow in SwiftShader (render ~1 frame/min/proc)
 if(aa){col=vec3(0.);for(int s=0;s<4;s++){vec2 o=vec2(s==1||s==3?.25:-.25,s>=2?.25:-.25);col+=shadeAt(q+o);}col*=.25;}
 else col=shadeAt(q);
 col=1.-exp(-col*1.1);col=pow(col,vec3(.95));gl_FragColor=vec4(col,1.);}
</script>

<script>
const W=1080,H=1920;const g=document.getElementById('g'),gl=g.getContext('webgl',{preserveDrawingBuffer:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw gl.getProgramInfoLog(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function mkTex(src,unit,cb){const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);cb()};im.src=src;}
let _tl=0;const _ok=()=>{_tl++;if(_tl==2){window.TEXREADY=true}};
mkTex(TEXA,0,_ok);mkTex(TEXC,1,_ok);
gl.uniform1i(U('TEX'),0);gl.uniform1i(U('CLD'),1);
const c=document.getElementById('c'),x=c.getContext('2d');
</script>
