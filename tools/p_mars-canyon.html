<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- mars-canyon (series "How Big Is It?"): Valles Marineris vs the Grand Canyon.
     Picture: NASA/JPL PIA00003 "Valles Marineris Hemisphere" (102 Viking Orbiter images, public domain), tools/pl/PIA00003.jpg = images-assets.nasa.gov/image/PIA00003/PIA00003~large.jpg (1920x1812).
     ESA (22 Oct 2012) "The Solar System's grandest canyon": over 4000 km long, 200 km wide, depth 10 km; some ten times longer and five times deeper than the Grand Canyon.
     NASA image article "Valles Marineris: The Grand Canyon of Mars": about 3,870 km long.
     NASA/JPL PIA02891 "Mars Canyon with Los Angeles for Scale": 10 times longer than Arizona's Grand Canyon; could reach across the United States coast to coast; rim more than 25,000 ft (7.6 km) high, nearly as tall as Everest.
     NPS Grand Canyon FAQ: 277 river miles (446 km) long; deepest 6,000 ft (1,829 m).  Everest 8,849 m.
     Cross-section: one vertical scale for both canyons and Everest (1 km = 78 px); widths not to scale. -->
<script>
const W=1080,H=1920,FPS=30,D=29.0,LOOP=28.8;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const IMG=new Image();IMG.src='pl/PIA00003.jpg';
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
// Mars mosaic: crop centred on the canyon (source px), slow push toward it
let MAP=null;
function mars(u,dim){const z=1+0.10*ease(cl(u/28.8))+0.02*Math.sin(u*0.3);const cxs=lerp(1000,975,cl(u/28.8)),cys=1000;const hs=1150/z,ws=hs*W/H;
 x.drawImage(IMG,cxs-ws/2,cys-hs/2,ws,hs,0,0,W,H);MAP=(sx,sy)=>[(sx-(cxs-ws/2))/ws*W,(sy-(cys-hs/2))/hs*H,W/ws];
 if(dim>0.01){x.fillStyle='rgba(0,0,0,'+(0.62*dim)+')';x.fillRect(0,0,W,H)}}
function chips(u){if(u<5.3||u>=14.4)return;const a=Math.min(ease((u-5.3)/.3),ease((14.4-u)/.3));const L=[['3X',270],['6X',540],['9X',810]];
 for(let i=0;i<3;i++){const [s,cx]=L[i];const ai=a*ease((u-5.3-i*0.3)/.25);if(ai<=0.01)continue;const rev=u>=12.2;const win=i==2&&rev,lose=i!=2&&rev;
  x.save();x.globalAlpha=ai*(lose?0.35:1);x.fillStyle=win?'#1f9d55':'rgba(20,24,32,.85)';x.beginPath();x.roundRect(cx-110,630,220,100,22);x.fill();x.strokeStyle=win?'#8dffb8':'#ffd166';x.lineWidth=5;x.stroke();x.restore();
  txt(s,cx,705,70,'#fff',ai*(lose?0.35:1))}}
function bars(u){if(u<7.6||u>=18.2)return;const a=Math.min(ease((u-7.6)/.4),ease((18.2-u)/.4));const X0=110,FULL=810,gc=FULL*446/4000;
 x.save();x.globalAlpha=a;
 txt('GRAND CANYON',X0,900,64,'#ffb36b',a,'Anton','left');x.fillStyle='#ff9a3c';x.beginPath();x.roundRect(X0,925,gc,72,12);x.fill();txt('446 KM',X0+gc+20,985,58,'#ffb36b',a,'Anton','left');
 const g=ease((u-8.4)/3.0),km=Math.round(4000*g/10)*10;
 txt('VALLES MARINERIS',X0,1110,64,'#ffd166',a,'Anton','left');x.fillStyle='#e8543a';x.beginPath();x.roundRect(X0,1135,Math.max(4,FULL*g),72,12);x.fill();
 x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=4;for(let k=1;k*gc<FULL*g;k++){x.beginPath();x.moveTo(X0+k*gc,1135);x.lineTo(X0+k*gc,1207);x.stroke()}
 txt((g>=1?'ABOUT ':'')+km.toLocaleString('en-US')+' KM',X0+Math.min(FULL*g,FULL),1290,72,'#ffffff',a,'Anton',g>0.5?'right':'left');
 x.restore()}
// cross-section: one vertical scale (78 px per km)
function section(u,k){if(k<=0.01)return;const S=78,G=760;x.save();x.globalAlpha=k;
 let g=x.createLinearGradient(0,0,0,G);g.addColorStop(0,'#3a2a22');g.addColorStop(1,'#c7a07a');x.fillStyle=g;x.fillRect(0,0,W,H);
 const dig=ease((u-18.3)/2.2),vm=7.6*S*dig,gcD=1.83*S;
 // ground with the Grand Canyon notch (left) and the Valles Marineris trench (right)
 x.fillStyle='#8a4b2c';x.beginPath();x.moveTo(0,G);x.lineTo(90,G);x.lineTo(150,G+gcD);x.lineTo(210,G+gcD);x.lineTo(270,G);x.lineTo(330,G);
 x.lineTo(400,G+vm*0.55);x.lineTo(430,G+vm);x.lineTo(880,G+vm);x.lineTo(910,G+vm*0.55);x.lineTo(990,G);x.lineTo(W,G);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();x.strokeStyle='#d9895a';x.lineWidth=6;x.stroke();
 x.save();x.clip();x.strokeStyle='rgba(60,25,15,.35)';x.lineWidth=3;for(let yy=G+60;yy<H;yy+=70){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}x.restore();
 // Everest rising from the trench floor
 const ev=ease((u-23.0)/1.6);if(ev>0.01){const eh=8.849*S*ev,base=G+vm,cx=560;x.fillStyle='#6d6f78';x.beginPath();x.moveTo(cx-230,base);x.lineTo(cx-60,base-eh*0.72);x.lineTo(cx,base-eh);x.lineTo(cx+70,base-eh*0.78);x.lineTo(cx+230,base);x.closePath();x.fill();
  x.fillStyle='#f2f4f8';x.beginPath();x.moveTo(cx-38,base-eh*0.86);x.lineTo(cx,base-eh);x.lineTo(cx+42,base-eh*0.88);x.lineTo(cx+12,base-eh*0.9);x.closePath();x.fill();
  txt('EVEREST',cx-70,base-eh+40,52,'#ffffff',ev*k,'Anton','right');txt('8.8 KM',cx-70,base-eh+95,52,'#ffffff',ev*k,'Anton','right')}
 // tiny person on the left rim for scale (not to scale)
 txt('GRAND CANYON',180,G-30,42,'#ffb36b',k);txt('1.8 KM',180,G+gcD+60,50,'#ffb36b',k*ease((u-18.4)/.4));
 // depth arrow
 if(dig>0.02){x.strokeStyle='#ffd166';x.lineWidth=6;x.beginPath();x.moveTo(905,G+10);x.lineTo(905,G+vm-10);x.stroke();x.beginPath();x.moveTo(890,G+vm-30);x.lineTo(905,G+vm-6);x.lineTo(920,G+vm-30);x.stroke();
  txt((7.6*dig).toFixed(1)+' KM',840,G+vm*0.5+20,58,'#ffd166',k,'Anton','right')}
 txt('VALLES MARINERIS',790,G-30,40,'#ffd166',k);
 txt('SAME HEIGHT SCALE · WIDTHS NOT TO SCALE',540,1420,30,'#f0e0d0',k*0.9);
 x.restore()}
const CARDS=[[-1,5.3,'IT MAKES THE GRAND','CANYON LOOK TINY'],[5.3,7.9,'GUESS: HOW MANY','TIMES LONGER?'],[7.9,12.2,'VALLES MARINERIS:','ABOUT 4,000 KM LONG'],[12.2,14.4,'ABOUT 9 TIMES','LONGER THAN OURS'],
 [14.4,17.9,'ON EARTH: COAST TO','COAST ACROSS THE USA'],[17.9,22.4,'WALLS OVER 7.6 KM HIGH','MORE THAN 4 TIMES DEEPER'],[22.4,26.8,'NEARLY AS TALL','AS MOUNT EVEREST'],[26.8,28.1,'WOULD YOU','HIKE IT?'],[28.1,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'IT MAKES THE GRAND','CANYON LOOK TINY']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,840),fit(l2,80,840));const g=x.createLinearGradient(0,320,0,600);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.6*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,280);
 txt(l1,495,420,sz,'#fff',al);txt(l2,495,420+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 const dim=u>=7.6&&u<18.2?Math.min(ease((u-7.6)/.4),ease((18.2-u)/.4)):0;mars(u,dim);
 // canyon label + soft glow pointer in the hook
 if(u<5.3||u>=26.8){const a=u<5.3?Math.min(ease((u-0.6)/.4),ease((5.3-u)/.3)):ease((u-26.8)/.4);const p=0.5+0.5*Math.sin(u*3);
  x.save();x.globalAlpha=a*(0.5+0.3*p);x.strokeStyle='#ffd166';x.lineWidth=7;x.setLineDash([22,16]);const [ex,ey,sc]=MAP(990,1120);x.lineWidth=5;x.beginPath();x.ellipse(ex,ey,470*sc,95*sc,0.17,0,7);x.stroke();x.restore();
  txt('VALLES MARINERIS',540,Math.min(1400,ey+95*sc+90),66,'#ffd166',a)}
 const sk=u>=17.9&&u<26.9?Math.min(ease((u-17.9)/.5),ease((26.9-u)/.4)):0;section(u,sk);
 chips(u);bars(u);cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont'),new Promise(r=>{if(IMG.complete)r();else IMG.onload=r})]).then(()=>{window.TEXREADY=true});
</script>
