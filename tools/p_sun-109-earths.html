<!doctype html><meta charset=utf8><body style="margin:0;background:#000">
<canvas id=g width=1080 height=1920 style="display:none"></canvas><canvas id=c width=1080 height=1920></canvas>
<!-- sun-109-earths: Sun and a row (and column) of Earths, one km scale (NSSDC mean radii 695,700 / 6,371 km).
 World units = Earth radii, y up, Sun centre at the origin. Earths sit ZE Earth radii in front of the Sun, lit by it. -->
<script id=fs type=x-shader>
precision highp float;
uniform vec2 R;uniform vec3 CAM;uniform float T,CR,CC,E0X,RA,CA,ZE,LOD,SRR,GLOW,FR,FA;uniform sampler2D TEX,CLD;
const float RS=109.2;const float X0=-108.2;
float h1(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
vec3 h3(vec3 p){return vec3(h1(p),h1(p+17.1),h1(p+31.7));}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h1(i),h1(i+vec3(1,0,0)),f.x),mix(h1(i+vec3(0,1,0)),h1(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h1(i+vec3(0,0,1)),h1(i+vec3(1,0,1)),f.x),mix(h1(i+vec3(0,1,1)),h1(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n3(p);p*=2.03;a*=.5;}return s;}
// granulation: 3D cellular F2-F1 (bright cells, dark lanes)
float gran(vec3 p){vec3 i=floor(p),f=fract(p);float d1=9.,d2=9.;
 for(int z=-1;z<=1;z++)for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec3 o=vec3(float(x),float(y),float(z));
  vec3 r=o+.15+.7*h3(i+o)-f;float d=dot(r,r);if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}
 return smoothstep(0.,.55,sqrt(d2)-sqrt(d1));}
vec3 sky(vec2 q){vec3 d=normalize(vec3((q-.5*R)/R.x,1.2));vec3 c=vec3(0.);
 for(int l=0;l<2;l++){float sc=l==0?160.:320.;vec3 p=d*sc;vec3 id=floor(p);float hs=h1(id+float(l)*7.);
  if(hs>.9){vec3 sp=id+.5+.35*(h3(id)-.5);float dd=length(p-sp);c+=pow(hs-.9,1.5)*24.*exp(-dd*dd*30.)*mix(vec3(1.,.85,.7),vec3(.75,.85,1.),h1(id+9.));}}
 return c+vec3(.006,.008,.016);}
vec3 sunCol(vec2 p,float px){ // p world (Earth radii); px = world size of one pixel
 float r=length(p)/RS;vec3 c=vec3(0.);
 // corona / glow (outside) - soft, warm
 float out1=max(r-1.,0.);c+=vec3(1.,.5,.18)*(.40*exp(-out1*45.)+.14*exp(-out1*9.)+.04*exp(-out1*2.5))*GLOW;
 c+=vec3(1.,.25,.12)*.35*exp(-out1*RS/px*.35)*step(0.,out1); // thin chromosphere edge, about 3 px
 if(r<1.+px/RS){float mu=sqrt(max(1.-r*r,0.));
  float ld=1.-.50*(1.-mu)-.16*(1.-mu)*(1.-mu);           // limb darkening
  vec3 P=vec3(p,mu*RS);                                    // point on the photosphere (Earth radii)
  float g=.5,wg=clamp((0.16/px-1.2)/2.,0.,1.)*LOD;         // granules ~0.16 R_E (~1,000 km); fade when sub-pixel
  wg*=smoothstep(.1,.5,mu);                                // granules fade out where the surface curves away
  if(wg>0.)g=mix(.5,gran(P/0.16+vec3(0.,0.,T*.15)),wg);
  float m=fbm(P/2.2+3.)-.5,m2=fbm(P/9.+11.)-.5;           // mottling + faint large-scale pattern
  float fac=smoothstep(.55,.0,mu)*smoothstep(.12,.3,fbm(P/1.4+7.))*.25; // faculae near the limb
  float I=ld*(1.+.45*(g-.5)*wg+.10*m+.06*m2+fac);
  vec3 hot=vec3(1.,.84,.52),warm=vec3(1.,.52,.12),deep=vec3(.85,.24,.03);
  vec3 sc=mix(deep,mix(warm,hot,smoothstep(.25,1.,mu)),smoothstep(0.,.35,mu));
  vec3 s=sc*I*1.75;
  float cov=clamp((RS-length(p))/px+.5,0.,1.);c=mix(c,s,cov);}
 return c;}
vec3 earthCol(vec3 cen,vec2 p,float sz,float spin,vec3 under,float px,out float cov){
 vec2 d=(p-cen.xy)/sz;float dd=length(d);cov=clamp((1.-dd)*sz/px+.5,0.,1.);
 vec3 L=normalize(-cen);                                  // towards the Sun centre
 vec3 n=vec3(d,sqrt(max(1.-dd*dd,0.)));
 float ca=cos(spin),sa=sin(spin);vec3 lp=vec3(ca*n.x+sa*n.z,n.y,-sa*n.x+ca*n.z);
 vec2 uv=vec2(atan(lp.z,-lp.x)/6.28318+.5,acos(clamp(lp.y,-1.,1.))/3.14159);
 vec3 a=pow(texture2D(TEX,uv).rgb,vec3(1.9))*1.45;float cl=texture2D(CLD,uv).a;a=mix(a,vec3(.97),smoothstep(.04,.75,cl)*.85);
 float ndl=dot(n,L);float dif=smoothstep(-.06,.3,ndl)*max(ndl+.06,0.)/1.06;
 vec3 e=a*dif*1.6+a*.012;                                 // faint fill: night side nearly black
 float mu=n.z;float rim=pow(1.-mu,3.);
 e+=vec3(.3,.55,1.)*rim*(.35*smoothstep(-.3,.4,ndl)+.25);  // atmosphere limb (lit side + forward-scattered backlight)
 vec3 res=mix(under,e,cov);
 // thin backlit atmosphere ring just outside the disc
 float ring=exp(-pow((dd-1.)*sz/max(px,sz*.012),2.)*.5)*step(1.,dd);res+=vec3(.35,.6,1.)*ring*.35*(1.-cov);
 return res;}
void main(){
 vec2 q=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);float s=CAM.z;
 vec2 p=vec2(CAM.x+(q.x-540.)/s,CAM.y-(q.y-1040.)/s);float px=1./s;
 float cs=clamp((RS-length(p))/px+.5,0.,1.);vec3 col=sky(q)*(1.-cs)+sunCol(p,px);
 // row (y = 0): Earth k at X0+2k, k=1..108 (Earth 0 is drawn separately because it slides in)
 float cov;
 {float k=floor((p.x-X0)/2.+.5);
  for(int j=-1;j<=1;j++){float kk=k+float(j);if(kk<1.||kk>108.)continue;float sc=clamp((CR-kk)/.8,0.,1.);sc=sc*sc*(3.-2.*sc)*RA;
   if(sc<=.001)continue;vec3 cen=vec3(X0+2.*kk,0.,ZE);if(abs(p.x-cen.x)>1.2||abs(p.y)>1.2)continue;
   col=earthCol(cen,p,sc,kk*2.4,col,px,cov);}}
 // column (x = Earth 54's x): Earth j at y = X0+2j, j != 54
 {float xc=X0+108.;float k=floor((p.y-X0)/2.+.5);
  if(abs(p.x-xc)<1.2)for(int j=-1;j<=1;j++){float kk=k+float(j);if(kk<0.||kk>108.||abs(kk-54.)<.5)continue;
   float ord=kk<54.?(54.-kk)*2.-1.:(kk-54.)*2.;          // grows outward from the centre, both ways
   float sc=clamp((CC-ord)/.8,0.,1.);sc=sc*sc*(3.-2.*sc)*CA;if(sc<=.001)continue;
   vec3 cen=vec3(xc,X0+2.*kk,ZE);col=earthCol(cen,p,sc,kk*1.7+1.,col,px,cov);}}
 // fill: the whole disc packed with Earths (grid aligned with the row: x = X0+2i, y = 2j), spreading out from the centre
 if(FA>0.){vec2 cell=vec2(X0+2.*floor((p.x-X0)/2.+.5),2.*floor(p.y/2.+.5));float lc=length(cell);
  if(lc+1.<=RS&&abs(cell.y)>.5&&abs(cell.x-(X0+108.))>.5){float sc=clamp((FR-lc)/8.,0.,1.);sc=sc*sc*(3.-2.*sc)*FA;
   if(sc>.001)col=earthCol(vec3(cell,ZE),p,sc,cell.x*.7+cell.y*1.3,col,px,cov);}}
 // Earth 0
 {vec3 cen=vec3(E0X,0.,ZE);if(length(p-cen.xy)<1.3)col=earthCol(cen,p,1.,SRR,col,px,cov);}
 col=1.-exp(-col*1.25);col=pow(col,vec3(.97));
 gl_FragColor=vec4(col,1.);}
</script>
<script src="tex.js"></script><script>
const W=1080,H=1920;const g=document.getElementById('g'),gl=g.getContext('webgl',{preserveDrawingBuffer:true});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').text));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw gl.getProgramInfoLog(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function mkTex(src,unit,cb){const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);cb()};im.src=src;}
let _tl=0;const _ok=()=>{_tl++;if(_tl==2){window.TEXREADY=true}};
mkTex(TEXA,0,_ok);mkTex(TEXC,1,_ok);
gl.uniform1i(U('TEX'),0);gl.uniform1i(U('CLD'),1);gl.uniform2f(U('R'),W,H);
const c=document.getElementById('c'),x=c.getContext('2d');
</script>
