<!doctype html><meta charset=utf8><body style="margin:0;background:#000">
<canvas id=c width=1080 height=1920></canvas>
<!-- jump-five-worlds: the same jump on Earth, Mars, the Moon, Pluto and Ceres, real time, one shared metre scale (camera zooms out). Surfaces illustrative. -->
<script src="jump-five-worlds.js"></script>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const L=document.createElement('canvas');L.width=W;L.height=H;const lx=L.getContext('2d');
const T=document.createElement('canvas');T.width=W;T.height=H;const tx=T.getContext('2d');
const FNT='"DejaVu Sans",Arial,sans-serif';
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const LOOK=[
 {sky:['#1f5fae','#5f9bd6','#b9dcf3'],hill:['#7ea36c','#5f8550'],surf:'#6f8f45',g:['#6a5136','#2f2217'],rock:'#8d8273',stars:0,haze:null},
 {sky:['#4a3022','#9b6a49','#e2b384'],hill:['#a35c38','#7d4026'],surf:'#b8673e',g:['#9a4f2e','#3e1d10'],rock:'#7a4027',stars:0,haze:null},
 {sky:['#000','#020203','#07070a'],hill:['#8a8a87','#6d6d6a'],surf:'#a3a29e',g:['#7c7b77','#2c2c2a'],rock:'#bdbcb7',stars:1,haze:null,earth:true},
 {sky:['#020309','#050a1a','#16264a'],hill:['#d9cbb6','#b4a48c'],surf:'#e3d3b6',g:['#b9a688','#463a2c'],rock:'#a8957a',stars:1,haze:'rgba(110,160,255,'},
 {sky:['#000','#010101','#050506'],hill:['#5a5754','#45423f'],surf:'#6b6864',g:['#4f4c49','#1b1a19'],rock:'#86827d',stars:1,haze:null}];
// static per-panel random data
for(const [i,w] of WORLDS.entries()){const r=rnd(77+i*131);w.lk=LOOK[i];
 w.stars=[];for(let k=0;k<70;k++)w.stars.push([w.x0+r()*(w.x1-w.x0),r()*GY,r()*1.3+.3,r()]);
 w.rocks=[];const span=i==4?26:14;for(let k=0;k<160;k++){const xm=(r()*2-1)*span;const sz=Math.pow(r(),2.6)*0.32+0.02;w.rocks.push([xm,sz,r(),r()])}
 w.deep=[];for(let k=0;k<60;k++)w.deep.push([(r()*2-1)*span,r()*4+0.2,Math.pow(r(),2)*0.25+0.03,r()]);
 w.hp=[r()*10,r()*10,r()*10];}
function hillY(w,px,s){const z=Math.pow(s/S0,0.35),u=(px-w.cx)/60;const p=w.hp;
 const n=Math.sin(u*0.9+p[0])*0.5+Math.sin(u*2.1+p[1])*0.28+Math.sin(u*4.7+p[2])*0.12;return GY-(70+42*n)*z-12}
function panel(w,s){const lk=w.lk;x.save();x.beginPath();x.rect(w.x0,0,w.x1-w.x0,H);x.clip();
 let g=x.createLinearGradient(0,0,0,GY);g.addColorStop(0,lk.sky[0]);g.addColorStop(.55,lk.sky[1]);g.addColorStop(1,lk.sky[2]);x.fillStyle=g;x.fillRect(w.x0,0,w.x1-w.x0,GY);
 if(lk.stars){for(const st of w.stars){x.globalAlpha=.35+.6*st[3];x.fillStyle='#fff';x.beginPath();x.arc(st[0],st[1],st[2],0,7);x.fill()}x.globalAlpha=1}
 if(lk.earth){const ex=w.cx+42,ey=880,er=15;const eg=x.createRadialGradient(ex-5,ey-5,2,ex,ey,er);eg.addColorStop(0,'#cfe6ff');eg.addColorStop(.6,'#3d7cc9');eg.addColorStop(1,'#123a6e');
  x.fillStyle=eg;x.beginPath();x.arc(ex,ey,er,0,7);x.fill();x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.arc(ex+6,ey,er,-Math.PI/2,Math.PI/2);x.ellipse(ex+6,ey,er*0.35,er,0,Math.PI/2,-Math.PI/2,false);x.fill()}
 if(lk.haze){const hg=x.createLinearGradient(0,GY-260,0,GY);hg.addColorStop(0,lk.haze+'0)');hg.addColorStop(.7,lk.haze+'.16)');hg.addColorStop(1,lk.haze+'.30)');x.fillStyle=hg;x.fillRect(w.x0,GY-260,w.x1-w.x0,260)}
 // distant hills
 x.fillStyle=lk.hill[0];x.beginPath();x.moveTo(w.x0,GY);for(let px=w.x0;px<=w.x1+4;px+=4)x.lineTo(px,hillY(w,px,s));x.lineTo(w.x1,GY);x.fill();
 x.fillStyle=lk.hill[1];x.beginPath();x.moveTo(w.x0,GY);for(let px=w.x0;px<=w.x1+4;px+=4)x.lineTo(px,GY-(GY-hillY(w,px*1.7+33,s))*0.45);x.lineTo(w.x1,GY);x.fill();
 // ground cut-away
 g=x.createLinearGradient(0,GY,0,H);g.addColorStop(0,lk.g[0]);g.addColorStop(1,lk.g[1]);x.fillStyle=g;x.fillRect(w.x0,GY,w.x1-w.x0,H-GY);
 for(const d of w.deep){const px=w.cx+d[0]*s,py=GY+d[1]*s,rr=d[2]*s;if(py-rr>H)continue;x.fillStyle='rgba(0,0,0,'+(.10+.12*d[3])+')';x.beginPath();x.ellipse(px,py,rr*1.4,rr,0,0,7);x.fill()}
 x.fillStyle=lk.surf;x.fillRect(w.x0,GY-2,w.x1-w.x0,Math.max(5,0.06*s));
 for(const r of w.rocks){const px=w.cx+r[0]*s,rr=r[1]*s;if(px+rr*1.5<w.x0||px-rr*1.5>w.x1||rr<0.8)continue;
  x.fillStyle=lk.rock;x.globalAlpha=.75+.25*r[2];x.beginPath();x.ellipse(px,GY,rr*1.5,rr*(0.6+0.4*r[3]),0,Math.PI,0);x.fill();
  x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.ellipse(px-rr*.4,GY-rr*.35,rr*.55,rr*.22,0,0,7);x.fill();x.globalAlpha=1}
 x.restore();}
function fig(c,w,j,s){const J=joints(j);const P2=p=>[w.cx+p[0]*s,GY-p[1]*s];
 const bp=j.pose.slice();bp[1]-=.16;bp[2]+=.06;bp[3]-=.32;const JB=joints({hip:j.hip,pose:bp});
 const lw={leg:.135*s,arm:.105*s,tor:.25*s};
 function limbs(K,col,ow){c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';
  const seg=(pts,wd)=>{c.lineWidth=wd+ow;c.beginPath();const a=P2(pts[0]);c.moveTo(a[0],a[1]);for(let i=1;i<pts.length;i++){const b=P2(pts[i]);c.lineTo(b[0],b[1])}c.stroke()};
  seg([K.hip,K.knee,K.ank],lw.leg);seg([K.heel,K.toe],lw.leg*.75);seg([K.sh,K.el,K.hand],lw.arm);}
 function body(col,ow){c.strokeStyle=col;c.lineCap='round';c.lineWidth=lw.tor+ow;c.beginPath();let a=P2(J.hip),b=P2(J.sh);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();
  const h=P2(J.hd);c.fillStyle=col;c.beginPath();c.arc(h[0],h[1],B.head*s+ow/2,0,7);c.fill();}
 const O=Math.max(2.5,0.035*s);
 limbs(JB,'#1b2230',O);limbs(JB,'#aab3c0',0);
 body('#1b2230',O);limbs(J,'#1b2230',O);body('#f3f5f8',0);limbs(J,'#f3f5f8',0);
 // light from the upper left: soft shade on the right of the torso
}
function shadow(w,j,s){const hf=Math.max(0,j.hip-legH(j.pose));const k=1/(1+hf*0.9);x.fillStyle='rgba(0,0,0,'+(0.38*k)+')';
 x.beginPath();x.ellipse(w.cx+0.05*s,GY+1,0.42*s*(0.55+0.45*k),Math.max(2,0.07*s*(0.6+0.4*k)),0,0,7);x.fill()}
function txt(s,px,py,size,align,col,alpha,weight){if(alpha<=0.01)return;x.save();x.globalAlpha=cl(alpha);x.font=(weight||800)+' '+size+'px '+FNT;x.textAlign=align||'center';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=14;x.fillText(s,px,py);x.shadowBlur=4;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,weight){x.font=(weight||800)+' '+size+'px '+FNT;const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const ACC='#ffd166',CX=495;
function cards(t){for(const c of CARDS){if(t<c.a||t>=c.b)continue;const al=Math.min(c.a<=0?1:ease((t-c.a)/.3),c.b>=D?1:ease((c.b-t)/.28));
 const sz=Math.min(fit(c.l[0],68,860),fit(c.l[1],68,860));txt(c.l[0],CX,412,sz,'center','#fff',al);txt(c.l[1],CX,412+sz*1.12,sz,'center',ACC,al);
 if(c.foot)txt(c.foot,CX,548,28,'center','#d6dbe3',al*0.95,600);}}
function draw(t){const s=scale(t);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
 for(const w of WORLDS)panel(w,s);
 // ruler every 5 m (appears as the camera pulls back)
 const ra=cl((110-s)/30);if(ra>0){x.save();x.beginPath();x.rect(0,735,W,GY-735-4);x.clip();x.setLineDash([10,10]);x.lineWidth=2;
  for(let m=5;m<=25;m+=5){const y=GY-m*s;if(y<735)continue;x.strokeStyle='rgba(255,255,255,'+(0.28*ra)+')';x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();txt(m+' m',66,y-10,28,'left','#e8edf3',0.9*ra*cl((y-10-28-750)/30),700)}
  x.restore()}
 // panel dividers
 for(let i=1;i<WORLDS.length;i++){const px=WORLDS[i].x0;x.fillStyle='rgba(0,0,0,.65)';x.fillRect(px-2,0,4,H);x.fillStyle='rgba(255,255,255,.10)';x.fillRect(px+2,0,1,H)}
 for(const w of WORLDS)shadow(w,jumper(w,t),s);
 // soft glow behind small figures so they stay visible when the camera pulls back
 const ga=cl((95-s)/35);if(ga>0)for(const w of WORLDS){const j=jumper(w,t);const cy=GY-(j.hip+0.35)*s;const R=Math.max(1.6*s,46);
  const gg=x.createRadialGradient(w.cx,cy,0,w.cx,cy,R);gg.addColorStop(0,'rgba(255,240,200,'+(0.32*ga)+')');gg.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=gg;x.beginPath();x.arc(w.cx,cy,R,0,7);x.fill()}
 // figures with motion blur (4 sub-frames over half a frame)
 lx.clearRect(0,0,W,H);const NS=4;
 for(let k=0;k<NS;k++){const tt=t+((k+0.5)/NS-0.5)*0.5/FPS;tx.clearRect(0,0,W,H);const ss=scale(tt);for(const w of WORLDS)fig(tx,w,jumper(w,tt),ss);
  lx.globalCompositeOperation='lighter';lx.globalAlpha=1/NS;lx.drawImage(T,0,0)}
 lx.globalAlpha=1;lx.globalCompositeOperation='source-over';x.drawImage(L,0,0);
 // top readability band
 let g=x.createLinearGradient(0,250,0,760);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.25,'rgba(0,0,0,.38)');g.addColorStop(.8,'rgba(0,0,0,.30)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,250,W,510);
 // headers
 const fin=1-ease((t-30.95)/0.5);
 for(const w of WORLDS){const cx=w.cx;txt(w.name,cx,612,34,'center','#fff',1,800);
  const el=cl(t-TL,0,w.T),run=t>=TL&&t<w.tD,done=t>=w.tD;
  const col=run?ACC:(done?'#ffffff':'#c9ced6');const al=run?1:(done?0.92:0.6);
  if(t>30.95){txt(fmtT(el),cx,660,38,'center',col,al*fin,800);txt(fmtT(0),cx,660,38,'center','#c9ced6',0.6*(1-fin),800)}
  else txt(fmtT(el),cx,660,38,'center',col,al,800);
  const ha=(t>=w.tA?ease((t-w.tA)/0.3):0)*fin;txt(fmtH(w.h),cx,702,28,'center','#9df0bf',ha,700);}
 // recap chips
 for(const w of WORLDS){if(t<w.chipT)continue;const k=cl((t-w.chipT)/0.35),pop=1+0.25*Math.sin(Math.PI*k)*(1-k)*2;const al=ease(k)*(1-ease((t-CHIP_OUT)/0.3));if(al<=0)continue;
  x.save();x.translate(w.cx,985);x.scale(pop,pop);x.globalAlpha=al;x.fillStyle='rgba(8,12,22,.72)';const bw=150,bh=64;x.beginPath();x.roundRect(-bw/2,-bh/2-14,bw,bh,14);x.fill();
  x.strokeStyle='rgba(255,209,102,.85)';x.lineWidth=3;x.stroke();x.restore();txt(w.pct,w.cx,985+4+(pop-1)*0,44,'center',ACC,al,800);}
 cards(t);
 // vignette
 g=x.createRadialGradient(540,960,500,540,960,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);}
window.TEXREADY=true;
</script>
