<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- shout-four-worlds (series "Who Lands / Wins First?"): the same shout to a friend 100 m away on Venus, Earth, Mars and the Moon.
     Thought experiment ("imagine"), no suits drawn. Wave fronts move at the surface speed of sound of each world:
     Venus ~409 m/s (Petculescu & Lueptow 2007, Icarus 186: 100 Hz wavelength 4.09 m), Earth 343 m/s and Mars 240 m/s (NASA/JPL, Perseverance 2022),
     Moon: no air, no sound. Slowed 20x: video seconds = 20 x real seconds. Distances share one scale (6.2 px per m). People are drawn bigger than scale. -->
<script>
const W=1080,H=1920,FPS=30,D=25.5,LOOP=25.0,SLOW=20,T0=-1.0,DIST=100,PXM=6.2,PS=0.8;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)};
const X0=60,X1=930,SX=200,FX=SX+DIST*PXM; // shouter mouth x, friend ear x
const ROWS=[590,805,1020,1235],RH=203;
const WD=[
 {n:'VENUS',v:409,sky:['#5a300c','#a8641c','#d9a04a'],gr:['#5b3a1f','#2c1a0c'],tag:'≈410 m/s',sub:'very hot air',tc:3.89},
 {n:'EARTH',v:343,sky:['#123c70','#3f7fc0','#8cc0ea'],gr:['#3c7a2c','#1b3d14'],tag:'343 m/s',sub:'',tc:4.83},
 {n:'MARS',v:240,sky:['#5c3420','#a8704a','#d2a27a'],gr:['#8a3e1e','#3e180a'],tag:'240 m/s',sub:'cold air',tc:7.33},
 {n:'MOON',v:0,sky:['#000','#03040a','#080a12'],gr:['#9a9892','#3a3936'],tag:'NO AIR',sub:'no sound',tc:null}];
for(const w of WD){w.ta=w.v?DIST/w.v:null;w.ua=w.v?T0+SLOW*w.ta:null}
window.MODEL=WD.map(w=>[w.n,w.ta&&w.ta.toFixed(3),w.ua&&w.ua.toFixed(2)]);
const REVEAL=[5.2,11.4,13.7,17.4]; // when the voice names each world (colour + speed tag)
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const STARS=[];{const r=rnd(91);for(let k=0;k<380;k++)STARS.push([r()*W,r()*H,r()*1.6+.3,r()])}
const MSTARS=[];{const r=rnd(12);for(let k=0;k<70;k++)MSTARS.push([X0+r()*(X1-X0),r()*(RH-60),r()*1.4+.4,r()])}
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=18;x.fillText(s,px,py);x.shadowBlur=5;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function person(px,gy,face,col,mouth,hear,hop,t){// face: +1 right, -1 left
 x.save();x.translate(px,gy-hop);x.scale(face*PS,PS);
 x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(0,hop+2,30,7,0,0,7);x.fill();
 x.fillStyle='#1d2330';x.beginPath();x.roundRect(-13,-52,11,52,5);x.fill();x.beginPath();x.roundRect(2,-52,11,52,5);x.fill(); // legs
 x.fillStyle=col;x.beginPath();x.roundRect(-20,-104,40,58,14);x.fill(); // body
 x.fillStyle='#f2c9a0';x.beginPath();x.arc(2,-128,22,0,7);x.fill(); // head
 x.fillStyle='#2a1c14';x.beginPath();x.arc(0,-136,22,Math.PI*1.05,Math.PI*1.95);x.fill(); // hair
 x.fillStyle='#1a1a1a';x.beginPath();x.arc(12,-131,2.6,0,7);x.fill(); // eye
 if(mouth>0){x.fillStyle='#5a1a1a';x.beginPath();x.ellipse(20,-118,3+4*mouth,3+5*mouth,0,0,7);x.fill();
  x.strokeStyle=col;x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(8,-96);x.lineTo(26,-108);x.lineTo(30,-124);x.stroke()} // cupped hand
 else{x.fillStyle='#3a2020';x.fillRect(14,-117,9,3)}
 if(hear>0){x.strokeStyle=col;x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(-8,-96);x.lineTo(-26,-116);x.lineTo(-14,-130);x.stroke()} // hand to ear
 else{x.strokeStyle=col;x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(-14,-96);x.lineTo(-22,-60);x.stroke()}
 x.restore()}
function row(i,w,u,t){const y0=ROWS[i],gy=y0+RH-28;
 x.save();x.beginPath();x.roundRect(X0,y0,X1-X0,RH,18);x.clip();
 let g=x.createLinearGradient(0,y0,0,gy);g.addColorStop(0,w.sky[0]);g.addColorStop(.6,w.sky[1]);g.addColorStop(1,w.sky[2]);x.fillStyle=g;x.fillRect(X0,y0,X1-X0,RH);
 if(i==3){for(const s of MSTARS){x.globalAlpha=.4+.5*s[3];x.fillStyle='#fff';x.beginPath();x.arc(s[0],y0+s[1],s[2],0,7);x.fill()}x.globalAlpha=1;
}
 if(i==0){const hz=x.createLinearGradient(0,y0,0,gy);hz.addColorStop(0,'rgba(255,200,120,0)');hz.addColorStop(1,'rgba(255,210,130,.18)');x.fillStyle=hz;x.fillRect(X0,y0,X1-X0,RH)}
 g=x.createLinearGradient(0,gy,0,y0+RH);g.addColorStop(0,w.gr[0]);g.addColorStop(1,w.gr[1]);x.fillStyle=g;x.fillRect(X0,gy,X1-X0,RH);
 x.fillStyle='rgba(255,255,255,.18)';x.fillRect(X0,gy,X1-X0,2);
 // 100 m ruler on the ground
 x.save();x.setLineDash([10,10]);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.beginPath();x.moveTo(SX+10,gy+16);x.lineTo(FX-10,gy+16);x.stroke();x.restore();
 txt('100 m',(SX+FX)/2,gy+24,17,'rgba(255,255,255,.75)',1,'Mont');
 // sound waves
 const tr=(u-T0)/SLOW;const arrived=w.ua!==null&&u>=w.ua;const my=gy-118*PS;
 if(w.v&&u>T0){const R=w.v*tr*PXM;
  for(let k=0;k<4;k++){const r=R-k*46;if(r<=4)continue;const fade=k==0?1:.75-.17*k;const pass=r>FX-SX+30?cl(1-(r-(FX-SX+30))/120):1;if(pass<=0)continue;
   x.globalAlpha=fade*pass;x.strokeStyle=k==0?'rgba(255,255,255,.95)':'rgba(255,255,255,.7)';x.lineWidth=k==0?6:4;
   x.beginPath();x.arc(SX,my,r,-0.62,0.62);x.stroke()}x.globalAlpha=1}
 // Moon: the mouth moves but nothing leaves it
 const shouting=u>T0-0.25&&u<T0+3.2;const mo=shouting?.6+.4*Math.sin((u-T0)*9):0;
 person(SX-24,gy,1,i==3?'#c8ccd4':'#e0574a',mo,0,0,t);
 const ka=arrived?u-w.ua:-1;const hop=ka>=0?18*Math.sin(Math.PI*cl(ka/.35)):0;
 person(FX+14,gy,-1,i==3?'#c8ccd4':'#4a8fe0',0,ka>=0?1:0,hop,t);
 if(ka>=0){const pa=ease(ka/.12)*(1-ease((ka-1.0)/.3));txt('!',FX+52,gy-78-hop,50,'#fff',pa,'Anton')}
 if(i==3&&t>=REVEAL[3]&&t<LOOP){const qa=ease((t-REVEAL[3]-.3)/.25);txt('?',FX+52,gy-78,50,'#fff',qa,'Anton')}
 x.restore();
 // label + timer
 const rv=t>=REVEAL[i]&&t<LOOP;const ra=rv?ease((t-REVEAL[i])/.25):0;
 txt(w.n,X0+18,y0+48,40,'#fff',1,'Anton','left');
 const tshow=u<=T0?0:(arrived?w.ta:tr);const tl=arrived?tshow.toFixed(2)+' s':tshow.toFixed(2)+' s';
 const gold=i==0&&rv;const col=gold?'#ffd166':(arrived?'#fff':'rgba(235,240,248,.85)');const pop=arrived?1+0.25*Math.exp(-(u-w.ua)/.12):1;
 if(i<3)txt(tl,X1-16,y0+48,42*pop,col,1,'Anton','right');
 else{const nv=t>=REVEAL[3]&&t<LOOP;txt(nv?'NEVER':tl,X1-16,y0+48,(nv?44*(1+.25*Math.exp(-(t-REVEAL[3])/.12)):42),nv?'#ff9b8a':'rgba(235,240,248,.85)',1,'Anton','right')}
 if(arrived&&i<3){const rk=['1ST','2ND','3RD'][i];txt(rk,X1-130,y0+46,26,gold?'#ffd166':'rgba(255,255,255,.85)',ease((u-w.ua)/.2),'Mont','right')}
 txt(w.tag+(w.sub?' · '+w.sub:''),(SX+FX)/2,y0+52,30,i==0?'#ffe3a0':(i==3?'#ffb8ab':'#eaf3ff'),ra,'Mont');
 if(gold){x.save();x.globalAlpha=.75*ease((t-REVEAL[0])/.3);x.strokeStyle='#ffd166';x.lineWidth=5;x.beginPath();x.roundRect(X0+2,y0+2,X1-X0-4,RH-4,16);x.stroke();x.restore()}}
const CARDS=[[0,5.2,'SAME SHOUT, 4 WORLDS','WHO HEARS IT FIRST?'],[5.2,11.4,'VENUS WINS','HOT AIR = FASTEST'],
 [11.4,17.4,'EARTH 343 m/s','MARS ONLY 240 m/s'],[17.4,21.9,'THE MOON: NO AIR','SO NO SOUND AT ALL'],[21.9,23.2,'DID YOU','GUESS RIGHT?'],
 [23.2,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'SAME SHOUT, 4 WORLDS','WHO HEARS IT FIRST?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,820),l2?fit(l2,80,820):99);const pop=(l1.startsWith('VENUS')||l1.startsWith('THE MOON'))?1+0.08*Math.exp(-(t-a)/.15):1;
 txt(l1,495,404,sz*pop,'#fff',al);if(l2)txt(l2,495,404+sz*1.06,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03040b');g.addColorStop(.5,'#070b1a');g.addColorStop(1,'#02030a');x.fillStyle=g;x.fillRect(0,0,W,H);
 g=x.createRadialGradient(760,500,40,760,500,700);g.addColorStop(0,'rgba(90,60,140,.22)');g.addColorStop(1,'rgba(90,60,140,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of STARS){x.globalAlpha=(.25+.6*s[3])*(.7+.3*Math.sin(t*1.3+s[3]*40));x.fillStyle='#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}x.globalAlpha=1;
 const u=t>=LOOP?t-D:t;
 for(let i=0;i<4;i++)row(i,WD[i],u,t);
 cards(t);
 txt('IMAGINE: friend 100 m away · slowed 20x',495,524,25,'#eef2f8',1,'Mont');
 const tr=u<=T0?0:(u-T0)/SLOW;txt('REAL TIME '+tr.toFixed(2)+' s',495,570,30,'#cfe6ff',t>=LOOP-1.5&&t<LOOP?0:1,'Mont');
 g=x.createRadialGradient(540,1000,600,540,1000,1300);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');x.fillStyle=g;x.fillRect(0,0,W,H);}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
