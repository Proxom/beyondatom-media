<script id=fs type=x-shader>
precision highp float;
uniform vec2 R;uniform vec3 SUN,CP;uniform mat3 CM;uniform float FOV,FY,SP,BAND;uniform sampler2D TEX,CLD;
float h1(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.x+p.y)*p.z);}
vec3 sky(vec3 d){vec3 c=vec3(0.);for(int l=0;l<2;l++){float sc=l==0?160.:320.;vec3 q=d*sc;vec3 id=floor(q);float hs=h1(id+float(l)*7.);
 if(hs>.9){vec3 sp=id+.5+.35*(vec3(h1(id+1.),h1(id+2.),h1(id+3.))-.5);float dd=length(q-sp);
  c+=pow(hs-.9,1.5)*40.*exp(-dd*dd*30.)*mix(vec3(1.,.85,.7),vec3(.75,.85,1.),h1(id+9.));}}return c;}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.x;vec3 rd=normalize(CM*vec3(uv*FOV,-1.));vec3 ro=CP;
 vec3 S=vec3(1.,1./FY,1.);vec3 o=ro*S,d=rd*S;float a=dot(d,d),b=dot(o,d),c=dot(o,o)-1.,h=b*b-a*c;
 vec3 col=sky(rd);
 // atmosphere halo (scaled space distance of closest approach)
 float tc=-b/a;vec3 cp=o+d*tc;float dd=length(cp);vec3 wp=(ro+rd*tc);float lit=smoothstep(-.4,.6,dot(normalize(wp),SUN));
 if(tc>0.)col+=vec3(.3,.55,1.)*exp(-max(dd-1.,0.)*28.)*.35*(.15+.85*lit);
 if(h>0.){float t=(-b-sqrt(h))/a;vec3 pos=ro+rd*t;vec3 q=pos*S;vec3 n=normalize(vec3(pos.x,pos.y/(FY*FY),pos.z));
  float lon=atan(q.x,q.z)-SP;vec2 tu=vec2(fract(lon/6.28318+.5),acos(clamp(q.y,-1.,1.))/3.14159);
  vec3 al=pow(texture2D(TEX,tu).rgb,vec3(1.9))*1.45;float cl=texture2D(CLD,tu).a;al=mix(al,vec3(.97),smoothstep(.04,.75,cl)*.85);
  float ndl=dot(n,SUN);float dif=smoothstep(-.08,.35,ndl)*max(ndl+.08,0.)/1.08;float mu=max(dot(n,-rd),0.);dif*=.55+.45*pow(mu,.4);
  col=al*(dif*1.3+.035);
  col+=vec3(.3,.55,1.)*pow(1.-mu,3.)*smoothstep(-.2,.5,ndl)*.6;
  col=mix(col,vec3(1.,.72,.25)*(.35+dif),BAND*.55*exp(-pow(q.y/.16,2.)));}
 col=1.-exp(-col*1.1);gl_FragColor=vec4(col,1.);}
</script>
<script src="tex.js"></script><script>

const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const lerp=(a,b,t)=>a+(b-a)*t,DEG=Math.PI/180;

function look(eye,tgt){const f=norm(tgt.map((v,i)=>v-eye[i]));const r=norm(cross(f,[0,1,0]));const u=cross(r,f);return [r[0],r[1],r[2],u[0],u[1],u[2],-f[0],-f[1],-f[2]]}
const F='"DejaVu Sans",Arial,sans-serif';
let CAM=null;function proj(p){const m=CAM.m,e=CAM.e;const d=[p[0]-e[0],p[1]-e[1],p[2]-e[2]];
 const xr=d[0]*m[0]+d[1]*m[1]+d[2]*m[2],yu=d[0]*m[3]+d[1]*m[4]+d[2]*m[5],zf=-(d[0]*m[6]+d[1]*m[7]+d[2]*m[8]);return [W/2+xr/zf/CAM.fov*W,H/2-yu/zf/CAM.fov*W]}
function hidden(p,fy){const e=CAM.e;const d=[p[0]-e[0],p[1]-e[1],p[2]-e[2]];const o=[e[0],e[1]/fy,e[2]],dv=[d[0],d[1]/fy,d[2]];
 const a=dv[0]**2+dv[1]**2+dv[2]**2,b=o[0]*dv[0]+o[1]*dv[1]+o[2]*dv[2],c=o[0]**2+o[1]**2+o[2]**2-1,h=b*b-a*c;if(h<0)return false;const t=(-b-Math.sqrt(h))/a;return t>0&&t<1;}

 gl.uniform1f(U('FOV'),s.fov);gl.uniform1f(U('FY'),s.fy);gl.uniform1f(U('SP'),s.spin);gl.uniform1f(U('BAND'),s.band||0);gl.drawArrays(gl.TRIANGLES,0,3);
 x.globalCompositeOperation='source-over';x.globalAlpha=1;x.filter='none';x.drawImage(g,0,0);
 x.save();x.globalCompositeOperation='lighter';x.filter='blur(36px)';x.globalAlpha=.25;x.drawImage(g,0,0);x.restore();
 const vg=x.createRadialGradient(W/2,H*.52,H*.3,W/2,H*.52,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 SC.overlay(t);};
