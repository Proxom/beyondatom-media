   x.strokeStyle='rgba(255,'+(170+60*k|0)+','+(90+60*k|0)+','+(0.35+0.55*k)+')';x.lineWidth=3+3*k;x.shadowColor='#ffb14a';x.shadowBlur=10;x.beginPath();x.moveTo(a[i0][0],a[i0][1]);for(let i=i0+1;i<=i1;i++)x.lineTo(a[i][0],a[i][1]);x.stroke()}x.restore();}

 {const fa=t<3.6?1:t<4.4?1-ease((t-3.6)/.8):t<22.6?0:t<23.4?ease((t-22.6)/.8):1;if(fa>0)LBL.push(['FOUND 1930',dm[0]+30,dm[1]-24,0.9*fa,'#ffffff',26,'left']);} // label only while Pluto is near it
