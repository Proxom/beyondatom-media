<!doctype html><meta charset=utf8><body style="margin:0;background:#000">
<canvas id=c width=1080 height=1920></canvas>
<!-- gravity-limit: "How much gravity can a human survive?" Sequel in the look of jump-five-worlds (same figure).
 One 70 kg person on Earth -> Neptune -> Jupiter -> the Sun -> a neutron star. Original 2D canvas animation; scenery illustrative.
 Facts (checked 8 Nov 2026):
  NSSDC fact sheets: Earth standard g 9.80665 m/s^2; Neptune 11.27 m/s^2 (mean, 1 bar) = 1.15 g, mass 17.15 Earths;
   Jupiter 25.92 m/s^2 (mean, 1 bar) = 2.64 g; Sun 274.0 m/s^2 = 28.0 g; gas giants: gravity at the 1 bar level, no known surface.
  NASA Goddard (Strohmayer): neutron star surface gravity about one hundred billion times Earth's.
  FAA AC 91-61 (1,000 Naval aviators): grayout 4.1 G, blackout 4.7 G, unconsciousness 5.4 G (average, relaxed).
  USAF AFPAM 11-419: G > 1 pulls blood down to the lower body -> less blood to brain and eyes; AGSM + anti-G suit give over 9 G.
  FAA G-force brochure: the heart beats harder and faster to keep blood flowing toward the head.
  NASA NTRS 20120000085: a 1961 US Navy study, a person remained at 2.0 g for 24 hours. -->
<script>
const W=1080,H=1920,D=30.0,FPS=30;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},lerp=(a,b,k)=>a+(b-a)*k;
const FNT='"DejaVu Sans",Arial,sans-serif';
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const GY=1370,CXF=470,S=300;            // ground line, figure x, px per metre
const ACC='#ffd166',RED='#ff6b5a',CX=495;
// worlds: [start, end) in seconds. Hook (t<2.6 and t>=29.4) shows the Sun collapse.
const WL={
 earth:{name:'EARTH',g:1.0,gl:'1 g'},
 neptune:{name:'NEPTUNE',g:1.15,gl:'1.15 g'},
 jupiter:{name:'JUPITER',g:2.64,gl:'2.64 g'},
 sun:{name:'THE SUN',g:28.0,gl:'28 g'},
 ns:{name:'NEUTRON STAR',g:1e11,gl:'100 BILLION g'}};
const SEG=[[-1,2.6,'sun',17.0],[2.6,6.6,'earth',0],[6.6,10.8,'neptune',0],[10.8,17.0,'jupiter',0],[17.0,23.2,'sun',0],[23.2,29.4,'ns',0],[29.4,31,'sun',-29.4+17.0-0.0]];
// hook at t: local sun time = t+HOOKOFF (so the hook shows the collapse in motion); loop tail uses the same mapping (t-D)
const HOOKOFF=1.25;
function seg(t){if(t>=29.4)return {w:'sun',lt:t-D+HOOKOFF,hook:true};if(t<2.6)return {w:'sun',lt:t+HOOKOFF,hook:true};
 for(const s of SEG.slice(1,6))if(t>=s[0]&&t<s[1])return {w:s[2],lt:t-s[0],hook:false};return {w:'sun',lt:0,hook:true}}
// ---------- scenery ----------
const ST=[];{const r=rnd(5);for(let i=0;i<380;i++)ST.push([r()*W,r()*GY,Math.pow(r(),3)*2.2+.35,r()*6.28,r()])}
const GRAN=[];{const r=rnd(9);for(let i=0;i<260;i++)GRAN.push([r()*1400-160,r(),r()*.6+.4,r()*6.28])}
const CLOUD=[];{const r=rnd(13);for(let i=0;i<90;i++)CLOUD.push([r()*1500-200,r(),r()*.7+.3,r()*6.28])}
function stars(t,al,col){x.save();for(const s of ST){const tw=.7+.3*Math.sin(s[3]+t*1.3);x.globalAlpha=al*tw*(.3+.7*s[4]);x.fillStyle=col||'#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}x.restore()}
function hills(seed,c1,c2,amp){const r=rnd(seed),p=[r()*9,r()*9,r()*9];
 x.fillStyle=c1;x.beginPath();x.moveTo(0,GY);for(let px=0;px<=W+8;px+=8){const u=px/70;x.lineTo(px,GY-12-(70+amp*(Math.sin(u*.9+p[0])*.5+Math.sin(u*2.1+p[1])*.28+Math.sin(u*4.7+p[2])*.12)))}x.lineTo(W,GY);x.fill();
 x.fillStyle=c2;x.beginPath();x.moveTo(0,GY);for(let px=0;px<=W+8;px+=8){const u=px/45;x.lineTo(px,GY-8-(28+amp*.4*(Math.sin(u*1.3+p[1])*.6+Math.sin(u*3.1+p[0])*.3)))}x.lineTo(W,GY);x.fill()}
function grad(y0,y1,stops){const g=x.createLinearGradient(0,y0,0,y1);stops.forEach((c,i)=>g.addColorStop(i/(stops.length-1),c));return g}
function scene(w,lt,t){
 if(w==='earth'){x.fillStyle=grad(0,GY,['#1f5fae','#5f9bd6','#b9dcf3']);x.fillRect(0,0,W,GY);
  x.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<4;i++){const cx=((i*310+lt*14)%1400)-160,cy=420+i*120;x.beginPath();x.ellipse(cx,cy,120,26,0,0,7);x.ellipse(cx+70,cy-14,80,24,0,0,7);x.fill()}
  hills(3,'#7ea36c','#5f8550',42);x.fillStyle=grad(GY,H,['#6a5136','#2f2217']);x.fillRect(0,GY,W,H-GY);x.fillStyle='#6f8f45';x.fillRect(0,GY-3,W,18);}
 else if(w==='neptune'){x.fillStyle=grad(0,GY,['#04103a','#123a8a','#3f7fd0']);x.fillRect(0,0,W,GY);stars(t,.25);
  for(const c of CLOUD){const yy=GY-60+c[1]*(H-GY+60),cx=((c[0]+lt*30*c[2])%1500)-200;x.fillStyle='rgba('+(140+60*c[1]|0)+','+(190+40*c[1]|0)+',255,'+(.10+.10*c[2])+')';x.beginPath();x.ellipse(cx,yy,200*c[2],30*c[2],0,0,7);x.fill()}
  x.fillStyle=grad(GY,H,['#2c62b8','#0b2560']);x.fillRect(0,GY,W,H-GY);x.fillStyle='rgba(200,230,255,.35)';x.fillRect(0,GY-2,W,6);
  for(let i=0;i<7;i++){x.fillStyle='rgba(180,220,255,'+(.08+.04*(i%3))+')';x.fillRect(0,GY+30+i*62+Math.sin(lt+i)*6,W,14+i*2)}}
 else if(w==='jupiter'){x.fillStyle=grad(0,GY,['#3a2416','#8a5a36','#d9a873','#f0d3a6']);x.fillRect(0,0,W,GY);
  for(let i=0;i<9;i++){const yy=300+i*120;x.fillStyle=i%2?'rgba(120,60,30,.18)':'rgba(255,235,200,.14)';x.beginPath();x.moveTo(0,yy);for(let px=0;px<=W+10;px+=10)x.lineTo(px,yy+12*Math.sin(px/140+i*1.7+lt*.35));x.lineTo(W,yy+60);x.lineTo(0,yy+60);x.fill()}
  for(const c of CLOUD){const yy=GY-40+c[1]*(H-GY+40),cx=((c[0]+lt*40*c[2])%1500)-200;x.fillStyle='rgba(255,'+(200+40*c[1]|0)+',150,'+(.10+.12*c[2])+')';x.beginPath();x.ellipse(cx,yy,220*c[2],34*c[2],0,0,7);x.fill()}
  x.fillStyle=grad(GY,H,['#c58c55','#5a3519']);x.globalAlpha=.85;x.fillRect(0,GY,W,H-GY);x.globalAlpha=1;x.fillStyle='rgba(255,230,190,.45)';x.fillRect(0,GY-2,W,6)}
 else if(w==='sun'){x.fillStyle=grad(0,GY,['#3a0700','#9a2400','#ff7a10','#ffd27a']);x.fillRect(0,0,W,GY);
  // spicule flicker along the horizon
  for(let i=0;i<60;i++){const px=i*19+((i*37)%11),hh=60+50*Math.sin(i*2.3+lt*2.1)+30*Math.sin(i*.7-lt*1.3);x.fillStyle='rgba(255,220,140,.10)';x.fillRect(px,GY-hh,8,hh)}
  x.fillStyle=grad(GY,H,['#ffcf6a','#e25b00','#6b1400']);x.fillRect(0,GY,W,H-GY);
  for(const c of GRAN){const yy=GY+8+Math.pow(c[1],1.4)*(H-GY),sz=(14+70*c[1])*c[2],px=((c[0]+lt*6)%1400)-160,pul=.75+.25*Math.sin(c[3]+lt*1.7);
   const g=x.createRadialGradient(px,yy,0,px,yy,sz);g.addColorStop(0,'rgba(255,240,170,'+(.55*pul)+')');g.addColorStop(1,'rgba(255,140,20,0)');x.fillStyle=g;x.beginPath();x.ellipse(px,yy,sz*1.3,sz*.55,0,0,7);x.fill()}
  const gl=x.createRadialGradient(CXF,GY,40,CXF,GY,900);gl.addColorStop(0,'rgba(255,240,180,.35)');gl.addColorStop(1,'rgba(255,160,40,0)');x.fillStyle=gl;x.fillRect(0,0,W,H)}
 else if(w==='ns'){x.fillStyle='#000';x.fillRect(0,0,W,H);stars(t,.9,'#dfe8ff');
  // tiny world: strongly curved, glowing blue-white horizon
  const R=1500,cy=GY+R-10;const g=x.createRadialGradient(CXF,cy,R-40,CXF,cy,R+140);g.addColorStop(0,'rgba(150,190,255,.55)');g.addColorStop(1,'rgba(80,120,255,0)');x.fillStyle=g;x.beginPath();x.arc(CXF,cy,R+140,0,7);x.fill();
  const s=x.createRadialGradient(CXF-200,GY,50,CXF,cy,R);s.addColorStop(0,'#ffffff');s.addColorStop(.08,'#cfe0ff');s.addColorStop(.3,'#6f86c4');s.addColorStop(1,'#1a2448');x.fillStyle=s;x.beginPath();x.arc(CXF,cy,R,0,7);x.fill();}
}
// ---------- figure (same build as jump-five-worlds) ----------
const B={thigh:.45,shin:.45,ank:.07,torso:.56,neck:.08,head:.125,ua:.30,fa:.28,foot:.2};
const P={stand:[.04,0,0,.08,.15],nep:[.08,.12,-.1,.06,.2],jup:[.42,.62,-.5,.05,.12],kneel:[.35,.15,-1.5,.3,.2],flat:[0,.05,-.05,.15,.05]};
const mix=(a,b,k)=>a.map((v,i)=>lerp(v,b[i],k));
const legH=p=>B.thigh*Math.cos(p[1])+B.shin*Math.cos(p[2])+B.ank;
function joints(p,hy){const hip=[0,hy];const knee=[B.thigh*Math.sin(p[1]),hy-B.thigh*Math.cos(p[1])];
 const ank=[knee[0]+B.shin*Math.sin(p[2]),knee[1]-B.shin*Math.cos(p[2])];const heel=[ank[0]-.05,ank[1]-B.ank],toe=[ank[0]+B.foot*.85,ank[1]-B.ank];
 const sh=[B.torso*Math.sin(p[0]),hy+B.torso*Math.cos(p[0])];const hd=[sh[0]+(B.neck+B.head)*Math.sin(p[0]*1.1),sh[1]+(B.neck+B.head)*Math.cos(p[0]*1.1)];
 const el=[sh[0]+B.ua*Math.sin(p[3]),sh[1]-B.ua*Math.cos(p[3])];const ea=p[3]+p[4];const hand=[el[0]+B.fa*Math.sin(ea),el[1]-B.fa*Math.cos(ea)];
 return {hip,knee,ank,heel,toe,sh,hd,el,hand}}
// figure state per world: pose, rotation (rad, + = falls forward/right), squash, x offset
function figState(w,lt){let pose=P.stand,rot=0,sq=1,dx=0,blood=0;
 const br=Math.sin(lt*2*Math.PI/3.2);
 if(w==='earth'){pose=P.stand.slice();pose[3]+=.03*br}
 else if(w==='neptune'){pose=mix(P.stand,P.nep,ease(lt/1.2));blood=.15}
 else if(w==='jupiter'){const k=eio(lt/1.4);pose=mix(P.nep,P.jup,k);const tr=.015*Math.sin(lt*23)*k;pose=pose.map((v,i)=>v+(i<3?tr:0));pose[0]+=.05*Math.sin(lt*2*Math.PI/2.2)*k;blood=.25+.3*k}
 else if(w==='sun'){const k1=eio(lt/.9),k2=eio((lt-.8)/1.3);pose=k2>0?mix(P.kneel,P.flat,k2):mix(P.jup,P.kneel,k1);rot=k2*Math.PI/2;dx=-k2*0.95;blood=.55+.45*k1}
 else if(w==='ns'){pose=P.flat;rot=Math.PI/2;dx=-.95;sq=lerp(1,.035,eio(lt/.35));blood=1}
 return {pose,rot,sq,dx,blood}}
const FC=document.createElement('canvas');FC.width=W;FC.height=H;const fc=FC.getContext('2d');
function figure(st){const p=st.pose,hy=legH(p);const J=joints(p,hy);const bp=p.slice();bp[1]-=.14;bp[2]+=.05;bp[3]-=.28;const JB=joints(bp,legH(bp));
 const P2=q=>[q[0]*S,-q[1]*S],c=fc;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.globalCompositeOperation='source-over';
 c.save();c.translate(CXF+st.dx*S,GY);
 c.translate(0,-st.rot/(Math.PI/2)*0.13*S*st.sq);c.scale(1,st.sq);c.rotate(st.rot);
 const lw={leg:.135*S,arm:.105*S,tor:.25*S},O=Math.max(2.5,.035*S);
 const seg=(pts,wd)=>{c.lineWidth=wd;c.beginPath();let a=P2(pts[0]);c.moveTo(a[0],a[1]);for(let i=1;i<pts.length;i++){const b=P2(pts[i]);c.lineTo(b[0],b[1])}c.stroke()};
 const limbs=(K,col,ow)=>{c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';seg([K.hip,K.knee,K.ank],lw.leg+ow);seg([K.heel,K.toe],lw.leg*.75+ow);seg([K.sh,K.el,K.hand],lw.arm+ow)};
 const body=(col,ow)=>{c.strokeStyle=col;c.lineCap='round';seg([J.hip,J.sh],lw.tor+ow);const h=P2(J.hd);c.fillStyle=col;c.beginPath();c.arc(h[0],h[1],B.head*S+ow/2,0,7);c.fill()};
 limbs(JB,'#1b2230',O);limbs(JB,'#aab3c0',0);body('#1b2230',O);limbs(J,'#1b2230',O);body('#f3f5f8',0);limbs(J,'#f3f5f8',0);
 c.restore();
 // blood pooling toward the feet (along the body axis), head turns pale grey: illustrative tint clipped to the figure
 if(st.blood>0){const k=st.blood;c.save();
  const L=(hy+B.torso+.3)*S,ux=Math.sin(st.rot),uy=-Math.cos(st.rot);const fx=CXF+st.dx*S,fy=GY;
  const g=c.createLinearGradient(fx+ux*L*st.sq,fy+uy*L*st.sq,fx,fy);
  g.addColorStop(0,'rgba(95,105,125,'+(.55*k)+')');g.addColorStop(.42,'rgba(255,255,255,0)');g.addColorStop(.62,'rgba(220,40,40,'+(.25*k)+')');g.addColorStop(1,'rgba(200,20,25,'+(.7*k)+')');
  c.globalCompositeOperation='source-atop';c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();}
 x.drawImage(FC,0,0);
 return {J,hy}}
function shadow(st){const k=st.rot/(Math.PI/2);x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(CXF+st.dx*S*.5+k*.45*S,GY+2,(.42+.7*k)*S,.06*S,0,0,7);x.fill()}
// downward blood arrows next to the body
function arrows(lt,k,top){if(k<=.02)return;x.save();for(let i=0;i<3;i++){const ph=((lt*.9+i/3)%1);const yy=lerp(top,GY-80,ph),al=k*Math.sin(Math.PI*ph);
  for(const sx of [-1,1]){const ax=CXF+sx*(.55*S)+.08*S;x.globalAlpha=al;x.fillStyle=RED;x.beginPath();x.moveTo(ax-16,yy);x.lineTo(ax+16,yy);x.lineTo(ax,yy+26);x.fill();x.fillRect(ax-5,yy-30,10,32)}}x.restore()}
// ---------- text ----------
function txt(s,px,py,size,align,col,alpha,weight){if(alpha<=0.01)return;x.save();x.globalAlpha=cl(alpha);x.font=(weight||800)+' '+size+'px '+FNT;x.textAlign=align||'center';
 x.lineJoin='round';x.strokeStyle='rgba(0,0,0,.85)';x.lineWidth=Math.max(4,size*.12);x.strokeText(s,px,py);x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=12;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,weight){x.font=(weight||800)+' '+size+'px '+FNT;const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const HOOK=['HOW MUCH GRAVITY','CAN YOU SURVIVE?'];
const CARDS=[
 {a:-1,b:2.6,l:HOOK,big:1},
 {a:2.6,b:6.6,l:['EARTH: 1 g','THIS IS NORMAL']},
 {a:6.6,b:8.7,l:['NEPTUNE: 17× THE MASS','OF EARTH...']},
 {a:8.7,b:10.8,l:['BUT ONLY 1.15 g','BARELY HEAVIER'],foot:'at the cloud tops · no solid surface'},
 {a:10.8,b:13.0,l:['JUPITER: 2.64 g','HEART WORKS HARDER'],foot:'at the cloud tops · no solid surface'},
 {a:13.0,b:15.0,l:['BLOOD SINKS','INTO YOUR LEGS']},
 {a:15.0,b:17.0,l:['IN 1961, A PERSON SPENT','24 HOURS AT 2 g'],foot:'US Navy study, 1961'},
 {a:17.0,b:19.0,l:['THE SUN: 28 g','28× YOUR WEIGHT'],foot:'ignoring the 5,500 °C heat'},
 {a:19.0,b:21.1,l:['YOU WOULD PASS OUT','AT ABOUT 5 g'],foot:'tunnel vision ~4 g · average, relaxed, no g-suit'},
 {a:21.1,b:23.2,l:['FIGHTER PILOTS:','~9 g, FOR SECONDS'],foot:'with g-suits and special breathing'},
 {a:23.2,b:26.6,l:['NEUTRON STAR:','100 BILLION g'],foot:'illustration · nothing survives this'},
 {a:26.6,b:29.4,l:['WHERE IS','YOUR LIMIT?']},
 {a:29.4,b:31,l:HOOK,big:1}];
function cards(t){for(const c of CARDS){if(t<c.a||t>=c.b)continue;const al=Math.min(c.a<=0?1:ease((t-c.a)/.25),c.b>=D?1:ease((c.b-t)/.22));
 const base=c.big?78:68,sz=Math.min(fit(c.l[0],base,860,900),fit(c.l[1],base,860,900)),dy=(1-ease((t-c.a)/.3))*14*(c.a>0?1:0);
 txt(c.l[0],CX,420+dy,sz,'center','#fff',al,900);txt(c.l[1],CX,420+sz*1.15+dy,sz,'center',ACC,al,900);
 if(c.foot)txt(c.foot,CX,420+sz*2.15+dy,28,'center','#e6ebf2',al*.95,600)}}
// ---------- g gauge (log scale, right side) ----------
const GX=868,GT=760,GB=1350;
function gNow(t){const s=seg(t);const g=WL[s.w].g;if(s.w==='ns'){return Math.exp(lerp(Math.log(28),Math.log(1e11),eio((s.lt)/2.2)))}
 // smooth climb inside each world from the previous value
 const prev={earth:1,neptune:1,jupiter:1.15,sun:2.64}[s.w];return Math.exp(lerp(Math.log(s.hook?2.64:prev),Math.log(g),eio(s.lt/(s.hook?1.0:.9))))}
function gMax(t){const s=seg(t);if(s.w!=='ns')return 2;return lerp(2,11.3,eio((s.lt-.1)/2.0))}  // log10 of gauge top
function gy(g,top){return GB-(Math.log10(Math.max(1,g))/top)*(GB-GT)}
function gauge(t){const top=gMax(t),g=gNow(t);x.save();
 x.fillStyle='rgba(8,12,22,.62)';x.beginPath();x.roundRect(GX-20,GT-20,40,GB-GT+40,20);x.fill();x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.stroke();
 const yv=gy(g,top);const col=g<3?'#7be0a0':(g<9?ACC:RED);const fg=x.createLinearGradient(0,GB,0,GT);fg.addColorStop(0,'#7be0a0');fg.addColorStop(.5,ACC);fg.addColorStop(1,RED);
 x.fillStyle=fg;x.beginPath();x.roundRect(GX-12,yv,24,GB-yv+8,12);x.fill();
 // ticks
 const ticks=top<3?[[1,'1 g'],[100,'100 g']]:[[1,'1 g'],[1e3,'1,000 g'],[1e6,'1 million g'],[1e9,'1 billion g']];
 for(const [v,l] of ticks){const yy=gy(v,top);if(yy<GT-2)continue;x.fillStyle='rgba(255,255,255,.7)';x.fillRect(GX-30,yy-1.5,14,3);txt(l,GX-38,yy+9,24,'right','#e6ebf2',.85,700)}
 // pilot line at 9 g
 const yp=gy(9,top);if(yp>GT){x.setLineDash([8,7]);x.strokeStyle='rgba(255,107,90,.9)';x.lineWidth=3;x.beginPath();x.moveTo(GX-26,yp);x.lineTo(GX+26,yp);x.stroke();x.setLineDash([]);
  txt('9 g PILOTS',GX-38,yp+9,26,'right',RED,cl((4-top)/1.5),800)}
 // pointer
 x.fillStyle=col;x.beginPath();x.moveTo(GX+22,yv);x.lineTo(GX+42,yv-12);x.lineTo(GX+42,yv+12);x.fill();
 x.restore()}
// ---------- weight readout ----------
function fmtW(kg){if(kg<1e4)return (kg<1000?Math.round(kg):Math.round(kg/10)*10).toLocaleString('en-US')+' kg';const tn=kg/1000;
 if(tn<1e6)return Math.round(tn).toLocaleString('en-US')+' tonnes';if(tn<1e9)return (tn/1e6).toFixed(tn<1e7?1:0)+' million tonnes';return (tn/1e9).toFixed(tn<1e10?1:0).replace('.0','')+' billion tonnes'}
function readout(t){const s=seg(t),g=gNow(t);const kg=s.w==='ns'?70*g:70*WL[s.w].g*(g/WL[s.w].g);
 const val=s.w==='earth'?70:(s.w==='neptune'?(g>=1.149?80.5:70*g):(s.w==='jupiter'&&g>=2.639?185:kg));
 txt('A 70 kg PERSON',90,842,34,'left','#e6ebf2',.95,800);txt('FEELS LIKE',90,884,34,'left','#e6ebf2',.95,800);
 const str=fmtW(s.w==='sun'&&g>=27.99?1960:val);txt(str,90,954,fit(str,62,560,900),'left',g<3?'#ffffff':(g<9?ACC:RED),1,900);
 // world label
 txt(WL[s.w].name,90,700,40,'left','#fff',.95,800);txt(WL[s.w].gl,90,762,52,'left',ACC,1,900)}
// ---------- vision effects: tunnel vision + grey-out + blackout (Sun and neutron star) ----------
function vision(t){const s=seg(t);let k=0;if(s.w==='sun'){k=s.hook?eio((s.lt-.5)/1.6)*.4:eio((s.lt-.4)/1.8)}
 if(s.w==='jupiter')k=.12*eio(s.lt/2);
 if(k<=0)return 0;x.save();

 const r0=lerp(1100,120,k),r1=lerp(1500,520,k);const g=x.createRadialGradient(CXF,1080,r0,CXF,1080,r1);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+cl(.25+.75*k)+')');x.fillStyle=g;x.fillRect(0,0,W,H);
 if(s.w==='sun'&&!s.hook){const bo=eio((s.lt-3.6)/.8)*(1-eio((s.lt-4.6)/.5));x.fillStyle='rgba(0,0,0,'+(.55*bo)+')';x.fillRect(0,0,W,H)}
 x.restore();return k}
