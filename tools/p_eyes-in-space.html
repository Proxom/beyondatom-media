<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- eyes-in-space (series "Your Body in Space"): spaceflight-associated neuro-ocular syndrome (SANS).
     NASA, "International Space Station Research Keeps an Eye on Vision Changes in Space" (3 Aug 2020, updated 2023): symptoms include swelling in the optic disc and flattening of the eye shape;
       signs of SANS appear in roughly 70 percent of crew members, with significant individual variability; headward fluid shift is believed to underlie SANS (likely increased pressure in the head);
       for Barratt and Thirsk, slightly stronger pairs of glasses solved the problem.
     Drawing: the eye, the head and the arrows are illustrations; the flattening and the swelling are exaggerated (labelled). -->
<script>
const W=1080,H=1920,FPS=30,D=28.6,LOOP=28.4;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(70);const ST=[];for(let i=0;i<160;i++)ST.push([R()*W,R()*H,R()*1.8+0.4,R()]);const FIB=[];for(let i=0;i<140;i++)FIB.push([R()*Math.PI*2,R(),R()]);const FL=[];for(let i=0;i<40;i++)FL.push([R(),R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
function bg(u){let g=x.createRadialGradient(540,1000,100,540,1000,1300);g.addColorStop(0,'#14234a');g.addColorStop(1,'#03060f');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(const s of ST){x.fillStyle='rgba(220,230,255,'+(0.35+0.4*Math.sin(u*1.5+s[3]*9)**2)+')';x.beginPath();x.arc(s[0],(s[1]+u*6*s[2])%H,s[2],0,7);x.fill()}}
// front view: big eye in a skin surround; look = iris offset; glasses k
function frontEye(u,k,gl){if(k<=0.01)return;x.save();x.globalAlpha=k;const cx=540,cy=1060;
 x.fillStyle='#d9a383';x.fillRect(0,560,W,1060);let g=x.createLinearGradient(0,560,0,1620);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.25,'rgba(0,0,0,0)');g.addColorStop(.75,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=g;x.fillRect(0,560,W,1060);
 x.fillStyle='#03060f';x.fillRect(0,0,W,560);x.fillRect(0,1620,W,H);
 const blink=u>27.95&&u<28.25?Math.sin((u-27.95)/0.3*Math.PI):0,op=275*(1-blink);
 x.save();x.beginPath();x.moveTo(70,cy);x.quadraticCurveTo(cx,cy-op*1.55,1010,cy);x.quadraticCurveTo(cx,cy+op*1.35,70,cy);x.closePath();
 x.fillStyle='#f4f1ec';x.fill();x.clip();
 g=x.createRadialGradient(cx,cy,100,cx,cy,430);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(150,90,80,.35)');x.fillStyle=g;x.fillRect(0,600,W,900);
 const lx=cx+Math.sin(u*0.7)*40,ly=cy+Math.sin(u*0.5)*14;
 g=x.createRadialGradient(lx,ly,70,lx,ly,205);g.addColorStop(0,'#2f6f6a');g.addColorStop(.6,'#3d8f95');g.addColorStop(1,'#1d3d4f');x.fillStyle=g;x.beginPath();x.arc(lx,ly,205,0,7);x.fill();
 x.lineWidth=3;for(const f of FIB){const a=f[0];x.strokeStyle='rgba('+(f[2]>.5?'180,230,220':'20,50,60')+','+(0.25+0.3*f[1])+')';x.beginPath();x.moveTo(lx+Math.cos(a)*86,ly+Math.sin(a)*86);x.lineTo(lx+Math.cos(a)*(150+50*f[1]),ly+Math.sin(a)*(150+50*f[1]));x.stroke()}
 x.strokeStyle='#10202a';x.lineWidth=10;x.beginPath();x.arc(lx,ly,203,0,7);x.stroke();
 x.fillStyle='#05070a';x.beginPath();x.arc(lx,ly,82,0,7);x.fill();
 // reflection: a small Earth and the window glint
 g=x.createRadialGradient(lx-38,ly-40,2,lx-38,ly-40,30);g.addColorStop(0,'#cfe8ff');g.addColorStop(.6,'#3d7fd0');g.addColorStop(1,'rgba(30,60,120,0)');x.fillStyle=g;x.beginPath();x.arc(lx-38,ly-40,30,0,7);x.fill();
 x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.ellipse(lx+70,ly-80,26,16,-0.6,0,7);x.fill();
 x.restore();
 x.strokeStyle='#3a2418';x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(70,cy);x.quadraticCurveTo(cx,cy-op*1.55,1010,cy);x.stroke();
 for(let i=0;i<14;i++){const q=0.12+i*0.055;const px=lerp(70,1010,q),py=cy-op*1.55*2*q*(1-q)*1.0;x.lineWidth=6;x.beginPath();x.moveTo(px,py);x.lineTo(px-10+i*1.4,py-34);x.stroke()}
 if(gl>0.01){x.save();x.globalAlpha=k*gl;const oy=(1-ease(gl))*-300;x.strokeStyle='#15171c';x.lineWidth=34;x.beginPath();x.roundRect(170,cy-260+oy,740,520,150);x.stroke();
  x.fillStyle='rgba(180,220,255,.12)';x.fill();x.lineWidth=30;x.beginPath();x.moveTo(170,cy-60+oy);x.lineTo(0,cy-110+oy);x.stroke();x.beginPath();x.moveTo(910,cy-60+oy);x.lineTo(W,cy-110+oy);x.stroke();x.restore()}
 x.restore()}
// side view of a head (facing left) with fluid moving up
function head(u,k){if(k<=0.01)return;x.save();x.globalAlpha=k;
 x.fillStyle='#d9a383';x.beginPath();x.moveTo(470,1500);x.lineTo(450,1250);x.bezierCurveTo(330,1230,300,1150,300,1100);x.lineTo(250,1050);x.lineTo(300,990);x.bezierCurveTo(260,860,330,640,560,630);
 x.bezierCurveTo(800,620,880,820,850,1010);x.bezierCurveTo(830,1120,760,1200,700,1240);x.lineTo(720,1500);x.closePath();x.fill();
 x.fillStyle='#3b2a20';x.beginPath();x.moveTo(330,780);x.bezierCurveTo(380,600,800,580,860,820);x.bezierCurveTo(870,900,840,960,820,1000);x.bezierCurveTo(790,860,700,760,560,760);x.bezierCurveTo(450,760,380,800,330,780);x.fill();
 x.fillStyle='#fff';x.beginPath();x.ellipse(375,915,34,20,0,0,7);x.fill();x.fillStyle='#2f6f6a';x.beginPath();x.arc(352,915,15,0,7);x.fill();
 if(u>7.3){const a=ease((u-7.3)/.5);for(const f of FL){const ph=(f[0]+u*0.45)%1;const px=lerp(510,700,f[1]),py=lerp(1500,820,ph);x.save();x.globalAlpha=k*a*Math.sin(ph*Math.PI)*0.9;x.strokeStyle='#5fb8ff';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(px-18,py+16);x.lineTo(px,py);x.lineTo(px+18,py+16);x.stroke();x.restore()}
  const p=0.5+0.5*Math.sin(u*5);x.save();x.globalAlpha=k*a*(0.35+0.3*p);let g=x.createRadialGradient(470,900,10,470,900,190);g.addColorStop(0,'rgba(95,184,255,.8)');g.addColorStop(1,'rgba(95,184,255,0)');x.fillStyle=g;x.beginPath();x.arc(470,900,190,0,7);x.fill();x.restore()}
 x.restore()}
// cross-section (front = left, back = right); f = flattening 0..1, sw = disc swelling 0..1, pr = pressure arrows
function section(u,k,f,sw,pr){if(k<=0.01)return;x.save();x.globalAlpha=k;const cx=470,cy=1060,Rr=340,fl=0.13*f;
 const shape=(r)=>{x.beginPath();for(let i=0;i<=120;i++){const a=i/120*Math.PI*2;let px=Math.cos(a)*r,py=Math.sin(a)*r;if(px>0)px=Math.min(px,r*(1-fl));i?x.lineTo(cx+px,cy+py):x.moveTo(cx+px,cy+py)}x.closePath()};
 // optic nerve
 x.fillStyle='#e8c98f';x.beginPath();x.roundRect(cx+Rr*(1-fl)-30,cy+30,330,100,30);x.fill();x.strokeStyle='#b8955a';x.lineWidth=5;x.stroke();
 shape(Rr);x.fillStyle='#f3efe8';x.fill();x.strokeStyle='#c9c1b4';x.lineWidth=8;x.stroke();
 shape(Rr-22);let g=x.createRadialGradient(cx-60,cy,40,cx,cy,Rr);g.addColorStop(0,'#203a5a');g.addColorStop(1,'#152a44');x.fillStyle=g;x.fill();
 // retina on the back half
 x.save();shape(Rr-22);x.clip();x.strokeStyle='#e0603a';x.lineWidth=14;shape(Rr-26);x.stroke();x.fillStyle='#152a44';x.beginPath();x.rect(cx-Rr,cy-Rr,Rr*0.9,2*Rr);x.fill();x.restore();
 // cornea, iris, lens
 x.fillStyle='rgba(170,220,255,.35)';x.beginPath();x.ellipse(cx-Rr+10,cy,70,160,0,Math.PI/2,Math.PI*1.5);x.fill();x.strokeStyle='rgba(200,235,255,.8)';x.lineWidth=5;x.stroke();
 x.strokeStyle='#3d8f95';x.lineWidth=16;x.beginPath();x.moveTo(cx-Rr+62,cy-150);x.lineTo(cx-Rr+62,cy-60);x.stroke();x.beginPath();x.moveTo(cx-Rr+62,cy+60);x.lineTo(cx-Rr+62,cy+150);x.stroke();
 x.fillStyle='rgba(230,240,255,.85)';x.beginPath();x.ellipse(cx-Rr+105,cy,46,108,0,0,7);x.fill();
 // optic disc (swelling bump)
 const dx=cx+Rr*(1-fl)-24;x.fillStyle=sw>0.05?'rgb(255,'+Math.round(lerp(140,90,sw))+',60)':'#f2a35a';x.beginPath();x.ellipse(dx-sw*18,cy+80,14+sw*26,46+sw*10,0,0,7);x.fill();
 if(sw>0.05){x.save();x.globalAlpha=k*sw*(0.4+0.3*Math.sin(u*6));let gg=x.createRadialGradient(dx-20,cy+80,5,dx-20,cy+80,110);gg.addColorStop(0,'rgba(255,120,60,.9)');gg.addColorStop(1,'rgba(255,120,60,0)');x.fillStyle=gg;x.beginPath();x.arc(dx-20,cy+80,110,0,7);x.fill();x.restore()}
 // pressure arrows on the back
 if(pr>0.01){for(let i=-2;i<=2;i++){const yy=cy+i*95,off=12*Math.sin(u*5+i);x.save();x.globalAlpha=k*pr;x.strokeStyle='#5fb8ff';x.fillStyle='#5fb8ff';x.lineWidth=12;x.lineCap='round';
  const x1=cx+Rr*(1-fl)+130+off,x0=cx+Rr*(1-fl)+30+off;x.beginPath();x.moveTo(x1,yy);x.lineTo(x0+20,yy);x.stroke();x.beginPath();x.moveTo(x0,yy);x.lineTo(x0+30,yy-20);x.lineTo(x0+30,yy+20);x.closePath();x.fill();x.restore()}}
 txt('FRONT',cx-Rr+20,cy-Rr-30,46,'#cfe9ff',k*0.9);txt('BACK',cx+Rr-40,cy-Rr-30,46,'#cfe9ff',k*0.9*(1-ease((u-15.2)/.4)));
 x.restore()}
function chips(u){const on=(u>=3.5&&u<7.3)||(u>=20.1&&u<23.8);if(!on)return;const a0=u<7.3?3.5:20.1,a1=u<7.3?7.3:23.8;const a=Math.min(ease((u-a0)/.3),ease((a1-u)/.3));const L=[['10%',270],['40%',540],['70%',810]];
 for(let i=0;i<3;i++){const [s,cx]=L[i];const ai=a*ease((u-a0-i*0.3)/.25);if(ai<=0.01)continue;const rev=u>=21.8;const win=i==2&&rev,lose=i!=2&&rev;
  x.save();x.globalAlpha=ai*(lose?0.35:1);x.fillStyle=win?'#1f9d55':'rgba(20,24,32,.85)';x.beginPath();x.roundRect(cx-110,620,220,100,22);x.fill();x.strokeStyle=win?'#8dffb8':'#ffd166';x.lineWidth=5;x.stroke();x.restore();
  txt(s,cx,697,70,'#fff',ai*(lose?0.35:1))}}
const CARDS=[[-1,3.5,'SPACE CAN CHANGE','YOUR EYES'],[3.5,7.1,'GUESS: HOW MANY','CREW SHOW SIGNS?'],[7.1,11.2,'FLUIDS SHIFT UP','TOWARD THE HEAD'],[11.2,14.2,'PRESSURE ON THE','BACK OF THE EYE'],
 [14.2,17.2,'THE BACK OF THE','EYE CAN FLATTEN'],[17.2,20.1,'THE OPTIC DISC','CAN SWELL'],[20.1,23.8,'SIGNS IN ABOUT 70%','OF CREW MEMBERS'],[23.8,26.4,'SOME NEEDED','STRONGER GLASSES'],[26.4,27.7,'WOULD YOU','RISK IT?'],[27.7,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'SPACE CAN CHANGE','YOUR EYES']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,840),fit(l2,80,840));const g=x.createLinearGradient(0,320,0,600);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.6*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,280);
 txt(l1,495,420,sz,'#fff',al);txt(l2,495,420+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;bg(u);
 const fk=u<7.1?ease((7.1-u)/.4):u>=20.1?ease((u-20.1)/.4):0;
 const hk=u>=6.9&&u<11.4?Math.min(ease((u-6.9)/.4),ease((11.4-u)/.4)):0;
 const sk=u>=11.0&&u<20.3?Math.min(ease((u-11.0)/.4),ease((20.3-u)/.4)):0;
 // camera push: slow zoom on every phase
 const zm=1+0.03*Math.sin(u*0.5);x.save();x.translate(540,1060);x.scale(zm,zm);x.translate(-540,-1060);
 head(u,hk);section(u,sk,ease((u-14.6)/1.8),ease((u-17.4)/1.4),u>=11.4&&u<17?Math.min(ease((u-11.4)/.4),ease((17-u)/.5)):0);frontEye(u,fk,ease((u-24.0)/0.7)*(u<26.4?1:ease((26.9-u)/.5)));x.restore();
 if(sk>0.01){const a1=sk*ease((u-15.6)/.4),a2=sk*ease((u-18.4)/.4);txt('FLATTENED',760,725,60,'#ffd166',a1);txt('SWOLLEN',690,1320,58,'#ff9a6b',a2);txt('OPTIC DISC',690,1380,50,'#ff9a6b',a2);
  txt('CHANGES EXAGGERATED',500,1436,30,'#cfe9ff',Math.max(a1,a2)*0.9)}
 if(u>=21.8&&u<23.8){const a=Math.min(ease((u-21.8)/.25),ease((23.8-u)/.3));txt('70%',540,1180,220,'#8dffb8',a)}
 chips(u);cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
