<!doctype html><meta charset=utf8>
<style>@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Mont;src:url(fonts/Montserrat-ExtraBold.ttf)}body{margin:0;background:#000}</style>
<body><canvas id=c width=1080 height=1920></canvas>
<!-- timer-four-worlds (series "Who Lands First?" / same experiment on 4 worlds): the same 30-second sand timer on Earth, Mars, the Moon and Pluto.
     Physics: sand leaves a small hole at a steady rate (independent of how much sand is left) and that rate grows with the square root of gravity
       (Beverloo, Leniger & van de Velde, Chem. Eng. Sci. 15, 260 (1961); square-root scaling confirmed above and below Earth gravity in
       "Influence of the gravity on the discharge of a silo", Granular Matter 15, 263 (2013), doi 10.1007/s10035-013-0403-2).
     So the time goes with 1/sqrt(g): T = 30 s * sqrt(9.82/g). NSSDC mean surface gravity: Earth 9.82, Mars 3.73, Moon 1.62, Pluto 0.62 m/s^2.
       Earth 30.0 s, Mars 48.7 s, Moon 73.9 s, Pluto 119.4 s (1:59).
     The clocks show the real time; the motion is sped up (about 5x, then 6.6x after the Moon finishes). Landscapes are illustrative. -->
<script>
const W=1080,H=1920,FPS=30,D=33.4,LOOP=33.2;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>{t=cl(t);return t*t*(3-2*t)},lerp=(a,b,k)=>a+(b-a)*k;
const cv=document.getElementById('c'),x=cv.getContext('2d');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(9);const STARS=[];for(let i=0;i<60;i++)STARS.push([R(),R(),R()]);const GR=[];for(let i=0;i<40;i++)GR.push([R(),R()]);
function txt(s,px,py,size,col,al,font,align){if(al<=0.01)return;x.save();x.globalAlpha=cl(al);x.font=size+'px '+(font||'Anton');x.textAlign=align||'center';x.textBaseline='alphabetic';
 x.fillStyle=col||'#fff';x.shadowColor='rgba(0,0,0,.95)';x.shadowBlur=22;x.fillText(s,px,py);x.shadowBlur=6;x.fillText(s,px,py);x.restore()}
function fit(s,size,maxw,font){x.font=size+'px '+(font||'Anton');const w=x.measureText(s).width;return w>maxw?size*maxw/w:size}
const G=9.82;
const WORLDS=[{n:'EARTH',g:9.82,p:'100%',sky:['#3d7fd1','#9ccbf0'],gnd:['#4f8f3a','#2f6125'],stars:0},
 {n:'MARS',g:3.73,p:'38%',sky:['#8a5a3c','#d8a678'],gnd:['#b5552b','#7a3216'],stars:0},
 {n:'THE MOON',g:1.62,p:'16%',sky:['#05060a','#10131c'],gnd:['#8d8d8d','#5b5b5b'],stars:1},
 {n:'PLUTO',g:0.62,p:'6%',sky:['#04050a','#0d0f1a'],gnd:['#d9c7ad','#9c8468'],stars:1}];
for(const w of WORLDS)w.T=30*Math.sqrt(G/w.g);
// real time shown on the clocks as a function of video time u
const K1=5.09,UM=(WORLDS[2].T-2)/K1,K2=(WORLDS[3].T-WORLDS[2].T)/(21.0-UM);
function realT(u){return u<UM?2+K1*u:WORLDS[2].T+K2*(u-UM)}
// hourglass profile and volume table (s = 0 at the neck, 1 at the far end)
const HH=132,BW=74,NK=7;const hw=s=>NK+(BW-NK)*Math.sqrt(1-(1-s)*(1-s));
const VT=[0];for(let i=1;i<=200;i++){const s=(i-.5)/200;VT.push(VT[i-1]+hw(s)*hw(s)/200)}const VTOT=VT[200];
function sOfV(v){// s such that volume from the neck to s = v
 let i=0;while(i<200&&VT[i+1]<v)i++;return i>=200?1:(i+(v-VT[i])/(VT[i+1]-VT[i]))/200}
function sOfVfromEnd(v){return sOfV(VTOT-v)}// level holding volume v measured from the far end
function profile(s0,s1,sign){// polygon between s0 and s1 on one bulb (sign -1 = top, +1 = bottom)
 x.beginPath();const N=24;for(let k=0;k<=N;k++){const s=lerp(s0,s1,k/N);x.lineTo(hw(s),sign*s*HH)}for(let k=N;k>=0;k--){const s=lerp(s0,s1,k/N);x.lineTo(-hw(s),sign*s*HH)}x.closePath()}
function hourglass(f,u,flow){// f = fraction of sand still on top
 // glass back
 x.fillStyle='rgba(200,230,255,.12)';profile(0,1,-1);x.fill();profile(0,1,1);x.fill();
 const sandC='#e8bd62',sandD='#c9973f';
 // top sand: from the neck up to the level holding f of the volume
 if(f>0.002){const sT=sOfV(f*VTOT);let g=x.createLinearGradient(0,-HH,0,0);g.addColorStop(0,sandC);g.addColorStop(1,sandD);x.fillStyle=g;profile(0,sT,-1);x.fill();
  // little dip in the middle of the top surface
  x.fillStyle='rgba(120,80,30,.35)';x.beginPath();x.ellipse(0,-sT*HH+3,hw(sT)*0.55,5,0,0,7);x.fill()}
 // bottom pile, a cone on top of a filled base
 const vb=(1-f)*VTOT;if(vb>0.5){const sB=sOfVfromEnd(vb);const g=x.createLinearGradient(0,0,0,HH);g.addColorStop(0,sandC);g.addColorStop(1,sandD);x.fillStyle=g;profile(sB,1,1);x.fill();
  const mh=Math.min(28,(1-sB)*HH*0.6);x.beginPath();x.moveTo(-hw(sB),sB*HH);x.quadraticCurveTo(0,sB*HH-mh*2,hw(sB),sB*HH);x.closePath();x.fill()}
 // falling stream
 if(f>0.002&&flow){const sB=vb>0.5?sOfVfromEnd(vb):1;x.strokeStyle=sandC;x.lineWidth=4;x.beginPath();x.moveTo(0,0);x.lineTo(0,sB*HH-Math.min(28,(1-sB)*HH*0.6));x.stroke();
  x.fillStyle='rgba(255,230,170,.9)';for(let k=0;k<4;k++){const ph=(u*3+k/4)%1;x.beginPath();x.arc(Math.sin(k*3+u*9)*1.5,ph*sB*HH*0.9,2.4,0,7);x.fill()}}
 // glass outline + highlight
 x.strokeStyle='rgba(220,240,255,.85)';x.lineWidth=4;profile(0,1,-1);x.stroke();profile(0,1,1);x.stroke();
 x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=5;x.beginPath();for(let k=0;k<=20;k++){const s=0.25+k/20*0.6;x.lineTo(-hw(s)+12,-s*HH)}x.stroke();
 // wooden frame
 x.fillStyle='#6b4423';for(const sy of [-1,1]){x.beginPath();x.roundRect(-BW-22,sy*HH+(sy<0?-20:0),2*BW+44,20,8);x.fill()}
 x.fillStyle='#8a5a30';for(const sx of [-1,1]){x.fillRect(sx*(BW+12)-5,-HH,10,2*HH)}}
const CELLS=[[70,600],[510,600],[70,1000],[510,1000]],CW=420,CH=390;
function fmt(r){r=Math.max(0,r);const m=Math.floor(r/60),s=Math.floor(r%60);return m+':'+String(s).padStart(2,'0')}
function cell(i,u,hl){const w=WORLDS[i],[cx0,cy0]=CELLS[i];const r=realT(u);const f=cl(1-r/w.T);const done=r>=w.T;
 x.save();x.beginPath();x.roundRect(cx0,cy0,CW,CH,28);x.clip();
 let g=x.createLinearGradient(0,cy0,0,cy0+CH);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);x.fillStyle=g;x.fillRect(cx0,cy0,CW,CH);
 if(w.stars){for(const s of STARS){x.fillStyle='rgba(255,255,255,'+(0.3+0.5*s[2])+')';x.fillRect(cx0+s[0]*CW,cy0+s[1]*CH*0.7,2,2)}}
 if(i==3){x.fillStyle='rgba(255,250,230,.9)';x.beginPath();x.arc(cx0+CW-70,cy0+70,5,0,7);x.fill()}
 if(i==0){x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.ellipse(cx0+90+((u*6)%300),cy0+110,46,14,0,0,7);x.fill()}
 g=x.createLinearGradient(0,cy0+CH*0.72,0,cy0+CH);g.addColorStop(0,w.gnd[0]);g.addColorStop(1,w.gnd[1]);x.fillStyle=g;x.beginPath();x.moveTo(cx0,cy0+CH*0.74);
 for(let k=0;k<=10;k++)x.lineTo(cx0+k*CW/10,cy0+CH*0.74+Math.sin(k*1.7+i)*7);x.lineTo(cx0+CW,cy0+CH);x.lineTo(cx0,cy0+CH);x.closePath();x.fill();
 x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(cx0+CW/2,cy0+322,110,14,0,0,7);x.fill();
 x.save();x.translate(cx0+CW/2,cy0+190);hourglass(f,u,!done);x.restore();
 // dark band behind the clock
 x.fillStyle='rgba(0,0,0,.45)';x.fillRect(cx0,cy0+CH-58,CW,58);x.restore();
 x.lineWidth=hl>0.01?10:4;x.strokeStyle=hl>0.01?hlCol(hl):'rgba(255,255,255,.35)';x.beginPath();x.roundRect(cx0,cy0,CW,CH,28);x.stroke();
 txt(w.n,cx0+34,cy0+56,fit(w.n,46,170),'#fff',1,'Anton','left');txt('GRAVITY '+w.p,cx0+CW-34,cy0+50,30,'#ffd166',1,'Mont','right');
 const hide=i==3&&u>=16.3&&u<21.0;const s=hide?'?:??':done?fmt(Math.round(w.T)):fmt(r);
 txt(s,cx0+CW/2,cy0+CH-10,52,done?'#7dffa8':'#fff',1)}
let HLC='255,209,102';function hlCol(a){return 'rgba('+HLC+','+a+')'}
function chips(u){if(u<16.5||u>=23.5)return;const a=Math.min(ease((u-16.5)/.3),ease((23.5-u)/.3));const L=[['1 MIN',270],['2 MIN',540],['5 MIN',810]];
 for(let i=0;i<3;i++){const [s,cx]=L[i];const ai=a*ease((u-16.6-i*0.45)/.25);if(ai<=0.01)continue;const win=i==1&&u>=21.05;const lose=i!=1&&u>=21.05;
  x.save();x.globalAlpha=ai*(lose?0.35:1);x.fillStyle=win?'#1f9d55':'rgba(20,24,32,.88)';x.beginPath();x.roundRect(cx-115,470,230,92,22);x.fill();x.strokeStyle=win?'#8dffb8':'#ffd166';x.lineWidth=5;x.stroke();x.restore();
  txt(s,cx,536,58,'#fff',ai*(lose?0.35:1))}}
const CARDS=[[-1,16.3,'SAME 30-SECOND TIMER','WHICH RUNS OUT LAST?'],[16.3,21.05,'PLUTO: HOW LONG?',''],[21.05,23.5,'ABOUT 2 MINUTES!',''],
 [23.5,26.4,'WEAKER GRAVITY,','SLOWER SAND'],[26.4,30.5,'16 TIMES WEAKER PULL','4 TIMES SLOWER TIMER'],[30.5,32.2,'WOULD YOU','WAIT THAT LONG?'],[32.2,LOOP,'FOLLOW →','MORE EVERY DAY'],[LOOP,D+1,'SAME 30-SECOND TIMER','WHICH RUNS OUT LAST?']];
function cards(t){for(const [a,b,l1,l2] of CARDS){if(t<a||t>=b)continue;const al=Math.min(a<=0||b>D?1:ease((t-a)/.2),b>D?1:ease((b-t)/.18));
 const sz=Math.min(fit(l1,80,840),l2?fit(l2,80,840):80);const g=x.createLinearGradient(0,320,0,600);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.4,'rgba(0,0,0,'+(0.7*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,320,W,280);
 txt(l1,495,420,sz,'#fff',al);if(l2)txt(l2,495,420+sz*1.08,sz,'#ffd166',al)}}
function draw(t){x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;const u=t>=LOOP?t-D:t;
 x.fillStyle='#07090f';x.fillRect(0,0,W,H);
 const bg=x.createRadialGradient(540,1000,100,540,1000,1100);bg.addColorStop(0,'#1a2140');bg.addColorStop(1,'#05060b');x.fillStyle=bg;x.fillRect(0,0,W,H);
 for(const s of STARS){x.fillStyle='rgba(255,255,255,'+(0.2+0.4*s[2])+')';x.fillRect(s[0]*W,s[1]*H,2,2)}
 // slow push-in on the grid; zoom a bit toward Pluto during the guess and the answer
 const pz=u>=16.3&&u<30.5?Math.min(ease((u-16.3)/1.2),ease((30.5-u)/.8)):0;
 const z=1+0.0025*Math.max(0,u)*(1-pz)+0.03*pz;x.translate(540,1000);x.scale(z,z);x.translate(-540-8*pz,-1000-10*pz);
 for(let i=0;i<4;i++){let hl=0;
  if(i==3&&u>=16.3&&u<21.05){hl=0.6+0.4*Math.sin(u*6);HLC='255,209,102'}
  if(i==3&&u>=21.05&&u<30.5){hl=Math.min(ease((u-21.05)/.3),ease((30.5-u)/.4));HLC='125,255,168'}
  if(i==0&&u>=26.4&&u<30.5){hl=Math.min(ease((u-26.4)/.3),ease((30.5-u)/.4));HLC='255,209,102'}
  cell(i,u,hl)}
 x.setTransform(1,0,0,1,0,0);
 txt('SPED UP · CLOCKS SHOW REAL TIME',495,1436,26,'rgba(255,255,255,.75)',1,'Mont');
 chips(u);cards(t)}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mont')]).then(()=>{window.TEXREADY=true});
</script>
