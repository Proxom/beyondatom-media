<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id=c width=1080 height=1920></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920;
let seed=5;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
const stars=[];for(let i=0;i<200;i++)stars.push([rnd()*W,rnd()*H,rnd()*1.5+.3,rnd()*6.28]);
function txt(s,y,size,col,alpha,al){x.save();x.globalAlpha=alpha;x.fillStyle=col;x.font='bold '+size+'px "DejaVu Sans",Arial,sans-serif';x.textAlign=al||'center';x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=14;s.split('\n').forEach((l,i)=>x.fillText(l,al==='left'?120:W/2,y+i*size*1.25));x.restore()}
const SY=430,P=[{n:'EARTH',y:0,col:'#2f6fd6',r:34,sec:499,t:8},{n:'JUPITER',col:'#d9b38c',r:58,sec:2595,t:16},{n:'NEPTUNE',col:'#4f7bff',r:40,sec:15005,t:23}];
P[0].y=760;P[1].y=1010;P[2].y=1240;
const way=[[0,SY,0],[7,760,499],[10,760,499],[15,1010,2595],[20,1010,2595],[24,1240,15005],[28,1240,15005]];
function fmt(s){if(s<60)return Math.round(s)+' s';if(s<3600){const m=Math.floor(s/60);return m+' min '+String(Math.round(s-m*60)).padStart(2,'0')+' s'}const h=Math.floor(s/3600);return h+' h '+String(Math.round((s-h*3600)/60)).padStart(2,'0')+' min'}
const caps=[[0,7,"The light you see\nleft the Sun 8 min ago."],[7,13,"Light reaches Earth\nafter about 8 min 19 s."],[13,15,"Farther out,\nsunlight is even older."],[15,21,"Jupiter: about 43 min."],[21,24,"Keep going..."],[24,28,"Neptune: about 4 h 10 min.\nMore space: @BeyondAtom"]];
function draw(t){
 x.fillStyle='#04060d';x.fillRect(0,0,W,H);
 for(const s of stars){x.globalAlpha=.4+.4*Math.sin(t*1.5+s[3]);x.fillStyle='#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,6.283);x.fill()}x.globalAlpha=1;
 // sun
 const g=x.createRadialGradient(W/2,SY,40,W/2,SY,190);g.addColorStop(0,'rgba(255,200,60,.9)');g.addColorStop(1,'rgba(255,140,0,0)');x.fillStyle=g;x.beginPath();x.arc(W/2,SY,190,0,6.283);x.fill();
 x.fillStyle='#ffd24a';x.beginPath();x.arc(W/2,SY,78,0,6.283);x.fill();
 x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=3;x.setLineDash([6,14]);x.beginPath();x.moveTo(W/2,SY+80);x.lineTo(W/2,P[2].y);x.stroke();x.setLineDash([]);
 // planets
 for(const p of P){x.fillStyle=p.col;x.beginPath();x.arc(W/2,p.y,p.r,0,6.283);x.fill();txt(p.n,p.y+6,32,'#cfe0ff',1,'left')}
 // pulse position
 let y=SY,sec=0,tt=Math.min(t,28);
 for(let i=0;i<way.length-1;i++){const a=way[i],b=way[i+1];if(tt>=a[0]&&tt<=b[0]){const f=(tt-a[0])/(b[0]-a[0]);y=a[1]+(b[1]-a[1])*f;sec=a[2]+(b[2]-a[2])*f}}
 x.save();x.shadowColor='#ffe27a';x.shadowBlur=30;x.fillStyle='#fff6c8';x.beginPath();x.arc(W/2,y,14,0,6.283);x.fill();x.restore();
 x.strokeStyle='rgba(255,226,122,.55)';x.lineWidth=6;x.beginPath();x.moveTo(W/2,SY+80);x.lineTo(W/2,y);x.stroke();
 // header + timer (frame 0 already shows key number)
 txt('SUNLIGHT TRAVEL TIME',150,50,'#ffffff',1);
 txt('Sunlight is 8 minutes old',215,46,'#ffd45a',1);
 x.fillStyle='rgba(255,255,255,.08)';x.fillRect(120,1320,840,0);
 txt('TIME ON THE WAY: '+fmt(sec),1330,42,'#cfe0ff',1);
 txt('(distances not to scale; average orbits)',1375,26,'#aab8dc',.9);
 for(const cp of caps){if(t>=cp[0]&&t<cp[1]){const a=(cp[0]===0?Math.min(1,(cp[1]-t)*4):Math.min(1,(t-cp[0])*4,(cp[1]-t)*4));txt(cp[2],1450,46,'#ffffff',Math.max(.0,a))}}
}
window.draw=draw;draw(0);
</script>
